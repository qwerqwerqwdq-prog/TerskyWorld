const $=(s,r=document)=>r.querySelector(s);
const el=(tag,attrs={},...children)=>{
  const e=document.createElement(tag);
  for(const k in attrs){
    if(k==='class')e.className=attrs[k];
    else if(k==='html')e.innerHTML=attrs[k];
    else if(k==='style'&&typeof attrs[k]==='object')Object.assign(e.style,attrs[k]);
    else if(k.startsWith('on')&&typeof attrs[k]==='function')e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else if(attrs[k]!=null)e.setAttribute(k,attrs[k]);
  }
  for(const c of children){
    if(c==null||c===false)continue;
    if(typeof c==='string'||typeof c==='number')e.appendChild(document.createTextNode(String(c)));
    else if(Array.isArray(c))c.forEach(x=>{if(x){if(x.nodeType)e.appendChild(x);else e.appendChild(document.createTextNode(String(x)))}});
    else e.appendChild(c);
  }
  return e;
};
function escapeHtml(s){return s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mdToHtml(md){
  if(!md)return '';
  let h=escapeHtml(md);
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>`<pre><code>${c}</code></pre>`);
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  h=h.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/^---$/gm,'<hr>');
  h=h.replace(/^\d+\.\s(.+)$/gm,'<li>$1</li>');
  h=h.replace(/^[-*]\s(.+)$/gm,'<li>$1</li>');
  h=h.replace(/(<li>.*<\/li>\n?)+/g,m=>`<ul>${m}</ul>`);
  h=h.replace(/\n\n/g,'</p><p>');
  h='<p>'+h+'</p>';
  h=h.replace(/<p><(h[1-3]|ul|ol|blockquote|pre|hr)/g,'<$1');
  h=h.replace(/<\/(h[1-3]|ul|ol|blockquote|pre)><\/p>/g,'</$1>');
  h=h.replace(/<p><\/p>/g,'');
  return h;
}
function fmtDate(d){return new Date(d).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}
function fmtDateShort(d){return new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
function formatTimeLeft(ms){
  const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);
  if(h>0)return h+'ч '+m+'м';
  if(m>0)return m+'м';
  return 'Менее минуты';
}
function toast(title,desc='',type='info'){
  const c=$('#toast-container');
  const t=el('div',{class:`toast toast-${type}`},
    el('div',{class:'flex-1'},el('div',{class:'toast-title'},title),desc?el('div',{class:'toast-desc'},desc):null)
  );
  c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},3500);
}
function uid(prefix='id'){return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

  }
  // Если уже новый формат (есть fields) — нормализуем
  if(oldStats.length>0&&oldStats[0].fields){
    return oldStats.map((s,i)=>{
      const legacy=LEGACY_STAT_SECTIONS.find(x=>x.key===s.sectionKey);
      return {
        id:s.id||('sec_'+(i+1)),
        title:s.title||s.sectionTitle||(legacy?legacy.title:('Секция '+(i+1))),
        icon:s.icon||(legacy?legacy.icon:'file'),
        order:typeof s.order==='number'?s.order:i,
        fields:Array.isArray(s.fields)?s.fields.map((f,j)=>({
          id:f.id||('f'+(j+1)),
          label:f.label||('Поле '+(j+1)),
          type:f.type||'text',
          value:f.value!==undefined?f.value:defaultFieldValue(f.type||'text')
        })):[]
      };
    });
  }
  // Старый формат: массив {sectionKey, sectionTitle, content, order}
  return oldStats.map((s,i)=>{
    const legacy=LEGACY_STAT_SECTIONS.find(x=>x.key===s.sectionKey);
    const fields=(legacy?legacy.fields:[]).map((f,j)=>{
      const val=s.content?s.content[f.key]:undefined;
      return {
        id:'f'+(j+1),
        label:f.label,
        type:f.type,
        value:val!==undefined&&val!==null?val:defaultFieldValue(f.type)
      };
    });
    return {
      id:'sec_'+(i+1),
      title:s.sectionTitle||(legacy?legacy.title:('Секция '+(i+1))),
      icon:legacy?legacy.icon:'file',
      order:typeof s.order==='number'?s.order:i,
      fields
    };
  });
}

/* Поиск поля по id внутри секции */
function findField(section,fieldId){
  if(!section||!Array.isArray(section.fields))return null;
  return section.fields.find(f=>f.id===fieldId)||null;
}
function findSection(faction,sectionId){
  if(!faction.stats)return null;
  return faction.stats.find(s=>s.id===sectionId)||null;
}

/* Применение одного эффекта к значению поля */
function applyEffectToValue(oldValue,effect){
  const mode=effect.mode||'set';
  const amount=Number(effect.amount)||0;
  if(effect.fieldType==='list'){
    if(mode==='set'){
      // Для list — amount интерпретируем как строку с разделителями
      const parts=String(effect.amount||'').split('\n').map(s=>s.trim()).filter(Boolean);
      return parts;
    }
    return oldValue;
  }
  if(effect.fieldType==='text'){
    if(mode==='set')return String(effect.amount||'');
    return oldValue;
  }
  // number
  const oldNum=Number(oldValue)||0;
  if(mode==='add')return oldNum+amount;
  if(mode==='subtract')return oldNum-amount;
  if(mode==='set')return amount;
  if(mode==='percent_add')return Math.round(oldNum*(1+amount/100));
  if(mode==='percent_subtract')return Math.round(oldNum*(1-amount/100));
  return oldNum;
}

/* Применение мгновенных эффектов к stats фракции */
function applyInstantEffects(stats,effects){
  if(!effects||!effects.length)return stats;
  const newStats=stats.map(s=>({...s,fields:s.fields.map(f=>({...f}))}));
  effects.forEach(eff=>{
    if(eff.timing!=='instant')return;
    const section=newStats.find(s=>s.id===eff.targetSectionId);
    if(!section)return;
    const field=findField(section,eff.targetFieldId);
    if(!field)return;
    field.value=applyEffectToValue(field.value,{...eff,fieldType:field.type});
  });
  return newStats;
}

/* Применение одного тика для pendingEffect */
function applyPendingEffectTick(stats,effect){
  const section=stats.find(s=>s.id===effect.targetSectionId);
  if(!section)return stats;
  const field=findField(section,effect.targetFieldId);
  if(!field)return stats;
  field.value=applyEffectToValue(field.value,{...effect,fieldType:field.type});
  return stats;
}

/* ====== Раскрытые секции: localStorage persistence ====== */
const EXPANDED_KEY='tersky-expanded-sections';
function getExpandedSections(){
  try{return JSON.parse(localStorage.getItem(EXPANDED_KEY)||'{}')}catch(e){return {}}
}
function saveExpandedSections(obj){
  try{localStorage.setItem(EXPANDED_KEY,JSON.stringify(obj))}catch(e){}
}
function isSectionExpanded(factionId,sectionId,sectionIndex){
  const key=factionId+':'+sectionId;
  const stored=getExpandedSections();
  if(stored.hasOwnProperty(key))return !!stored[key];
  return sectionIndex===0;
}
function setSectionExpanded(factionId,sectionId,expanded){
  const stored=getExpandedSections();
  stored[factionId+':'+sectionId]=!!expanded;
  saveExpandedSections(stored);
}

/* ====== Realtime Database helpers ====== */
const RTDB={
  async push(path,data){
    const ref=fbDb.ref(path).push();
    await ref.set({...data,createdAt:firebase.database.ServerValue.TIMESTAMP});
    return ref.key;
  },
  async set(path,data){await fbDb.ref(path).set(data)},
  async update(path,data){await fbDb.ref(path).update(data)},
  async remove(path){await fbDb.ref(path).remove()},
  async get(path){
    const snap=await fbDb.ref(path).get();
    if(!snap.exists())return null;
    const val=snap.val();
    return Array.isArray(val)?val:Object.entries(val).map(([id,v])=>({id,...(v||{})}));
  },
  async getList(path,sortBy='createdAt'){
    const snap=await fbDb.ref(path).get();
    if(!snap.exists())return [];
    const val=snap.val()||{};
    return Object.entries(val).map(([id,v])=>({id,...(v||{})})).sort((a,b)=>{
      const da=a[sortBy],db=b[sortBy];
      if(typeof da==='number'&&typeof db==='number')return db-da;
      const ta=da?new Date(da).getTime():0,tb=db?new Date(db).getTime():0;
      return tb-ta;
    });
  },
  onValue(path,callback){
    const ref=fbDb.ref(path);
    const unsub=ref.on('value',snap=>{
      const val=snap.val();
      const list=val?Object.entries(val).map(([id,v])=>({id,...(v||{})})).sort((a,b)=>{
        const da=a.createdAt,db=b.createdAt;
        if(typeof da==='number'&&typeof db==='number')return db-da;
        const ta=da?new Date(da).getTime():0,tb=db?new Date(db).getTime():0;
        return tb-ta;
      }):[];
      callback(list);
    });
    return ()=>ref.off('value',unsub);
  },
  ts(v){
    if(!v)return new Date().toISOString();
    if(typeof v==='number')return new Date(v).toISOString();
    if(typeof v==='string')return v;
    return new Date().toISOString();
  }
};

/* ====== Состояние приложения ====== */
const App={
  view:'dashboard',selectedId:null,sidebarOpen:false,
  currentUser:null,userProfile:null,
  unsubscribers:[],
  cache:{factions:[],posts:[],news:[],chats:[],battles:[],chronicle:[],bestiary:[],users:[],profileRequests:[]},

  init(){
    document.addEventListener('contextmenu',e=>{e.preventDefault();return false});
    document.addEventListener('dragstart',e=>{e.preventDefault();return false});
    document.addEventListener('copy',e=>{
      const t=e.target;
      if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
      e.preventDefault();return false;
    });
    document.addEventListener('keydown',e=>{
      const k=e.key.toLowerCase();
      if(e.key==='F12'){e.preventDefault();return false}
      if(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k)){e.preventDefault();return false}
      if(e.ctrlKey&&['u','s','p'].includes(k)){e.preventDefault();return false}
    });

    if(!firebaseReady){this.render();return}

    fbAuth.onAuthStateChanged(async(user)=>{
      this.clearSubscriptions();
      if(user){
        const snap=await fbDb.ref('users/'+user.uid).get();
        if(snap.exists()){
          this.currentUser=user;
          this.userProfile={id:user.uid,...snap.val()};
        }else{
          const usersSnap=await fbDb.ref('users').get();
          const isFirst=!usersSnap.exists();
          const profile={
            email:user.email,name:user.email.split('@')[0],
            role:isFirst?'ADMIN':'PLAYER',
            createdAt:new Date().toISOString(),
            lastLoginAt:new Date().toISOString(),
            bio:'',avatarUrl:''
          };
          await fbDb.ref('users/'+user.uid).set(profile);
          this.currentUser=user;
          this.userProfile={id:user.uid,...profile};
        }
        await fbDb.ref('users/'+user.uid+'/lastLoginAt').set(new Date().toISOString());
        this.subscribeToData();
      }else{
        this.currentUser=null;
        this.userProfile=null;
      }
      this.render();
    });
    this.render();
  },

  clearSubscriptions(){this.unsubscribers.forEach(u=>{try{u()}catch(e){}});this.unsubscribers=[]},

  subscribeToData(){
    const collections=['factions','posts','news','chats','battles','chronicle','bestiary','users','profileRequests'];
    collections.forEach(col=>{
      this.unsubscribers.push(
        fbDb.ref(col).on('value',snap=>{
          const val=snap.val()||{};
          this.cache[col]=Object.entries(val).map(([id,v])=>({id,...(v||{})})).sort((a,b)=>{
            if(col==='news')return (b.isPinned?1:0)-(a.isPinned?1:0)||((b.createdAt||0)-(a.createdAt||0));
            const da=a.createdAt,db=b.createdAt;
            if(typeof da==='number'&&typeof db==='number')return db-da;
            const ta=da?new Date(da).getTime():0,tb=db?new Date(db).getTime():0;
            return tb-ta;
          });
          if(this.currentUser)this.render();
        })
      );
    });
  },

  setView(view,selectedId=null){this.view=view;this.selectedId=selectedId;this.sidebarOpen=false;this.render();window.scrollTo(0,0)},
  async logout(){try{await fbAuth.signOut()}catch(e){}},

  render(){
    const root=$('#app');
    root.innerHTML='';
    if(!firebaseReady){root.appendChild(SetupScreen());return}
    if(!this.currentUser){root.appendChild(AuthScreen());return}
    root.appendChild(AppShell());
  },
};

    card.appendChild(el('div',{class:'auth-tabs'},
      el('button',{class:'auth-tab'+(state.mode==='login'?' active':''),onclick:()=>{state.mode='login';renderForm()}},'Вход'),
      el('button',{class:'auth-tab'+(state.mode==='register'?' active':''),onclick:()=>{state.mode='register';renderForm()}},'Регистрация'),
    ));
    const form=el('form',{onsubmit:e=>{e.preventDefault();submit()}});
    if(state.mode==='register'){
      form.appendChild(el('div',{class:'field-group'},
        el('label',{class:'label'},'Имя правителя'),
        el('input',{class:'input',placeholder:'Имя правителя...',value:state.name,oninput:e=>state.name=e.target.value,required:true})
      ));
    }
    form.appendChild(el('div',{class:'field-group'},
      el('label',{class:'label'},'Электронная почта'),
      el('div',{class:'input-with-icon'},
        el('span',{class:'icon',html:ICONS.mail}),
        el('input',{class:'input',type:'email',placeholder:'правитель@государство.рф',value:state.email,oninput:e=>state.email=e.target.value,required:true})
      )
    ));
    form.appendChild(el('div',{class:'field-group'},
      el('label',{class:'label'},'Пароль'),
      el('div',{class:'input-with-icon'},
        el('span',{class:'icon',html:ICONS.shield}),
        el('input',{class:'input',type:'password',placeholder:'••••••••',value:state.password,oninput:e=>state.password=e.target.value,required:true})
      )
    ));
    form.appendChild(el('button',{type:'submit',class:'btn btn-primary w-full',style:{height:'44px',marginTop:'8px'}},state.mode==='login'?'Войти в мир':'Создать правителя'));
    card.appendChild(form);
    card.appendChild(el('p',{class:'text-center text-muted text-xs italic',style:{marginTop:'20px'}},'Первый зарегистрированный становится Администратором игры'));
    formWrap.appendChild(card);
  }
  async function submit(){
    const{name,email,password}=state;
    if(!email||!password||(state.mode==='register'&&!name)){toast('Ошибка','Заполните все поля','error');return}
    if(state.mode==='register'&&password.length<6){toast('Ошибка','Пароль минимум 6 символов','error');return}
    try{
      if(state.mode==='register'){
        const cred=await fbAuth.createUserWithEmailAndPassword(email.toLowerCase(),password);
        const usersSnap=await fbDb.ref('users').get();
        const isFirst=!usersSnap.exists();
        await fbDb.ref('users/'+cred.user.uid).set({
          email:email.toLowerCase(),name,role:isFirst?'ADMIN':'PLAYER',
          createdAt:new Date().toISOString(),lastLoginAt:new Date().toISOString(),
          bio:'',avatarUrl:''
        });
        toast('Добро пожаловать',isFirst?'Аккаунт администратора создан':'Аккаунт создан','success');
      }else{
        await fbAuth.signInWithEmailAndPassword(email.toLowerCase(),password);
        toast('Вход выполнен','Да пребудет с вами мудрость предков','success');
      }
    }catch(e){
      let msg=e.message||'Ошибка';
      if(e.code==='auth/email-already-in-use')msg='Email уже используется';
      else if(e.code==='auth/wrong-password')msg='Неверный пароль';
      else if(e.code==='auth/user-not-found')msg='Пользователь не найден';
      else if(e.code==='auth/invalid-email')msg='Некорректный email';
      else if(e.code==='auth/weak-password')msg='Слабый пароль';
      toast('Ошибка',msg,'error');
    }
  }
  renderForm();right.appendChild(formWrap);wrap.appendChild(right);
  return wrap;
}

function openProfileEditor(user){
  const modal=el('div',{class:'modal-overlay'});
  const card=el('div',{class:'card card-glow modal-card'});
  const isAdmin=user.role==='ADMIN';
  card.appendChild(el('h2',{class:'mb-4'},'Редактирование профиля'));
  const state={name:user.name||'',avatarUrl:user.avatarUrl||'',bio:user.bio||''};
  const form=el('form',{onsubmit:e=>{e.preventDefault();save()}});
  form.appendChild(el('div',{class:'field-group'},
    el('label',{class:'label'},'Имя *'),
    el('input',{class:'input',value:state.name,oninput:e=>state.name=e.target.value,required:true})
  ));
  form.appendChild(el('div',{class:'field-group'},
    el('label',{class:'label'},'URL аватара (опц.)'),
    el('input',{class:'input',type:'url',placeholder:'https://...',value:state.avatarUrl,oninput:e=>state.avatarUrl=e.target.value})
  ));
  form.appendChild(el('div',{class:'field-group'},
    el('label',{class:'label'},'Описание / Bio'),
    el('textarea',{class:'textarea',style:{minHeight:'100px'},placeholder:'Расскажите о себе, своём стиле игры и правителе княжества...',oninput:e=>state.bio=e.target.value},state.bio)
  ));
  form.appendChild(el('p',{class:'text-muted text-xs italic'},isAdmin?
    'Изменения будут применены сразу, так как вы администратор.':
    'Запрос будет отправлен администратору на одобрение.'));
  form.appendChild(el('div',{class:'flex gap-2 justify-end mt-4'},
    el('button',{type:'button',class:'btn btn-ghost',onclick:()=>modal.remove()},'Отмена'),
    el('button',{type:'submit',class:'btn btn-primary'},el('span',{html:ICONS.save}),'Сохранить')
  ));
  card.appendChild(form);
  modal.appendChild(card);
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
  document.body.appendChild(modal);
  async function save(){
    const newData={
      name:state.name.trim(),
      avatarUrl:state.avatarUrl.trim(),
      bio:state.bio
    };
    if(!newData.name){toast('Ошибка','Имя обязательно','error');return}
    try{
      if(isAdmin){
        await RTDB.update('users/'+user.id,newData);
        toast('Профиль обновлён','','success');
        modal.remove();App.render();
      }else{
        const oldData={name:user.name||'',avatarUrl:user.avatarUrl||'',bio:user.bio||''};
        await RTDB.push('profileRequests',{
          userId:user.id,
          userName:user.name||'',
          userEmail:user.email||'',
          oldData,
          newData,
          status:'PENDING',
        });
        toast('Запрос отправлен','Запрос на изменение профиля отправлен администратору на одобрение','success');
        modal.remove();App.render();
      }
    }catch(e){toast('Ошибка',e.message,'error')}
  }
}

    });

    }},'Утвердить'));
  }
  header.appendChild(hb);wrap.appendChild(header);

  /* Блок активных эффектов (pendingEffects) */
  const pendingEffects=Array.isArray(faction.pendingEffects)?faction.pendingEffects:[];
  if(pendingEffects.length>0){
    const effCard=el('div',{class:'card',style:{background:'rgba(58,125,116,0.05)',borderColor:'rgba(58,125,116,0.3)'}});
    effCard.appendChild(el('div',{class:'flex items-center justify-between mb-3'},

        el('span',{html:ICONS.bolt,style:{color:'var(--accent)',width:'16px',height:'16px'}}),

          const inputEl=e.target.previousElementSibling;
          const n=Math.max(1,parseInt(inputEl.value,10)||1);
          await applyPendingEffectsNTurns(faction,n);
        }},'Применить N ходов')
      ):null

    pendingEffects.forEach((eff,idx)=>{

          el('div',{class:'effect-target'},eff.fieldName||'поле'),

            modeLabel(eff.mode)+' '+eff.amount+
            (eff.timing==='per_turn'?' · каждый ход':eff.timing==='over_turns'?' · осталось ходов: '+eff.turns:' · мгновенно')
          ),
          eff.note?el('div',{class:'effect-note'},eff.note):null
        ),
        isAdmin?el('button',{class:'btn btn-ghost btn-sm',onclick:async ()=>{
          await applyPendingEffectsNTurns(faction,1,idx);
        }},'Применить ход'):null
      ));

function pluralFields(n){return n===1?'поле':(n>=2&&n<=4?'поля':'полей')}

function renderStatContent(section){
  if(!section||!section.fields||section.fields.length===0){
    return el('p',{class:'text-muted italic text-sm'},'Нет данных');
  }
  const wrap=el('div',{});
  const gridClass=section.fields.length<=4?'stat-grid-2':(section.fields.length<=6?'stat-grid-3':'stat-grid-4');
  const grid=el('div',{class:gridClass});
  let renderedCount=0;
  section.fields.forEach(f=>{
    const val=f.value;
    if(f.type==='list'){
      const items=Array.isArray(val)?val.filter(Boolean):[];
      if(items.length===0)return;
      grid.appendChild(el('div',{class:'stat-field',style:{gridColumn:'1 / -1'}},
        el('div',{class:'stat-field-label'},f.label),
        el('ul',{style:{listStyle:'none',paddingLeft:'0',marginTop:'4px'}},

        )
      ));
      renderedCount++;
    }else if(f.type==='number'){
      const num=typeof val==='number'?val:(Number(val)||0);
      grid.appendChild(el('div',{class:'stat-field'},el('div',{class:'stat-field-label'},f.label),el('div',{class:'stat-field-value-number'},formatNumber(num))));
      renderedCount++;
    }else{
      const txt=val==null?'':String(val);

      grid.appendChild(el('div',{class:'stat-field'},el('div',{class:'stat-field-label'},f.label),el('div',{class:'stat-field-value'},txt)));
      renderedCount++;
    }
  });
  if(renderedCount===0)return el('p',{class:'text-muted italic text-sm'},'Нет данных');
  wrap.appendChild(grid);
  return wrap;
}
function formatNumber(n){
  if(typeof n!=='number')n=Number(n)||0;

}

async function moveSection(faction,sectionId,direction){
  const stats=migrateStats(faction.stats||[]);
  const idx=stats.findIndex(s=>s.id===sectionId);
  if(idx<0)return;
  const newIdx=idx+direction;
  if(newIdx<0||newIdx>=stats.length)return;
  const tmp=stats[idx];stats[idx]=stats[newIdx];stats[newIdx]=tmp;
  /* Переписать order */
  stats.forEach((s,i)=>s.order=i);
  try{
    await RTDB.update('factions/'+faction.id,{stats});
    toast('Секция перемещена','','info');
  }catch(e){toast('Ошибка',e.message,'error')}
}

async function deleteSection(faction,sectionId){
  if(!confirm('Удалить секцию целиком? Все поля секции будут потеряны.'))return;
  const stats=migrateStats(faction.stats||[]).filter(s=>s.id!==sectionId);
  stats.forEach((s,i)=>s.order=i);
  try{
    await RTDB.update('factions/'+faction.id,{stats});
    toast('Секция удалена','','info');
  }catch(e){toast('Ошибка',e.message,'error')}
}

/* ====== Применение pendingEffects (N тиков) ====== */
async function applyPendingEffectsNTurns(faction,turns,onlyIdx){
  try{
    const stats=migrateStats(faction.stats||[]);
    let pending=Array.isArray(faction.pendingEffects)?faction.pendingEffects.map(e=>({...e})):[];
    const updates=[];
    for(let i=0;i<turns;i++){
      let applied=false;
      const toRemove=[];
      pending.forEach((eff,idx)=>{
        if(onlyIdx!==undefined&&idx!==onlyIdx)return;
        /* Применить один тик */
        const section=stats.find(s=>s.id===eff.targetSectionId);
        if(section){
          const field=findField(section,eff.targetFieldId);
          if(field){
            field.value=applyEffectToValue(field.value,{...eff,fieldType:field.type});
            applied=true;
            if(eff.timing==='over_turns'){
              eff.turns=(eff.turns||0)-1;
              if(eff.turns<=0)toRemove.push(idx);
            }
            /* per_turn — остаётся в pending */
          }else{
            toRemove.push(idx);
          }
        }else{
          toRemove.push(idx);
        }
      });
      /* Удалить завершённые (с конца) */
      toRemove.reverse().forEach(idx=>pending.splice(idx,1));
      if(!applied)break;
      if(pending.length===0)break;
      if(onlyIdx!==undefined)break;
    }
    await RTDB.update('factions/'+faction.id,{stats,pendingEffects:pending});
    toast('Эффекты применены','','success');
  }catch(e){toast('Ошибка',e.message,'error')}
}

  form.appendChild(el('div',{class:'field-group'},el('label',{class:'label'},'Техническая часть (опц.)'),el('textarea',{class:'textarea',placeholder:'Технические пояснения...',style:{minHeight:'80px'},oninput:e=>state.technicalText=e.target.value},state.technicalText)));

      ));

    const formInner=el('div',{class:'card',style:{background:'rgba(58,125,116,0.05)',borderColor:'rgba(58,125,116,0.25)',padding:'12px'}});

        const eff={

      await RTDB.update('posts/'+post.id,{status:'VERDICTED',verdict});
      if(faction&&state.effects.length){
        const stats=migrateStats(faction.stats||[]);
        const instantEffects=state.effects.filter(e=>e.timing==='instant');
        const pendingEffects=state.effects.filter(e=>e.timing==='per_turn'||e.timing==='over_turns');
        let newStats=stats;
        if(instantEffects.length){
          newStats=applyInstantEffects(stats,instantEffects);
        }
        const updateData={stats:newStats};
        if(pendingEffects.length){
          const existingPending=Array.isArray(faction.pendingEffects)?faction.pendingEffects:[];
          updateData.pendingEffects=[...existingPending,...pendingEffects];
        }
        await RTDB.update('factions/'+faction.id,updateData);
      }
      toast('Вердикт вынесен',state.effects.length?'Статистика обновлена':'Вердикт сохранён','success');
      App.setView('admin-posts');
    }catch(e){toast('Ошибка',e.message,'error')}
  }

}
