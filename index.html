/* ============================================================
   FEATURE #9: ЭКОНОМИЧЕСКИЕ ГРАФИКИ (SVG)
   ============================================================ */
/* Extract stat history values per turn from faction.statHistory and recentChanges */
function extractEconomicSeries(faction){
  /* We extract values for fields that look numeric and money-related */
  const stats=migrateStats(faction.stats||[]);
  const fieldsByLabel={};
  /* Map field labels to (sectionId, fieldId, currentValue) */
  stats.forEach(sec=>{
    (sec.fields||[]).forEach(f=>{
      const lbl=(f.label||'').toLowerCase();
      const isMoney=lbl.indexOf('казн')>=0||lbl.indexOf('доход')>=0||lbl.indexOf('расход')>=0||
                    lbl.indexOf('баланс')>=0||lbl.indexOf('солей')>=0||lbl.indexOf('золото')>=0||
                    lbl.indexOf('налог')>=0||lbl.indexOf('насел')>=0||lbl.indexOf('жител')>=0||
                    lbl.indexOf('войск')>=0||lbl.indexOf('арми')>=0||lbl.indexOf('торговл')>=0;
      if(isMoney&&(f.type==='number'||typeof f.value==='number')){
        fieldsByLabel[f.label]={label:f.label,sectionId:sec.id,fieldId:f.id,current:Number(f.value)||0,history:[]};
      }
    });
  });
  /* Populate history from statHistory entries */
  const hist=Array.isArray(faction.statHistory)?faction.statHistory:[];
  /* Order: oldest first */
  const sortedHist=hist.slice().reverse();
  sortedHist.forEach(entry=>{
    if(!Array.isArray(entry.changes))return;
    entry.changes.forEach(ch=>{
      const field=ch.field||'';
      /* Try to find matching label */
      Object.values(fieldsByLabel).forEach(fb=>{
        if(field.indexOf(fb.label)>=0||fb.label.indexOf(field)>=0){
          if(ch.newValue!==undefined&&ch.newValue!==null){
            fb.history.push({value:Number(ch.newValue)||0,turn:entry.turnNumber||null,ts:entry.timestamp});
          }
        }
      });
    });
  });
  return fieldsByLabel;
}
/* Build line chart SVG with multiple series */
function buildEconomicLineChart(seriesArr,opts){
  opts=opts||{};
  const w=opts.width||480,h=opts.height||200,padL=40,padR=12,padT=14,padB=24;
  if(!seriesArr||seriesArr.length===0)return '';
  /* Collect all points across series */
  let maxTurn=0;
  seriesArr.forEach(s=>{
    if(s.history&&s.history.length){
      s.history.forEach(p=>{if(p.turn&&p.turn>maxTurn)maxTurn=p.turn});
    }
  });
  /* Build x-axis by index of points (use turn if available) */
  /* Combine all unique turn numbers */
  const allTurns=new Set();
  seriesArr.forEach(s=>{
    (s.history||[]).forEach(p=>allTurns.add(p.turn||(allTurns.size+1)));
  });
  const turns=Array.from(allTurns).sort((a,b)=>a-b);
  if(turns.length===0){
    /* Single point per series — use index */
    seriesArr.forEach((s,idx)=>{turns.push(idx+1)});
  }
  /* Compute Y range */
  let yMin=Infinity,yMax=-Infinity;
  seriesArr.forEach(s=>{
    if(!s.history||s.history.length===0){
      const v=s.current||0;
      if(v<yMin)yMin=v;
      if(v>yMax)yMax=v;
    }else{
      s.history.forEach(p=>{
        if(p.value<yMin)yMin=p.value;
        if(p.value>yMax)yMax=p.value;
      });
      /* Include current */
      if(s.current<yMin)yMin=s.current;
      if(s.current>yMax)yMax=s.current;
    }
  });
  if(!isFinite(yMin))yMin=0;
  if(!isFinite(yMax))yMax=100;
  if(yMin===yMax){yMin-=1;yMax+=1}
  const yRange=yMax-yMin;
  const xStep=turns.length>1?(w-padL-padR)/(turns.length-1):0;
  /* Colors for series */
  const colors=['#3a7d74','#c45050','#d4a543','#8fbfb5','#a85bd1'];
  let svg='<svg class="chart-modal-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  /* Grid lines */
  for(let i=0;i<=4;i++){
    const y=padT+(h-padT-padB)*(i/4);
    svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="rgba(143,191,181,0.1)" stroke-width="1"/>';
    const val=yMax-(yRange*i/4);
    svg+='<text x="'+(padL-4)+'" y="'+(y+3)+'" text-anchor="end" fill="var(--fg-muted)" font-size="9" font-family="JetBrains Mono,monospace">'+formatNumber(val)+'</text>';
  }
  /* X-axis labels (turn numbers) */
  turns.forEach((t,i)=>{
    const x=padL+i*xStep;
    svg+='<text x="'+x+'" y="'+(h-padB+14)+'" text-anchor="middle" fill="var(--fg-muted)" font-size="9" font-family="JetBrains Mono,monospace">'+(t||'?')+'</text>';
  });
  /* Series lines */
  seriesArr.forEach((s,idx)=>{
    const color=colors[idx%colors.length];
    const pts=(s.history||[]).map((p,i)=>{
      const x=padL+i*xStep;
      const y=padT+(h-padT-padB)*(1-(p.value-yMin)/yRange);
      return [x,y,p.value,p.turn];
    });
    /* If only current value is available (no history), add it as a single point at the last turn */
    if(pts.length===0&&(s.current!==undefined)){
      const x=padL+(turns.length-1)*xStep;
      const y=padT+(h-padT-padB)*(1-(s.current-yMin)/yRange);
      pts.push([x,y,s.current,turns[turns.length-1]]);
    }
    if(pts.length===0)return;
    /* Draw line */
    const path=pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    svg+='<path d="'+path+'" stroke="'+color+'" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>';
    /* Draw points (with hover) */
    pts.forEach(p=>{
      svg+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+color+'" class="chart-pt" data-label="'+escapeHtml(s.label)+'" data-value="'+p[2]+'" data-turn="'+(p[3]||'')+'"/>';
    });
  });
  svg+='</svg>';
  return svg;
}
/* Build area chart for treasury */
function buildEconomicAreaChart(seriesArr,opts){
  opts=opts||{};
  const w=opts.width||480,h=opts.height||160,padL=40,padR=12,padT=14,padB=24;
  if(!seriesArr||seriesArr.length===0)return '';
  /* Use first series only */
  const s=seriesArr[0];
  const pts=(s.history||[]).map((p,i)=>({x:i,y:p.value,turn:p.turn}));
  if(pts.length===0&&s.current!==undefined){
    pts.push({x:0,y:s.current,turn:null});
  }
  if(pts.length===0)return '';
  const yMin=Math.min(...pts.map(p=>p.y),0);
  const yMax=Math.max(...pts.map(p=>p.y),0);
  const yRange=Math.max(1,yMax-yMin);
  const xStep=pts.length>1?(w-padL-padR)/(pts.length-1):0;
  const color='#3a7d74';
  let svg='<svg class="chart-modal-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  /* Grid */
  for(let i=0;i<=4;i++){
    const y=padT+(h-padT-padB)*(i/4);
    svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="rgba(143,191,181,0.1)" stroke-width="1"/>';
    const val=yMax-(yRange*i/4);
    svg+='<text x="'+(padL-4)+'" y="'+(y+3)+'" text-anchor="end" fill="var(--fg-muted)" font-size="9" font-family="JetBrains Mono,monospace">'+formatNumber(val)+'</text>';
  }
  /* Area path */
  let path='';
  pts.forEach((p,i)=>{
    const x=padL+i*xStep;
    const y=padT+(h-padT-padB)*(1-(p.y-yMin)/yRange);
    path+=(i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1)+' ';
  });
  /* Close path to bottom */
  const lastX=padL+(pts.length-1)*xStep;
  const firstX=padL;
  const bottomY=h-padB;
  path+='L'+lastX.toFixed(1)+','+bottomY+' L'+firstX.toFixed(1)+','+bottomY+' Z';
  svg+='<path d="'+path+'" fill="'+color+'" fill-opacity="0.18" stroke="'+color+'" stroke-width="2"/>';
  /* Points */
  pts.forEach(p=>{
    const x=padL+(p.x)*xStep;
    const y=padT+(h-padT-padB)*(1-(p.y-yMin)/yRange);
    svg+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="'+color+'" class="chart-pt" data-label="'+escapeHtml(s.label)+'" data-value="'+p.y+'" data-turn="'+(p.turn||'')+'"/>';
  });
  /* X labels */
  pts.forEach((p,i)=>{
    if(i%Math.max(1,Math.floor(pts.length/6))!==0&&i!==pts.length-1)return;
    const x=padL+i*xStep;
    svg+='<text x="'+x+'" y="'+(h-padB+14)+'" text-anchor="middle" fill="var(--fg-muted)" font-size="9" font-family="JetBrains Mono,monospace">'+(p.turn||'?')+'</text>';
  });
  svg+='</svg>';
  return svg;
}
/* Build bar chart for population */
function buildEconomicBarChart(seriesArr,opts){
  opts=opts||{};
  const w=opts.width||480,h=opts.height||160,padL=40,padR=12,padT=14,padB=24;
  if(!seriesArr||seriesArr.length===0)return '';
  const s=seriesArr[0];
  const pts=(s.history||[]).map((p,i)=>({i,y:p.value,turn:p.turn}));
  if(pts.length===0&&s.current!==undefined){
    pts.push({i:0,y:s.current,turn:null});
  }
  if(pts.length===0)return '';
  const yMax=Math.max(...pts.map(p=>p.y),0);
  const yMin=Math.min(...pts.map(p=>p.y),0);
  const yRange=Math.max(1,yMax-yMin);
  const xStep=(w-padL-padR)/Math.max(1,pts.length);
  const barW=Math.min(28,xStep*0.7);
  const color='#8fbfb5';
  let svg='<svg class="chart-modal-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  /* Grid */
  for(let i=0;i<=4;i++){
    const y=padT+(h-padT-padB)*(i/4);
    svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="rgba(143,191,181,0.1)" stroke-width="1"/>';
    const val=yMax-(yRange*i/4);
    svg+='<text x="'+(padL-4)+'" y="'+(y+3)+'" text-anchor="end" fill="var(--fg-muted)" font-size="9" font-family="JetBrains Mono,monospace">'+formatNumber(val)+'</text>';
  }
  /* Bars */
  pts.forEach((p,i)=>{
    const x=padL+i*xStep+(xStep-barW)/2;
    const valH=(h-padT-padB)*((p.y-yMin)/yRange);
    const y=padT+(h-padT-padB)-valH;
    svg+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW+'" height="'+valH.toFixed(1)+'" fill="'+color+'" fill-opacity="0.6" stroke="'+color+'" stroke-width="1" class="chart-bar" data-label="'+escapeHtml(s.label)+'" data-value="'+p.y+'" data-turn="'+(p.turn||'')+'"/>';
    /* X label */
    svg+='<text x="'+(x+barW/2).toFixed(1)+'" y="'+(h-padB+14)+'" text-anchor="middle" fill="var(--fg-muted)" font-size="9" font-family="JetBrains Mono,monospace">'+(p.turn||'?')+'</text>';
  });
  svg+='</svg>';
  return svg;
}
/* Mini sparkline for treasury (60×20) */
function buildTreasurySparkline(faction){
  if(!faction)return '';
  const series=extractEconomicSeries(faction);
  /* Try to find treasury field */
  const treasuryKey=Object.keys(series).find(k=>{
    const lbl=k.toLowerCase();
    return lbl.indexOf('казн')>=0||lbl.indexOf('баланс')>=0||lbl.indexOf('золото')>=0;
  });
  if(!treasuryKey)return '';
  const s=series[treasuryKey];
  const pts=(s.history||[]).map(p=>p.value);
  if(pts.length===0&&s.current!==undefined)pts.push(s.current);
  if(pts.length===0)return '';
  const min=Math.min(...pts);
  const max=Math.max(...pts);
  const range=Math.max(1,max-min);
  const w=60,h=20;
  const stepX=pts.length>1?w/(pts.length-1):0;
  const path=pts.map((v,i)=>{
    const x=i*stepX;
    const y=h-((v-min)/range)*h;
    return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  const last=pts[pts.length-1];
  const first=pts[0];
  const trendUp=last>first;
  const cls=trendUp?'up':(last<first?'down':'');
  return '<span class="sparkline-inline '+cls+'"><svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><path d="'+path+'" stroke="'+(trendUp?'var(--success)':(last<first?'var(--danger)':'var(--accent)'))+'" stroke-width="1.5" fill="none"/></svg></span>';
}
function openEconomicChartsModal(faction){

    el('div',{class:'flex items-center gap-2'},
      el('span',{html:ICONS.stats,style:{color:'var(--accent)',width:'16px',height:'16px'}}),

    ),
    el('button',{class:'btn btn-ghost btn-icon',onclick:()=>modal.remove()},el('span',{html:ICONS.close}))
  ));
  const seriesMap=extractEconomicSeries(faction);
  const allSeries=Object.values(seriesMap);
  if(allSeries.length===0){
    card.appendChild(el('div',{class:'chart-empty'},'Недостаточно данных для графика. Поля статистики должны содержать слова «казна», «доход», «расход», «баланс», «население» и т.п.'));

  const balanceSeries=allSeries.filter(s=>/баланс|казн|золото|солей/i.test(s.label));

  /* Chart 1: Income/Expense/Balance (line) */
  card.appendChild(el('div',{class:'chart-card-title'},'Доход / Расход / Баланс по ходам'));

  if(chart1Series.length>0){
    const svgHtml=buildEconomicLineChart(chart1Series,{width:480,height:200});
    card.appendChild(el('div',{style:{position:'relative'},html:svgHtml}));

    const legend=el('div',{class:'chart-legend'});
    const colors=['#3a7d74','#c45050','#d4a543','#8fbfb5','#a85bd1'];
    chart1Series.forEach((s,i)=>{
      legend.appendChild(el('span',{class:'chart-legend-item'},
        el('span',{class:'chart-legend-dot',style:{background:colors[i%colors.length]}}),
        el('span',{},s.label)
      ));
    });
    card.appendChild(legend);
  }else{
    card.appendChild(el('div',{class:'chart-empty'},'Нет данных о доходах/расходах/балансе.'));
  }
  /* Chart 2: Treasury (area) */
  card.appendChild(el('div',{class:'chart-card-title',style:{marginTop:'16px'}},'Казна по ходам'));
  if(balanceSeries.length>0){
    const svgHtml=buildEconomicAreaChart([balanceSeries[0]],{width:480,height:160});
    card.appendChild(el('div',{style:{position:'relative'},html:svgHtml}));
  }else{
    card.appendChild(el('div',{class:'chart-empty'},'Нет данных о казне.'));
  }
  /* Chart 3: Population (bar) */
  card.appendChild(el('div',{class:'chart-card-title',style:{marginTop:'16px'}},'Население по ходам'));
  if(populationSeries.length>0){
    const svgHtml=buildEconomicBarChart([populationSeries[0]],{width:480,height:160});
    card.appendChild(el('div',{style:{position:'relative'},html:svgHtml}));
  }else{
    card.appendChild(el('div',{class:'chart-empty'},'Нет данных о населении.'));
  }
  card.appendChild(el('div',{class:'flex justify-end mt-3'},el('button',{class:'btn btn-ghost',onclick:()=>modal.remove()},'Закрыть')));
  modal.appendChild(card);
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
  document.body.appendChild(modal);
  /* Attach hover handlers for tooltips */
  setTimeout(()=>{
    const pts=card.querySelectorAll('.chart-pt, .chart-bar');
    pts.forEach(pt=>{
      pt.addEventListener('mouseenter',e=>{
        const existing=modal.querySelector('.chart-tooltip');
        if(existing)existing.remove();
        const tip=el('div',{class:'chart-tooltip'},
          pt.getAttribute('data-label')+' · ',
          'ход '+(pt.getAttribute('data-turn')||'?'),
          el('br'),
          formatNumber(Number(pt.getAttribute('data-value'))||0)
        );
        modal.appendChild(tip);
        const r=pt.getBoundingClientRect();
        const mr=modal.getBoundingClientRect();
        tip.style.left=(r.left-mr.left+12)+'px';
        tip.style.top=(r.top-mr.top-40)+'px';
      });
      pt.addEventListener('mouseleave',()=>{
        const existing=modal.querySelector('.chart-tooltip');
        if(existing)existing.remove();
      });
    });
  },50);
}

   FEATURE #4: ЧЕРНОВИКИ ПОСТОВ (Drafts list view)
   ============================================================ */
function getPostDrafts(){
  try{return JSON.parse(localStorage.getItem('drafts_posts')||'[]')}catch(e){return []}
}
function savePostDraftsList(arr){
  try{localStorage.setItem('drafts_posts',JSON.stringify(arr))}catch(e){}
}
function deletePostDraft(id){
  const arr=getPostDrafts().filter(d=>d.id!==id);
  savePostDraftsList(arr);
}
function savePostDraft(draft){
  const arr=getPostDrafts();
  const idx=arr.findIndex(d=>d.id===draft.id);
  if(idx>=0)arr[idx]=draft;
  else arr.unshift(draft);
  savePostDraftsList(arr);
}

/* ============================================================
   FEATURE #6: НАБЛЮДЕНИЕ ЗА ФРАКЦИЯМИ (Followed factions)
   ============================================================ */
function getFollowedFactions(){
  try{return JSON.parse(localStorage.getItem('followedFactions')||'[]')}catch(e){return []}
}
function isFactionFollowed(id){
  if(!id)return false;
  return getFollowedFactions().includes(id);
}
function toggleFollowFaction(id){
  if(!id)return false;
  const list=getFollowedFactions();
  const idx=list.indexOf(id);
  if(idx>=0)list.splice(idx,1);
  else list.push(id);
  try{localStorage.setItem('followedFactions',JSON.stringify(list))}catch(e){}
  return idx<0;
}

  const wrap=el('div',{class:'flex flex-col gap-4'});

/* ============================================================
   FEATURE #5: SEARCH INSIDE FACTION DETAILS
   ============================================================ */
/* Highlight matching text in label */
function highlightMatch(text,q){
  if(!q)return document.createTextNode(text||'');
  const orig=String(text||'');
  const lower=orig.toLowerCase();
  const idx=lower.indexOf(q);
  if(idx<0)return document.createTextNode(orig);
  const before=orig.slice(0,idx);
  const match=orig.slice(idx,idx+q.length);
  const after=orig.slice(idx+q.length);
  const frag=document.createDocumentFragment();
  frag.appendChild(document.createTextNode(before));
  const hl=el('span',{class:'search-highlight'},match);
  frag.appendChild(hl);
  frag.appendChild(document.createTextNode(after));
  return frag;
}
/* Wrap renderFieldCards with optional search filter */
function renderFieldCardsWithSearch(section,faction,query){
  const cardsWrap=renderFieldCards(section,faction);
  if(!query)return cardsWrap;
  const q=query.toLowerCase().trim();
  if(!q)return cardsWrap;
  /* Filter field-card elements by label text */
  setTimeout(()=>{
    try{
      const fieldCards=cardsWrap.querySelectorAll('.field-card');
      let visibleCount=0;
      fieldCards.forEach(fc=>{
        const lbl=fc.querySelector('.field-card-label');
        const txt=lbl?lbl.textContent.toLowerCase():'';
        if(txt.includes(q)){
          visibleCount++;
          /* Highlight matches */
          if(lbl){
            const orig=lbl.textContent;
            const idx=orig.toLowerCase().indexOf(q);
            if(idx>=0){
              lbl.innerHTML=escapeHtml(orig.slice(0,idx))+'<span class="search-highlight">'+escapeHtml(orig.slice(idx,idx+q.length))+'</span>'+escapeHtml(orig.slice(idx+q.length));
            }
          }
          fc.style.display='';
        }else{
          fc.style.display='none';
        }
      });
    }catch(e){}
  },0);
  return cardsWrap;
}

/* ============================================================
   TASK 15: DICE VERDICT (D6/D10/D20/D100)
   Бросок судьбы — admin rolls dice for event outcome, applies
   success/fail effects to faction stats, saves result to verdict.diceRoll
   ============================================================ */
const DICE_TYPES=[
  {key:'D6',max:6,label:'D6 — кубик (1-6)'},
  {key:'D10',max:10,label:'D10 — десятигранник (1-10)'},
  {key:'D20',max:20,label:'D20 — двадцатигранник (1-20)'},
  {key:'D100',max:100,label:'D100 — процент (1-100)'},
];
function diceMax(type){
  const t=DICE_TYPES.find(d=>d.key===type);
  return t?t.max:20;
}
function rollDice(type){
  const max=diceMax(type);
  return Math.floor(Math.random()*max)+1;
}
/* Apply dice changes to faction stats + record history (best-effort) */
async function applyDiceRollChanges(faction,changes,post,diceRoll){
  if(!faction||!changes||!Array.isArray(changes)||changes.length===0)return;
  try{
    const {stats,recent}=applyVerdictChanges(faction.stats||[],changes);
    const existingRecent=Array.isArray(faction.recentChanges)?faction.recentChanges:[];
    const mergedRecent=pruneRecentChanges([...recent,...existingRecent]).slice(0,200);
    await RTDB.update('factions/'+faction.id,{stats,recentChanges:mergedRecent});
    /* Record in stat history */
    try{
      await recordStatHistory(faction,'dice_roll',changes.map(c=>({
        field:(c.fieldName||(c.sectionId+'/'+c.fieldId)),
        oldValue:c.oldValue,
        newValue:c.newValue!==undefined?c.newValue:c.value
      })),post?post.id:null,'Бросок судьбы ('+diceRoll.type+': '+diceRoll.result+' '+(diceRoll.isSuccess?'успех':'провал')+')');
    }catch(auditErr){}
  }catch(e){toast('Ошибка применения броска',e.message,'error')}
}
/* Render dice roll result block (used in PostDetail + modal read-only) */
function renderDiceRollBlock(diceRoll,opts){
  opts=opts||{};
  if(!diceRoll||typeof diceRoll!=='object')return null;
  const wrap=el('div',{class:'dice-roll-block'});
  wrap.appendChild(el('div',{class:'dice-roll-header'},
    el('span',{html:ICONS.diceD20,style:{width:'16px',height:'16px',color:'var(--accent)'}}),
    el('span',{},'Бросок судьбы'+(diceRoll.type?' · '+diceRoll.type:''))
  ));
  if(diceRoll.description){
    wrap.appendChild(el('p',{class:'text-sm',style:{marginBottom:'8px',fontStyle:'italic'}},diceRoll.description));
  }
  /* Result + success/fail badge */
  const resultRow=el('div',{style:{display:'flex',alignItems:'center',gap:'12px',flexWrap:'wrap',marginBottom:'8px'}});
  resultRow.appendChild(el('div',{class:'dice-result '+(diceRoll.isSuccess?'success':'fail')},
    'Выпало: '+String(diceRoll.result)+' из '+String(diceMax(diceRoll.type))
  ));
  resultRow.appendChild(el('span',{class:'rumor-status-badge '+(diceRoll.isSuccess?'confirmed':'refuted')},
    el('span',{html:diceRoll.isSuccess?ICONS.thumbsUp:ICONS.thumbsDown,style:{width:'10px',height:'10px'}}),
    diceRoll.isSuccess?'УСПЕХ':'ПРОВАЛ'
  ));
  if(diceRoll.successThreshold!==undefined&&diceRoll.successThreshold!==null){
    resultRow.appendChild(el('span',{class:'text-muted',style:{fontSize:'11px'}},'Условие: ≥'+diceRoll.successThreshold));
  }
  wrap.appendChild(resultRow);
  /* Applied changes summary */
  const applied=Array.isArray(diceRoll.appliedChanges)?diceRoll.appliedChanges:[];
  if(applied.length>0){
    const chList=el('div',{class:'dice-mini-changes'});
    applied.forEach(ch=>{
      const isAdd=ch.operation==='add';
      const isSub=ch.operation==='subtract';
      const isSet=ch.operation==='set';
      const cls=isAdd?'arrow-up':(isSub?'arrow-down':'arrow-set');
      const sign=isAdd?'+':(isSub?'−':'=');
      let amountStr='';
      if(ch.value!==undefined&&ch.value!==null){
        if(typeof ch.value==='number'||(typeof ch.value==='string'&&/^-?\d+(\.\d+)?$/.test(ch.value))){
          amountStr=formatNumber(Number(ch.value)||0);
        }else if(Array.isArray(ch.value)){
          amountStr=ch.value.length+' пункт(ов)';
        }else{
          amountStr=String(ch.value).slice(0,40);
        }
      }
      chList.appendChild(el('div',{class:'dice-mini-change'},
        el('span',{class:cls,style:{fontFamily:'Cinzel,serif',fontWeight:'600'}},sign),
        el('span',{},ch.fieldName||'поле'),
        el('span',{style:{marginLeft:'auto',color:'var(--accent-light)',fontFamily:'Cinzel,serif'}},amountStr)
      ));
    });
    wrap.appendChild(chList);
  }
  if(diceRoll.rolledAt){
    wrap.appendChild(el('p',{class:'text-muted',style:{fontSize:'10px',marginTop:'6px',opacity:'0.7'}},'Бросок сделан: '+fmtDate(RTDB.ts(diceRoll.rolledAt))));
  }
  return wrap;
}
/* Open dice roll modal — opts: {post, faction, existingRoll, onComplete} */
function openDiceRollModal(opts){
  const post=opts&&opts.post;
  const faction=opts&&opts.faction;
  const existingRoll=opts&&opts.existingRoll;
  const onComplete=opts&&opts.onComplete;
  const modal=el('div',{class:'modal-overlay'});
  const card=el('div',{class:'card card-glow modal-card',style:{maxWidth:'560px'}});
  card.appendChild(el('div',{class:'flex justify-between items-center mb-4'},
    el('div',{class:'flex items-center gap-2'},
      el('div',{class:'stat-section-icon',html:ICONS.diceD20}),
      el('h2',{class:'text-accent',style:{fontSize:'16px'}},'Бросок судьбы')
    ),
    el('button',{class:'btn btn-ghost btn-icon',onclick:()=>modal.remove()},el('span',{html:ICONS.close}))
  ));
  /* If existing roll, show read-only result */
  if(existingRoll&&existingRoll.result!==undefined){
    card.appendChild(el('p',{class:'text-muted text-sm italic',style:{marginBottom:'8px'}},'Бросок уже сделан. Результат сохранён в вердикте.'));
    const block=renderDiceRollBlock(existingRoll);
    if(block)card.appendChild(block);
    card.appendChild(el('div',{class:'flex justify-end mt-3'},
      el('button',{class:'btn btn-ghost',onclick:()=>modal.remove()},'Закрыть')
    ));
    modal.appendChild(card);
    modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
    document.body.appendChild(modal);
    return;
  }
  if(!faction){
    card.appendChild(el('div',{class:'card',style:{background:'rgba(212,165,67,0.05)',borderColor:'rgba(212,165,67,0.25)'}},
      el('p',{class:'text-xs text-warning'},'У автора поста нет фракции. Невозможно применить эффекты броска.')
    ));
    card.appendChild(el('div',{class:'flex justify-end mt-3'},
      el('button',{class:'btn btn-ghost',onclick:()=>modal.remove()},'Закрыть')
    ));
    modal.appendChild(card);
    modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
    document.body.appendChild(modal);
    return;
  }
  /* Form state */
  const state={
    diceType:'D20',
    description:'',
    successThreshold:15,
    successChanges:[],
    failChanges:[],
    isRolling:false,
    rolled:false,
    rollResult:null,
    rollSuccess:null,
  };
  const formWrap=el('div');
  function renderForm(){
    formWrap.innerHTML='';
    /* Dice type */
    const typeField=el('div',{class:'field-group'});
    typeField.appendChild(el('label',{class:'label'},'Тип кубика'));
    const typeSel=el('select',{class:'select',onchange:e=>{state.diceType=e.target.value;updateThresholdHint()}});
    DICE_TYPES.forEach(t=>{const o=el('option',{value:t.key},t.label);typeSel.appendChild(o)});
    typeField.appendChild(typeSel);
    formWrap.appendChild(typeField);
    /* Description */
    formWrap.appendChild(el('div',{class:'field-group'},
      el('label',{class:'label'},'Описание броска'),
      el('textarea',{class:'textarea',style:{minHeight:'60px'},placeholder:'Например: Исход битвы с Лодерфесом',oninput:e=>state.description=e.target.value})
    ));
    /* Success threshold */
    const thrField=el('div',{class:'field-group'});
    thrField.appendChild(el('label',{class:'label'},'Условие успеха (≥ значение из кубика)'));
    const thrInp=el('input',{class:'input',type:'number',min:'1',value:String(state.successThreshold),oninput:e=>state.successThreshold=Number(e.target.value)||0});
    thrField.appendChild(thrInp);
    const thrHint=el('p',{class:'text-muted',style:{fontSize:'10px',marginTop:'4px'}},'Если результат ≥ '+state.successThreshold+' (из '+diceMax(state.diceType)+') — успех, иначе провал.');
    thrField.appendChild(thrHint);
    formWrap.appendChild(thrField);
    function updateThresholdHint(){
      thrHint.textContent='Если результат ≥ '+state.successThreshold+' (из '+diceMax(state.diceType)+') — успех, иначе провал.';
    }
    /* Success changes mini-form */
    formWrap.appendChild(renderDiceChangeEditor('Эффект при успехе',state.successChanges,faction));
    /* Fail changes mini-form */
    formWrap.appendChild(renderDiceChangeEditor('Эффект при провале',state.failChanges,faction));
  }
  renderForm();
  card.appendChild(formWrap);
  /* Dice stage (hidden initially) */
  const stage=el('div',{class:'dice-stage',style:{display:'none'}});
  const dice=el('div',{class:'dice-3d'});
  const inner=el('div',{class:'dice-3d-inner'});
  for(let i=1;i<=6;i++)inner.appendChild(el('div',{class:'dice-face f'+i},String(i)));
  dice.appendChild(inner);
  stage.appendChild(dice);
  const resultHolder=el('div');
  stage.appendChild(resultHolder);
  card.appendChild(stage);
  /* Buttons */
  const btnRow=el('div',{class:'flex justify-end gap-2 mt-3'});
  btnRow.appendChild(el('button',{class:'btn btn-ghost',onclick:()=>modal.remove()},'Отмена'));
  const rollBtn=el('button',{class:'btn btn-primary',onclick:async ()=>{
    if(state.isRolling)return;
    state.isRolling=true;
    rollBtn.disabled=true;
    rollBtn.textContent='Бросок...';
    /* Show dice stage */
    formWrap.style.display='none';
    stage.style.display='flex';
    /* Re-add inner (reset animation) */
    dice.classList.remove('rolling');
    void dice.offsetWidth;
    dice.classList.add('rolling');
    /* Wait 1.5s for animation */
    await new Promise(r=>setTimeout(r,1500));
    /* Compute result */
    const result=rollDice(state.diceType);
    const success=result>=state.successThreshold;
    state.rollResult=result;
    state.rollSuccess=success;
    state.rolled=true;
    /* Apply changes */
    const changesToApply=success?state.successChanges:state.failChanges;

    };

    /* Update activity feed via faction update (RTDB listener will refresh) */
    /* Show save button */
    btnRow.innerHTML='';
    btnRow.appendChild(el('button',{class:'btn btn-ghost',onclick:()=>modal.remove()},'Закрыть'));
    btnRow.appendChild(el('button',{class:'btn btn-primary',onclick:()=>{

    }},el('span',{html:ICONS.save}),'Сохранить в вердикт'));

    fieldSelWrap.innerHTML='';
    const fieldSel=el('select',{class:'select',style:{fontSize:'11px'},onchange:()=>{
      local.fieldId=fieldSel.value;
      const sec=stats.find(s=>s.id===local.sectionId);

    }});

    const sec=stats.find(s=>s.id===local.sectionId);
    if(sec)sec.fields.forEach(f=>fieldSel.appendChild(el('option',{value:f.id},f.label)));
    fieldSelWrap.appendChild(fieldSel);
  }
  const opSelWrap=el('div');
  row1.appendChild(opSelWrap);
  function rebuildOpSelect(){
    opSelWrap.innerHTML='';
    const opSel=el('select',{class:'select',style:{fontSize:'11px'},onchange:()=>{local.operation=opSel.value}});
    const sec=stats.find(s=>s.id===local.sectionId);

      [['add','+'],['subtract','−'],['set','=']].forEach(([k,l])=>opSel.appendChild(el('option',{value:k},l)));

/* On-demand castle guestbook subscription (replaces previous if any) */
function subscribeCastleGuestbook(ownerId,callback){
  if(App._castleGuestbookUnsub){try{App._castleGuestbookUnsub()}catch(e){};App._castleGuestbookUnsub=null}
  if(!ownerId||!fbDb){callback([]);return ()=>{}}
  const ref=fbDb.ref('castle/'+ownerId+'/guestbook');
  const cb=snap=>{
    const val=snap.val()||{};
    const list=Object.entries(val).map(([id,v])=>({id,...(v||{})})).sort((a,b)=>{
      const da=a.createdAt,db=b.createdAt;
      if(typeof da==='number'&&typeof db==='number')return db-da;
      const ta=da?new Date(da).getTime():0,tb=db?new Date(db).getTime():0;
      return tb-ta;
    });
    callback(list);
  };
  ref.on('value',cb);
  const unsub=()=>{try{ref.off('value',cb)}catch(e){}};
  App._castleGuestbookUnsub=unsub;
  return unsub;
}

/* ============================================================
   TASK 15: RUMORS — player-published rumors with voting
   ============================================================ */
const RUMOR_LIFETIME_DAYS=7;
const RUMOR_STATUSES=[
  {key:'active',label:'Активен',cls:'active',icon:'whisper'},
  {key:'confirmed',label:'Подтверждён админом',cls:'confirmed',icon:'shieldCheck'},
  {key:'refuted',label:'Опровергнут админом',cls:'refuted',icon:'alert'},
  {key:'expired',label:'Истёк',cls:'expired',icon:'clock'},
];
function isRumorExpired(rumor){
  if(!rumor||!rumor.createdAt)return false;
  if(rumor.status==='confirmed'||rumor.status==='refuted')return false;
  const ts=new Date(RTDB.ts(rumor.createdAt)).getTime();
  return (Date.now()-ts)>RUMOR_LIFETIME_DAYS*24*60*60*1000;
}
function rumorEffectiveStatus(rumor){
  if(!rumor)return 'active';
  if(rumor.status==='confirmed'||rumor.status==='refuted')return rumor.status;
  if(isRumorExpired(rumor))return 'expired';
  return rumor.status||'active';
}
function getRumorStatusBadge(status){
  const s=RUMOR_STATUSES.find(x=>x.key===status)||RUMOR_STATUSES[0];
  return el('span',{class:'rumor-status-badge '+s.cls},
    el('span',{html:ICONS[s.icon]||ICONS.whisper,style:{width:'10px',height:'10px'}}),
    s.label
  );
}
function voteCount(votesObj){
  if(!votesObj||typeof votesObj!=='object')return 0;
  return Object.keys(votesObj).length;
}
function hasUserVoted(rumor,userId,voteType){
  if(!rumor)return false;
  if(voteType==='confirm')return rumor.confirmations&&rumor.confirmations[userId]===true;
  if(voteType==='refute')return rumor.refutations&&rumor.refutations[userId]===true;
  return false;
}
async function voteOnRumor(rumor,voteType){
  if(!rumor||!rumor.id)return;
  const uid=App.userProfile.id;
  const path='rumors/'+rumor.id;
  try{
    /* Read fresh state */
    const snap=await fbDb.ref(path).get();
    const cur=snap.exists()?snap.val():{};
    const confirmations=cur.confirmations||{};
    const refutations=cur.refutations||{};
    if(voteType==='confirm'){
      /* Toggle confirm vote */
      if(confirmations[uid]){
        delete confirmations[uid];
      }else{
        confirmations[uid]=true;
        /* Remove refute vote if exists */
        if(refutations[uid])delete refutations[uid];
      }
    }else if(voteType==='refute'){
      if(refutations[uid]){
        delete refutations[uid];
      }else{
        refutations[uid]=true;
        if(confirmations[uid])delete confirmations[uid];
      }
    }
    await RTDB.update(path,{confirmations,refutations});
  }catch(e){toast('Ошибка',e.message,'error')}
}

/* ============================================================
   ВИЗУАЛЬНЫЕ ЭФФЕКТЫ И АНИМАЦИИ
   ============================================================ */
function initVisualEffects(){
  // ТОЛЬКО ЛЕГКИЕ ЭФФЕКТЫ (без тяжёлых обработчиков mousemove/scroll/MutationObserver)

  // 1. Плавное появление картинок
  document.addEventListener('load',e=>{
    if(e.target.tagName==='IMG'){
      e.target.style.opacity='0';
      requestAnimationFrame(()=>{
        e.target.style.transition='opacity 0.4s ease';
        e.target.style.opacity='1';
      });
    }
  },true);

  // 2. Scroll progress bar (тонкая полоса сверху — дёшево, rAF-trottled)
  let scrollProgress=document.querySelector('.scroll-progress');
  if(!scrollProgress){
    scrollProgress=document.createElement('div');
    scrollProgress.className='scroll-progress';
    scrollProgress.style.cssText='position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-light));z-index:9999;width:0;transition:width 0.1s;pointer-events:none';
    document.body.appendChild(scrollProgress);
  }
  let scrollTicking=false;
  document.addEventListener('scroll',()=>{
    if(!scrollTicking){
      requestAnimationFrame(()=>{
        const sh=document.documentElement.scrollHeight-window.innerHeight;
        const pct=sh>0?Math.min(100,(window.scrollY/sh)*100):0;
        scrollProgress.style.width=pct+'%';
        scrollTicking=false;
      });
      scrollTicking=true;
    }
  },{passive:true});

  // 3. Анимация чисел при появлении (count-up) — только для stat-card-value, rAF
  if('IntersectionObserver' in window){
    const countObs=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          const el=entry.target;
          if(el.dataset.countAnimated)return;
          el.dataset.countAnimated='1';
          const target=parseInt(el.getAttribute('data-count'))||0;
          if(target>0&&typeof countUp==='function'){
            countUp(el,target,800);
          }
          countObs.unobserve(el);
        }
      });
    },{threshold:0.5});
    // Один раз при загрузке view — без setInterval
    const observeCountTargets=()=>{
      document.querySelectorAll('.stat-card-value:not([data-count-animated])').forEach(el=>{
        const num=parseInt(el.textContent.replace(/[^\d-]/g,''));
        if(num&&!isNaN(num)&&Math.abs(num)<1000000){
          el.setAttribute('data-count',num);
          el.textContent='0';
          countObs.observe(el);
        }
      });
    };
    observeCountTargets();
    // Перепроверяем при смене view (без интервала)
    const origSetView=App.setView.bind(App);
    App.setView=function(v,id){
      origSetView(v,id);
      setTimeout(observeCountTargets,100);
    };
  }
}

/* ====== Relative time formatter (5 минут назад, вчера, 3 дня назад) ====== */
function relativeTime(ts){
  if(!ts)return '';
  let t;
  if(typeof ts==='number')t=ts;
  else if(typeof ts==='string')t=new Date(ts).getTime();
  else if(ts instanceof Date)t=ts.getTime();
  else return '';
  if(!t||isNaN(t))return '';
  const diff=Date.now()-t;
  if(diff<0)return 'только что';
  const sec=Math.floor(diff/1000);
  if(sec<60)return 'только что';
  const min=Math.floor(sec/60);
  if(min<60)return min+' '+pluralMin(min)+' назад';
  const hours=Math.floor(min/60);
  if(hours<24)return hours+' '+pluralHour(hours)+' назад';
  const days=Math.floor(hours/24);
  if(days===1)return 'вчера';
  if(days<7)return days+' '+pluralDay(days)+' назад';
  if(days<30)return Math.floor(days/7)+' '+pluralWeek(days)+' назад';
  if(days<365)return Math.floor(days/30)+' мес назад';
  return Math.floor(days/365)+' г назад';
}
function pluralMin(n){return n===1?'минуту':(n>=2&&n<=4?'минуты':'минут')}
function pluralHour(n){return n===1?'час':(n>=2&&n<=4?'часа':'часов')}
function pluralDay(n){return n===1?'день':(n>=2&&n<=4?'дня':'дней')}
function pluralWeek(n){const w=Math.floor(n/7);return w===1?'неделю':(w>=2&&w<=4?'недели':'недель')}

/* Update all [data-reltime] elements every 30s */
function startRelativeTimeUpdater(){
  setInterval(()=>{
    document.querySelectorAll('[data-reltime]').forEach(el=>{
      const ts=el.getAttribute('data-reltime');
      const txt=relativeTime(ts);
      if(txt)el.textContent=txt;
    });
  },30000);
}

const NOTIF_TYPES={
  verdict:{icon:'check',label:'Вердикт'},
  faction_approved:{icon:'shield',label:'Утверждено'},
  chat_invite:{icon:'chat',label:'Приглашение'},
  chat_message:{icon:'chat',label:'Сообщение'},

function getNotifications(){
  try{return JSON.parse(localStorage.getItem('tersky-notifications')||'[]')}catch(e){return []}
}
function saveNotificationsList(arr){
  try{localStorage.setItem('tersky-notifications',JSON.stringify(arr.slice(0,200)))}catch(e){}
}
function addNotification(type,title,desc,link){
  const list=getNotifications();
  /* Dedup: skip if same title+desc added in last 10s */
  const last=list[0];
  if(last&&last.title===title&&last.desc===desc&&(Date.now()-last.ts)<10000)return;
  const notif={
    id:uid('n'),
    type:type||'default',
    title:title||'Уведомление',
    desc:desc||'',
    link:link||null,
    read:false,
    ts:Date.now(),
  };
  list.unshift(notif);
  saveNotificationsList(list);
  updateNotifBadge();
  /* Show toast */
  toast(title,desc,type==='verdict'||type==='faction_approved'?'success':'info');
  /* Show native browser notification if tab inactive */
  showBrowserNotification(title,desc);
}
function markAllNotificationsRead(){
  const list=getNotifications();
  list.forEach(n=>n.read=true);
  saveNotificationsList(list);
  updateNotifBadge();
  const panel=document.querySelector('.notif-panel');
  if(panel)renderNotifPanel(panel);
}
function markNotificationRead(id){

function openNotifPanel(anchorEl){
  /* Close if open */
  const existing=document.querySelector('.notif-overlay');
  if(existing){existing.remove();return}
  const overlay=el('div',{class:'notif-overlay',style:{position:'fixed',inset:'0',zIndex:'55'}});
  const panel=el('div',{class:'notif-panel'});
  renderNotifPanel(panel);
  /* Position relative to anchorEl */
  overlay.addEventListener('click',e=>{if(e.target===overlay){overlay.remove()}});
  /* Append panel to anchor parent (header) for proper positioning */
  const wrap=anchorEl.parentElement||document.body;
  wrap.style.position='relative';
  wrap.appendChild(panel);
  document.body.appendChild(overlay);
  /* Escape closes */
  document.addEventListener('keydown',function esc(e){
    if(e.key==='Escape'){overlay.remove();panel.remove();document.removeEventListener('keydown',esc)}
  });
}

      const hh=String(t.getHours()).padStart(2,'0');
      const mm=String(t.getMinutes()).padStart(2,'0');
      indicator.querySelector('.draft-time').textContent='сохранено в '+hh+':'+mm;
    }
  }
  function schedule(){if(timer)clearTimeout(timer);timer=setTimeout(save,4000)}
  function attachIndicator(hostEl){
    if(indicator)indicator.remove();
    indicator=el('div',{class:'draft-indicator'},
      el('span',{html:ICONS.history}),
      el('span',{},'Черновик'),
      el('span',{class:'draft-time'},'—'),
      el('button',{type:'button',onclick:()=>{clearDraftData(formType,id);if(indicator)indicator.remove();toast('Черновик очищён','','info')}},'Очистить')
    );
    hostEl.appendChild(indicator);
  }
  return {
    schedule,
    attachIndicator,
    clearOnSuccess(){clearDraftData(formType,id);if(indicator)indicator.remove()},
    saveNow:save
  };
}
function offerRestoreDraft(formType,id,applyCb){
  const draft=getDraft(formType,id);
  if(!draft||!draft._savedAt)return;
  const ageMin=Math.floor((Date.now()-draft._savedAt)/60000);
  if(ageMin>60*24*7)return; /* skip drafts older than 7 days */
  /* Don't restore if draft is empty (only _savedAt) */
  const keys=Object.keys(draft).filter(k=>k!=='_savedAt'&&k!=='attachments');
  const hasContent=keys.some(k=>{
    const v=draft[k];
    return v&&((typeof v==='string'&&v.trim())||(Array.isArray(v)&&v.length));
  });
  if(!hasContent)return;
  toast(
    'Найден несохранённый черновик',
    'Сохранён '+relativeTime(draft._savedAt)+'. Восстановить?',
    'info',
    {label:'Восстановить',ttl:10000,callback:()=>{applyCb(draft)}}
  );
}

function getLastVisit(collection){

function setLastVisit(collection,ts){
  try{localStorage.setItem('tersky-lastvisit-'+collection,String(ts||Date.now()))}catch(e){}

function isNewItem(item,collection){
  if(!item||!item.createdAt)return false;
  const ts=new Date(RTDB.ts(item.createdAt)).getTime();
  if(!ts)return false;
  const lv=getLastVisit(collection);
  if(!lv){/* First ever visit — only mark as new last 24h items */return (Date.now()-ts)<24*60*60*1000}
  return ts>lv;
}

}

function getBookmarks(){
  try{return JSON.parse(localStorage.getItem('tersky-bookmarks')||'[]')}catch(e){return []}
}
function isBookmarked(id){
  if(!id)return false;
  return getBookmarks().includes(id);
}
function toggleBookmark(id){
  if(!id)return false;
  const list=getBookmarks();
  const idx=list.indexOf(id);
  if(idx>=0)list.splice(idx,1);
  else list.push(id);
  try{localStorage.setItem('tersky-bookmarks',JSON.stringify(list))}catch(e){}
  return idx<0; /* true = added, false = removed */
}

/* ====== Count-up animation ====== */
function countUp(el,target,duration=900){
  if(!el)return;
  if(typeof target!=='number')target=Number(target)||0;
  const startTime=performance.now();
  const ease=t=>1-Math.pow(1-t,3);
  function step(now){
    const elapsed=now-startTime;
    const t=Math.min(elapsed/duration,1);
    const val=Math.floor(target*ease(t));
    el.textContent=String(val);
    if(t<1)requestAnimationFrame(step);
    else el.textContent=String(target);
  }
  requestAnimationFrame(step);
}

/* ====== Command palette (Ctrl+K) ====== */
function openCommandPalette(){
  const existing=document.querySelector('.cmd-overlay');
  if(existing)existing.remove();
  const overlay=el('div',{class:'modal-overlay cmd-overlay',style:{background:'rgba(0,0,0,0.55)',alignItems:'flex-start',paddingTop:'12vh'}});
  const palette=el('div',{class:'cmd-palette'});
  const inputWrap=el('div',{class:'cmd-input-wrap'},
    el('span',{html:ICONS.search}),
  );
  const input=el('input',{class:'cmd-input',placeholder:'Быстрый поиск и навигация...',autocomplete:'off'});
  inputWrap.appendChild(input);
  palette.appendChild(inputWrap);
  const results=el('div',{class:'cmd-results'});
  palette.appendChild(results);
  overlay.appendChild(palette);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});
  
  let activeIdx=0;
  let currentItems=[];
  
  function render(query){
    results.innerHTML='';
    const q=query.toLowerCase().trim();
    const all=buildCommandItems();
    const filtered=q?all.filter(it=>{
      return (it.title||'').toLowerCase().includes(q)||(it.desc||'').toLowerCase().includes(q)||(it.keywords||'').toLowerCase().includes(q);
    }):all.slice(0,12);
    currentItems=filtered;
    if(filtered.length===0){
      results.appendChild(el('div',{class:'cmd-empty'},'Ничего не найдено'));
      return;
    }
    /* group by section */
    const sections={};
    filtered.forEach(it=>{
      const s=it.section||'Разделы';
      if(!sections[s])sections[s]=[];
      sections[s].push(it);
    });
    let i=0;
    Object.entries(sections).forEach(([section,items])=>{
      results.appendChild(el('div',{class:'cmd-section'},section));
      items.forEach(it=>{
        const idx=i++;
        const item=el('div',{class:'cmd-item'+(idx===activeIdx?' active':''),onclick:()=>{executeCmd(it);overlay.remove()}},
          el('div',{class:'cmd-item-icon',html:ICONS[it.icon]||ICONS.file}),
          el('div',{class:'cmd-item-body'},
            el('div',{class:'cmd-item-title'},it.title),
            it.desc?el('div',{class:'cmd-item-desc'},it.desc):null
          ),
          it.shortcut?el('div',{class:'cmd-item-shortcut'},it.shortcut):null
        );
        item.addEventListener('mouseenter',()=>{activeIdx=idx;updateActive()});
        results.appendChild(item);
      });
    });
  }
  function updateActive(){
    results.querySelectorAll('.cmd-item').forEach((el,i)=>{
      el.classList.toggle('active',i===activeIdx);
    });
  }
  input.addEventListener('input',()=>{activeIdx=0;render(input.value)});
  
  overlay.addEventListener('keydown',e=>{
    if(e.key==='Escape'){overlay.remove();return}
    if(e.key==='ArrowDown'){
      e.preventDefault();
      const items=results.querySelectorAll('.cmd-item');
      if(items.length===0)return;
      activeIdx=Math.min(activeIdx+1,items.length-1);
      updateActive();
      items[activeIdx]?.scrollIntoView({block:'nearest'});
    }else if(e.key==='ArrowUp'){
      e.preventDefault();
      const items=results.querySelectorAll('.cmd-item');
      if(items.length===0)return;
      activeIdx=Math.max(activeIdx-1,0);
      updateActive();
      items[activeIdx]?.scrollIntoView({block:'nearest'});
    }else if(e.key==='Enter'){
      e.preventDefault();
      if(currentItems[activeIdx]){
        executeCmd(currentItems[activeIdx]);
        overlay.remove();
      }
    }
  });
  
  document.body.appendChild(overlay);
  setTimeout(()=>input.focus(),50);
  render('');
}

/* ====== Context menu (right click) ====== */
function showContextMenu(e,items){
  e.preventDefault();
  e.stopPropagation();
  const existing=document.querySelector('.ctx-menu');
  if(existing)existing.remove();
  const menu=el('div',{class:'ctx-menu'});
  items.forEach(it=>{
    if(it.divider){
      menu.appendChild(el('div',{class:'ctx-menu-divider'}));
    }else{
      const itemEl=el('div',{class:'ctx-menu-item'+(it.danger?' danger':''),onclick:()=>{menu.remove();it.action&&it.action()}},
        it.icon?el('span',{html:typeof it.icon==='string'?(ICONS[it.icon]||''):''}):null,
        el('span',{},it.label)
      );
      menu.appendChild(itemEl);
    }
  });
  document.body.appendChild(menu);
  /* Position */
  const rect=menu.getBoundingClientRect();
  const x=Math.min(e.clientX,window.innerWidth-rect.width-8);
  const y=Math.min(e.clientY,window.innerHeight-rect.height-8);
  menu.style.left=x+'px';
  menu.style.top=y+'px';
  /* Close on click outside (next tick) */
  setTimeout(()=>{
    const close=()=>{menu.remove();document.removeEventListener('click',close);document.removeEventListener('contextmenu',close)};
    document.addEventListener('click',close);
    document.addEventListener('contextmenu',close);
  },0);
}

/* ====== Char counter (attaches to textarea or WikiEditor) ====== */
function attachCharCounter(textareaOrWiki,maxLen,hostEl){
  if(!textareaOrWiki||!hostEl)return null;
  const counter=el('div',{class:'char-counter'});
  const leftSpan=el('span',{class:'char-count'},'0 символов');
  const rightSpan=el('span',{class:'char-status'},'');
  counter.appendChild(leftSpan);
  counter.appendChild(rightSpan);
  hostEl.appendChild(counter);
  function getValue(){
    if(textareaOrWiki._wikiTextarea)return textareaOrWiki._wikiTextarea.value||'';
    return textareaOrWiki.value||'';
  }
  function update(){
    const v=getValue();
    const len=v.length;
    leftSpan.textContent=len+' '+pluralChars(len);
    counter.classList.toggle('over',maxLen&&len>maxLen);
    counter.classList.toggle('filled',len>0&&!((maxLen&&len>maxLen)));
    if(maxLen){
      const left=maxLen-len;
      rightSpan.textContent=left>0?(left+' осталось'):(Math.abs(left)+' лишних');
    }else{
      rightSpan.textContent=len>0?'заполнено':'';
    }
  }
  if(textareaOrWiki._wikiTextarea){
    textareaOrWiki._wikiTextarea.addEventListener('input',update);
  }else{
    textareaOrWiki.addEventListener('input',update);
  }
  update();
  return {update};
}
function pluralChars(n){
  const mod10=n%10,mod100=n%100;
  if(mod10===1&&mod100!==11)return 'символ';
  if(mod10>=2&&mod10<=4&&(mod100<10||mod100>=20))return 'символа';
  return 'символов';
}

/* ====== Sparkline (mini chart for faction recentChanges) ====== */
function buildSparkline(recentChanges){
  /* Generate small SVG sparkline from recentChanges deltas */
  if(!Array.isArray(recentChanges)||recentChanges.length===0)return '';
  const sorted=recentChanges.slice().sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
  const points=sorted.map(c=>Number(c.delta)||0);
  if(points.length===0)return '';
  /* Compute cumulative */
  let cum=0;
  const cumPoints=points.map(p=>{cum+=p;return cum});
  const min=Math.min(...cumPoints,0);
  const max=Math.max(...cumPoints,0);
  const range=Math.max(1,max-min);
  const w=60,h=18;
  const stepX=cumPoints.length>1?w/(cumPoints.length-1):0;
  const path=cumPoints.map((v,i)=>{
    const x=i*stepX;
    const y=h-((v-min)/range)*h;
    return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  const lastDelta=cumPoints[cumPoints.length-1];
  const cls=lastDelta>0?'up':(lastDelta<0?'down':'');
  return '<svg class="sparkline '+cls+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><path d="'+path+'"/></svg>';
}

        if(n)foundName=n.title;
      }else if(view==='chronicle'||view==='admin-chronicle'){
        const a=App.cache.chronicle.find(x=>x.id===id);
        if(a)foundName=a.title;
      }else if(view==='bestiary'||view==='admin-bestiary'){
        const b=App.cache.bestiary.find(x=>x.id===id);
        if(b)foundName=b.name;
      }else if(view==='my-faction'){
        const f=App.cache.factions.find(x=>x.id===id);
        if(f)foundName=f.name;
      }else if(view==='chats'||view==='admin-chats'){
        const c=App.cache.chats.find(x=>x.id===id);
        if(c)foundName=c.name;
      }else if(view==='battles'||view==='admin-battles'){
        const b=App.cache.battles.find(x=>x.id===id);
        if(b)foundName=b.name;
      }else if(view==='castle'){
        /* === Task 15: castle breadcrumb — lookup user + faction name === */
        const owner=App.cache.users.find(u=>u.id===id);
        const ownerFaction=App.cache.factions.find(f=>f.userId===id);
        if(ownerFaction)foundName=ownerFaction.name;
        else if(owner)foundName='Замок: '+(owner.name||'правителя');
      }
    }
    if(foundName){
      crumbs.push({label:labels[view],view,id:null});
      crumbs.push({label:foundName,current:true});
    }else if(id==='__new__'){
      crumbs.push({label:labels[view],view,id:null});
      crumbs.push({label:'Создание',current:true});
    }else{
      crumbs.push({label:labels[view],current:true});
    }
  }else{
    crumbs.push({label:'Сводка',current:true});
  }
  return crumbs;
}

/* ====== PWA manifest (inline JSON via data URI) ====== */
function injectPWAManifest(){
  if(document.querySelector('link[rel="manifest"]'))return;
  const manifest={
    name:'Терский Мир — РВПИ',
    short_name:'Терский Мир',
    description:'Ролевая-Военно-Политическая Игра «Терский Мир»',
    start_url:'./tersky-mir.html',
    display:'standalone',
    background_color:'#0a0f0f',
    theme_color:'#0a0f0f',
    icons:[
      {src:'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#0a0f0f"/><circle cx="50" cy="50" r="32" stroke="#3a7d74" stroke-width="3" fill="none"/><line x1="50" y1="38" x2="50" y2="70" stroke="#e8f0ed" stroke-width="4"/></svg>'),sizes:'192x192',type:'image/svg+xml'},
      {src:'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#0a0f0f"/><circle cx="50" cy="50" r="32" stroke="#3a7d74" stroke-width="3" fill="none"/><line x1="50" y1="38" x2="50" y2="70" stroke="#e8f0ed" stroke-width="4"/></svg>'),sizes:'512x512',type:'image/svg+xml'}
    ]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('link');
  link.rel='manifest';
  link.href=url;
  document.head.appendChild(link);
}

/* ====== Fullscreen toggle ====== */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    if(document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().catch(()=>{});
    }
  }else{
    if(document.exitFullscreen){
      document.exitFullscreen().catch(()=>{});
    }
  }
}

/* ====== Global card context menu (right-click on .card with data-ctx) ====== */
function setupCardContextMenus(){
  document.addEventListener('contextmenu',e=>{
    /* Allow default on inputs/textareas (for cut/copy/paste context) */
    const tag=(e.target&&e.target.tagName)||'';
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(e.target&&e.target.isContentEditable))return;
    const card=e.target.closest('[data-ctx-type]');
    if(!card)return;
    e.preventDefault();
    const type=card.getAttribute('data-ctx-type');
    const id=card.getAttribute('data-ctx-id');
    if(!type||!id)return;
    const items=buildCardContextMenu(type,id);
    if(items.length>0){
      showContextMenu(e,items);
    }
  });
}
function buildCardContextMenu(type,id){
  const u=App.userProfile;
  const isAdmin=u&&u.role==='ADMIN';
  const items=[];
  items.push({label:'Открыть',icon:'eye',action:()=>navigateToItem(type,id)});
  items.push({label:'Копировать ссылку',icon:'link',action:async()=>{
    try{
      await copyToClipboard(buildShareLink(type,id));
      toast('Ссылка скопирована','','success');
    }catch(err){toast('Ошибка','Не удалось скопировать','error')}
  }});
  items.push({label:'Поделиться',icon:'share',action:async()=>{
    try{
      if(navigator.share){
        await navigator.share({title:'Терский Мир',url:buildShareLink(type,id)});
      }else{
        await copyToClipboard(buildShareLink(type,id));
        toast('Ссылка скопирована','','success');
      }
    }catch(err){}
  }});
  items.push({divider:true});
  /* Bookmark toggle */
  const bookmarked=isBookmarked(id);
  items.push({label:bookmarked?'Убрать закладку':'В закладки',icon:'bookmark',action:()=>{
    const added=toggleBookmark(id);
    toast(added?'Добавлено в закладки':'Убрано из закладок','','info');
    App.render();
  }});
  if(isAdmin){
    items.push({divider:true});
    items.push({label:'Удалить',icon:'trash',danger:true,action:async()=>{
      const ok=await ConfirmDialog('Удалить элемент?','Действие необратимо.','Удалить','Отмена',{danger:true});
      if(!ok)return;
      const colMap={post:'posts',news:'news',chronicle:'chronicle',bestiary:'bestiary',faction:'factions'};
      const col=colMap[type];
      if(col){
        try{await RTDB.remove(col+'/'+id);toast('Удалено')}catch(e){toast('Ошибка',e.message,'error')}
      }
    }});
  }
  return items;
}
function navigateToItem(type,id){
  const isAdmin=App.userProfile&&App.userProfile.role==='ADMIN';
  const map={
    post:isAdmin?'admin-posts':'posts',
    news:'news',chronicle:'chronicle',bestiary:'bestiary',faction:'my-faction'
  };
  const v=map[type];
  if(v)App.setView(v,id);
}
function buildShareLink(type,id){
  const base=window.location.href.split('#')[0];
  return base+'#'+type+'/'+id;
}
function handleHashNavigation(){
  if(!window.location.hash)return false;
  const m=window.location.hash.match(/^#(post|news|chronicle|bestiary|faction)\/(.+)$/);
  if(!m)return false;
  const type=m[1];
  const id=decodeURIComponent(m[2]);
  navigateToItem(type,id);
  /* Clear hash so refresh doesn't re-trigger */
  history.replaceState(null,'',window.location.pathname+window.location.search);
  return true;
}

/* ====== Hotkey hint (first visit only) ====== */
function showHotkeyHintOnce(){
  try{
    if(localStorage.getItem('tersky-hotkey-hint-shown'))return;
  }catch(e){return}
  setTimeout(()=>{
    const hint=el('div',{class:'hotkey-hint'},
      el('span',{},'Нажмите'),
      el('kbd',{},'Ctrl + K'),
      el('span',{},'для быстрого поиска'),
      el('button',{class:'btn btn-ghost btn-sm',style:{padding:'2px 6px',fontSize:'10px'},onclick:()=>{hint.remove()}},el('span',{html:ICONS.close,style:{width:'10px',height:'10px'}}))
    );
    document.body.appendChild(hint);
    setTimeout(()=>{if(hint&&hint.parentNode)hint.remove()},6000);
    try{localStorage.setItem('tersky-hotkey-hint-shown','1')}catch(e){}
  },3000);
}

/* ====== Extended hotkeys (Ctrl+K, g+letter, ?, etc.) ====== */
let gKeyPressed=false;
let gKeyTimer=null;
function setupExtendedHotkeys(){
  document.addEventListener('keydown',e=>{
    if(!App.currentUser)return;
    const tag=(e.target&&e.target.tagName)||'';
    const inField=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(e.target&&e.target.isContentEditable);
    /* Ctrl+K or Cmd+K — command palette */
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
      e.preventDefault();
      openCommandPalette();
      return false;
    }
    /* ? — shortcuts modal (when not in field) */
    if(!inField&&e.key==='?'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
      e.preventDefault();
      openShortcutsModal();
      return false;
    }
    if(inField)return;
    /* g + letter sequence (vim-style) */
    if(e.key.toLowerCase()==='g'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
      gKeyPressed=true;
      if(gKeyTimer)clearTimeout(gKeyTimer);
      gKeyTimer=setTimeout(()=>{gKeyPressed=false},1200);
      e.preventDefault();
      return false;
    }
    if(gKeyPressed){
      const map={d:'dashboard',p:'posts',f:'my-faction',n:'news',c:'chronicle',b:'bestiary',a:'activity',h:'chats',m:'profile',u:'admin-users',e:'admin-factions'};
      const v=map[e.key.toLowerCase()];
      if(v){
        e.preventDefault();
        App.setView(v);
        gKeyPressed=false;
        if(gKeyTimer)clearTimeout(gKeyTimer);
        return false;
      }
    }
  });
}

/* ====== Notifications: detect new items + create notifications ====== */
const _seenItems={}; /* in-memory: track previously seen items */
function detectNewItemsAndNotify(){
  if(!App.userProfile)return;
  /* Track posts */
  const newPosts=App.cache.posts.filter(p=>{
    const id=p.id;
    if(_seenItems['post_'+id]||!p.createdAt)return false;
    /* Only notify if created in last hour */
    const ts=new Date(RTDB.ts(p.createdAt)).getTime();
    if(Date.now()-ts>60*60*1000)return false;
    return true;
  });
  /* Initialize seen on first call */
  if(!_seenItems._initialized){
    App.cache.posts.forEach(p=>{_seenItems['post_'+p.id]=true});
    App.cache.news.forEach(n=>{_seenItems['news_'+n.id]=true});
    /* === Task 15: init seen rumors === */
    if(App.cache.rumors){App.cache.rumors.forEach(r=>{_seenItems['rumor_'+r.id]=true})}
    _seenItems._initialized=true;
    return;
  }
  /* Notify about new posts (admin: any except own; player: only their own with verdict) */
  const isAdmin=App.userProfile.role==='ADMIN';
  newPosts.forEach(p=>{
    _seenItems['post_'+p.id]=true;
    /* === Task 12 / Bug #7: Don't notify about own actions === */
    if(isAdmin){
      /* Admin gets notified about OTHER players' new posts, not their own */
      if(p.authorId!==App.userProfile.id){
        addNotification('new_post','Новый пост от '+(p.authorName||'игрока'),p.title,{view:'admin-posts',id:p.id});
      }
    }else if(p.authorId===App.userProfile.id&&p.status==='VERDICTED'&&p.verdict){
      /* Player gets notified when their own post receives a verdict (admin is NOT notified about verdicts) */
      addNotification('verdict','Вынесен вердикт',p.title,{view:'posts',id:p.id});
    }
  });
  /* Track news */
  const newNews=App.cache.news.filter(n=>{
    if(_seenItems['news_'+n.id]||!n.createdAt)return false;
    const ts=new Date(RTDB.ts(n.createdAt)).getTime();
    if(Date.now()-ts>60*60*1000)return false;
    return true;
  });
  newNews.forEach(n=>{
    _seenItems['news_'+n.id]=true;
    if(!isAdmin){addNotification('news','Новая весть мира',n.title,{view:'news',id:n.id})}
  });
  /* Track faction approvals */
  App.cache.factions.forEach(f=>{
    const key='faction_'+f.id+'_approved';
    if(f.isApproved&&!_seenItems[key]&&f.userId===App.userProfile.id){
      _seenItems[key]=true;
      addNotification('faction_approved','Княжество утверждено',f.name,{view:'my-faction',id:f.id});
    }
  });
  /* === Task 15: Track new rumors — notify target faction owner === */
  if(App.cache.rumors){
    const newRumors=App.cache.rumors.filter(r=>{
      if(_seenItems['rumor_'+r.id]||!r.createdAt)return false;
      const ts=new Date(RTDB.ts(r.createdAt)).getTime();
      if(Date.now()-ts>60*60*1000)return false;
      return true;
    });
    newRumors.forEach(r=>{
      _seenItems['rumor_'+r.id]=true;
      /* Don't notify own rumors */
      if(r.authorId===App.userProfile.id)return;
      /* Notify if rumor targets current user's faction */
      const myFaction=App.cache.factions.find(f=>f.userId===App.userProfile.id);
      if(r.targetFactionId&&myFaction&&r.targetFactionId===myFaction.id){
        addNotification('rumor_about_me','Слух о вашем княжестве',r.title||'',{view:'rumors'});
      }else if(isAdmin){
        addNotification('rumor_new','Новый слух от '+(r.authorName||'игрока'),r.title||'',{view:'rumors'});
      }
    });
  }
}

/* ====== Skeleton list helpers (used by views) ====== */
function SkeletonListItem(){
  return el('div',{class:'skeleton-list-item'},
    el('div',{class:'skeleton-avatar'}),
    el('div',{class:'skeleton-lines'},
      el('div',{class:'skeleton-line',style:{width:'40%'}}),
      el('div',{class:'skeleton-line short'}),
      el('div',{class:'skeleton-line tiny'})
    )
  );
}
function SkeletonList(count=3){
  const w=el('div',{});
  for(let i=0;i<count;i++)w.appendChild(SkeletonListItem());
  return w;
}

/* ====== Bookmarks view ====== */
function BookmarksView(){
  const wrap=el('div',{class:'flex flex-col gap-4'});
  wrap.appendChild(PageHeader('Закладки','Сохранённые посты, вести, статьи'));
  const ids=getBookmarks();
  if(ids.length===0){
    wrap.appendChild(EmptyState('bookmark','Закладок нет','Нажимайте на иконку закладки в карточках, чтобы сохранить элементы'));
    return wrap;
  }
  const all=[];
  App.cache.posts.forEach(p=>{if(ids.includes(p.id))all.push({type:'post',id:p.id,title:p.title,desc:p.authorName||'',icon:'scroll',view:App.userProfile.role==='ADMIN'?'admin-posts':'posts'})});
  App.cache.news.forEach(n=>{if(ids.includes(n.id))all.push({type:'news',id:n.id,title:n.title,desc:n.category||'',icon:'news',view:'news'})});
  App.cache.chronicle.forEach(a=>{if(ids.includes(a.id))all.push({type:'chronicle',id:a.id,title:a.title,desc:a.era||'',icon:'book',view:'chronicle'})});
  App.cache.bestiary.forEach(b=>{if(ids.includes(b.id))all.push({type:'bestiary',id:b.id,title:b.name,desc:b.title||'',icon:'paw',view:'bestiary'})});
  if(all.length===0){
    wrap.appendChild(EmptyState('bookmark','Элементы недоступны','Возможно, они были удалены'));
    return wrap;
  }
  const listHolder=el('div',{class:'flex flex-col gap-2'});
  all.forEach((item,idx)=>{
    const card=el('div',{class:'card card-hover staggered-item',style:{position:'relative',animationDelay:(idx*40)+'ms'},'data-ctx-type':item.type,'data-ctx-id':item.id,onclick:()=>App.setView(item.view,item.id)},
      el('div',{class:'bookmark-btn active','data-tooltip':'Убрать закладку',onclick:async (e)=>{
        e.stopPropagation();
        toggleBookmark(item.id);
        toast('Закладка убрана','','info');
        App.render();
      }},el('span',{html:ICONS.bookmarkFilled})),
      el('div',{class:'list-item-row'},
        el('div',{class:'list-item-icon',html:ICONS[item.icon]||ICONS.file}),
        el('div',{class:'flex-1 min-w-0'},
          el('span',{class:'badge'},item.type),
          el('div',{class:'text-sm',style:{fontFamily:'Cinzel,serif',fontWeight:'600',marginTop:'4px'}},item.title),
          item.desc?el('p',{class:'text-muted text-xs mt-1'},item.desc):null
        )
      )
    );
    listHolder.appendChild(card);
  });
  wrap.appendChild(listHolder);
  return wrap;
}
