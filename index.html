    'Изменения будут применены сразу, так как вы администратор.':
    'Запрос будет отправлен администратору на одобрение.'));
  form.appendChild(el('div',{class:'flex gap-2 justify-end mt-4'},
    el('button',{type:'button',class:'btn btn-ghost',onclick:()=>modal.remove()},'Отмена'),
    el('button',{type:'submit',class:'btn btn-primary'},el('span',{html:ICONS.save}),'Сохранить')
  ));
  card.appendChild(form);
  modal.appendChild(card);
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
  document.body.appendChild(modal);
  async function save(){
    const newData={
      name:state.name.trim(),
      avatarUrl:state.avatarUrl.trim(),
      bio:state.bio
    };
    if(!newData.name){toast('Ошибка','Имя обязательно','error');return}
    try{
      if(isAdmin){
        await RTDB.update('users/'+user.id,newData);
        toast('Профиль обновлён','','success');
        modal.remove();App.render();
      }else{
        const oldData={name:user.name||'',avatarUrl:user.avatarUrl||'',bio:user.bio||''};
        await RTDB.push('profileRequests',{
          userId:user.id,
          userName:user.name||'',
          userEmail:user.email||'',
          oldData,
          newData,
          status:'PENDING',
        });
        toast('Запрос отправлен','Запрос на изменение профиля отправлен администратору на одобрение','success');
        modal.remove();App.render();
      }
    }catch(e){toast('Ошибка',e.message,'error')}
  }
}

      faction.isApproved?el('span',{class:'badge badge-success'},'Утверждено'):el('span',{class:'badge badge-warning'},'На утверждении'),
      /* === Task 14 / feature #9: Treasury sparkline === */
      buildTreasurySparkline(faction)?el('span',{html:buildTreasurySparkline(faction),style:{display:'inline-flex',alignItems:'center'}}):null
    ),
    faction.shortName?el('p',{class:'text-muted text-sm mt-2'},'Короткое название: '+faction.shortName):null,
    faction.rulerName?el('p',{class:'text-accent text-sm mt-1',style:{fontFamily:'Cinzel,serif'}},faction.rulerName):null,
    faction.capital?el('p',{class:'text-muted text-xs mt-1'},'Столица: '+faction.capital):null,
    faction.motto?el('p',{class:'italic text-accent mt-2',style:{fontSize:'14px'}},'«'+faction.motto+'»'):null,
    faction.description?el('p',{class:'text-sm mt-2',style:{lineHeight:'1.6'}},faction.description):null,
    /* === Task 14 / feature #6: Follow toggle === */
    !isOwner?el('div',{style:{marginTop:'8px'}},renderFollowToggleBtn(faction)):null
  ));
  if(isAdmin){
    const adminBtns=el('div',{class:'flex gap-2',style:{flexWrap:'wrap'}});
    if(!faction.isApproved){
      adminBtns.appendChild(el('button',{class:'btn btn-primary btn-sm',onclick:async()=>{
        try{await RTDB.update('factions/'+faction.id,{isApproved:true});toast('Утверждено',faction.name+' утверждено','success')}catch(e){toast('Ошибка',e.message,'error')}
      }},'Утвердить'));
    }
    adminBtns.appendChild(el('button',{class:'btn btn-ghost btn-sm','data-tooltip':'Импорт JSON-структуры',onclick:()=>openImportStatsModal(faction)},
      el('span',{html:ICONS.upload}),'Импорт'
    ));
    adminBtns.appendChild(el('button',{class:'btn btn-ghost btn-sm','data-tooltip':'Экспорт JSON текущей статистики',onclick:()=>openExportStatsModal(faction)},
      el('span',{html:ICONS.download}),'Экспорт'
    ));
    /* === Task 14 / feature #9: Economic charts button === */
    adminBtns.appendChild(el('button',{class:'btn btn-ghost btn-sm','data-tooltip':'Экономические графики по ходам',onclick:()=>openEconomicChartsModal(faction)},
      el('span',{html:ICONS.stats}),'Графики'
    ));
    /* === Task 15: Visit faction owner's castle === */
    adminBtns.appendChild(renderVisitCastleButton(faction.userId));
    hb.appendChild(adminBtns);
  }else if(isOwner&&faction.isApproved){
    /* === Task 14 / feature #9: Player can see economic charts too === */
    hb.appendChild(el('div',{class:'flex gap-2',style:{flexWrap:'wrap'}},
      el('button',{class:'btn btn-ghost btn-sm','data-tooltip':'Экономические графики по ходам',onclick:()=>openEconomicChartsModal(faction)},
        el('span',{html:ICONS.stats}),'Графики'
      ),
      /* === Task 15: Visit own castle === */
      renderVisitCastleButton(faction.userId)
    ));
  }else if(!isOwner){
    /* === Task 15: Non-owner player can visit castle === */
    hb.appendChild(renderVisitCastleButton(faction.userId));
  }
  header.appendChild(hb);wrap.appendChild(header);

  /* Блок активных эффектов (pendingEffects) */
  const pendingEffects=Array.isArray(faction.pendingEffects)?faction.pendingEffects:[];
  if(pendingEffects.length>0){
    const effCard=el('div',{class:'card',style:{background:'rgba(58,125,116,0.05)',borderColor:'rgba(58,125,116,0.3)'}});
    effCard.appendChild(el('div',{class:'flex items-center justify-between mb-3'},
      el('div',{class:'flex items-center gap-2'},
        el('span',{html:ICONS.bolt,style:{color:'var(--accent)',width:'16px',height:'16px'}}),
        el('h3',{style:{fontSize:'14px'}},'Активные эффекты ('+pendingEffects.length+')')
      ),
      isAdmin?el('div',{class:'flex items-center gap-2'},
        (()=>{const inp=el('input',{type:'number',min:'1',value:'1',style:{width:'60px',padding:'4px 8px',background:'rgba(10,15,15,0.6)',border:'1px solid var(--border)',borderRadius:'4px',color:'var(--fg)',fontFamily:'Cormorant Garamond,serif'}});return inp})(),
        el('button',{class:'btn btn-primary btn-sm',onclick:async e=>{
          const inputEl=e.target.previousElementSibling;
          const n=Math.max(1,parseInt(inputEl.value,10)||1);
          await applyPendingEffectsNTurns(faction,n);
        }},'Применить N ходов')
      ):null
    ));
    pendingEffects.forEach((eff,idx)=>{
      effCard.appendChild(el('div',{class:'effect-row'},
        el('div',{class:'effect-info'},
          el('div',{class:'effect-target'},eff.fieldName||'поле'),
          el('div',{class:'effect-detail'},
            modeLabel(eff.mode)+' '+eff.amount+
            (eff.timing==='per_turn'?' · каждый ход':eff.timing==='over_turns'?' · осталось ходов: '+eff.turns:' · мгновенно')
          ),
          eff.note?el('div',{class:'effect-note'},eff.note):null
        ),
        isAdmin?el('button',{class:'btn btn-ghost btn-sm',onclick:async ()=>{
          await applyPendingEffectsNTurns(faction,1,idx);
        }},'Применить ход'):null
      ));
    });
    if(isAdmin){
      effCard.appendChild(el('div',{class:'mt-3'},el('button',{class:'btn btn-ghost btn-sm text-danger',onclick:async()=>{
        const ok=await ConfirmDialog('Очистить все активные эффекты?','Все ожидающие применения эффекты будут удалены без возможности восстановления.','Очистить','Отмена',{danger:true});
        if(!ok)return;
        try{await RTDB.update('factions/'+faction.id,{pendingEffects:[]});toast('Эффекты очищены')}catch(e){toast('Ошибка',e.message,'error')}
      }},'Очистить все эффекты')));
    }
    wrap.appendChild(effCard);
  }

  wrap.appendChild(el('div',{class:'flex items-center justify-between',style:{flexWrap:'wrap',gap:'8px'}},
    el('h2',{class:'flex items-center gap-2',style:{fontSize:'18px'}},el('span',{html:ICONS.crown,style:{color:'var(--accent)'}}),'Статистика государства'),
    canEdit?el('div',{class:'flex gap-2',style:{flexWrap:'wrap'}},
      el('button',{class:'btn btn-ghost btn-sm',onclick:()=>openAddSection(faction)},el('span',{html:ICONS.plus}),'Добавить секцию'),
      /* === Task 13 / feature #5: Audit log button === */
      isAdmin?el('button',{class:'btn btn-ghost btn-sm','data-tooltip':'История изменений статистики',onclick:()=>openStatHistoryModal(faction)},el('span',{html:ICONS.history}),'История изменений'):null,
      /* === Task 13 / feature #8: Turn simulator button === */
      isAdmin&&Array.isArray(faction.pendingEffects)&&faction.pendingEffects.length>0?el('button',{class:'btn btn-ghost btn-sm','data-tooltip':'Симулировать применение эффектов N раз',onclick:()=>openTurnSimulatorModal(faction)},el('span',{html:ICONS.fastForward}),'Симулировать ходы'):null
    ):null
  ));

  /* === Task 14 / feature #5: Search inside faction stats === */
  const factionSearchState={q:''};
  const factionSearchHolder=el('div',{class:'faction-stat-search'});
  wrap.appendChild(factionSearchHolder);
  factionSearchHolder.appendChild(SearchInput('Поиск по полям статистики...',factionSearchState.q,v=>{
    factionSearchState.q=v;
    /* Re-render stat sections with filter */
    statsListHolder.innerHTML='';
    renderStatsSections();
  }));

  /* Гарантируем миграцию к новому формату */
  const rawStats=Array.isArray(faction.stats)?faction.stats:[];
  const stats=migrateStats(rawStats);
  /* === Task 14 / feature #5: stats list holder (for search filter) === */
  const statsListHolder=el('div',{class:'flex flex-col gap-6'});
  wrap.appendChild(statsListHolder);
  function renderStatsSections(){
    statsListHolder.innerHTML='';
    const q=(factionSearchState.q||'').toLowerCase().trim();
    stats.forEach((section,i)=>{
      /* If search is active, skip sections that have no matching fields */
      if(q){
        const hasMatch=section.fields.some(f=>((f.label||'')+' '+(f.value||'')).toLowerCase().includes(q));
        if(!hasMatch)return;
      }
      const isOpen=q?true:isSectionExpanded(faction.id,section.id,i);
      const card=el('div',{class:'stat-section'+(isOpen?' expanded':'')});
      const hdr=el('button',{class:'stat-section-header',onclick:()=>{
        const next=!card.classList.contains('expanded');
        card.classList.toggle('expanded');
        setSectionExpanded(faction.id,section.id,next);
      }});
      hdr.appendChild(el('div',{class:'stat-section-icon',html:ICONS[section.icon]||ICONS.file}));
      const titleWrap=el('div',{class:'flex-1'});
      titleWrap.appendChild(el('div',{class:'stat-section-title'}));
      titleWrap.querySelector('.stat-section-title').appendChild(highlightMatch(section.title,q));
      titleWrap.appendChild(el('div',{class:'stat-section-desc'},section.fields.length+' '+pluralFields(section.fields.length)));
      hdr.appendChild(titleWrap);
      hdr.appendChild(el('div',{class:'stat-section-chevron',html:ICONS.chevron}));
      card.appendChild(hdr);
      const body=el('div',{class:'stat-section-body'});
      body.appendChild(el('div',{class:'ornament',style:{opacity:'0.3',marginBottom:'12px'}}));
      body.appendChild(renderFieldCardsWithSearch(section,faction,q));
      if(canEdit){
        body.appendChild(el('div',{class:'flex gap-2 mt-2',style:{flexWrap:'wrap',marginTop:'12px'}},
          el('button',{class:'btn btn-ghost btn-sm',onclick:()=>openStatEditor(faction,section)},el('span',{html:ICONS.edit}),'Редактировать секцию'),
          el('button',{class:'btn btn-ghost btn-sm',onclick:()=>moveSection(faction,section.id,-1),disabled:i===0,title:'Переместить вверх'},el('span',{html:ICONS.arrowUp})),
          el('button',{class:'btn btn-ghost btn-sm',onclick:()=>moveSection(faction,section.id,1),disabled:i===stats.length-1,title:'Переместить вниз'},el('span',{html:ICONS.arrowDown})),
          el('button',{class:'btn btn-ghost btn-sm text-danger',onclick:()=>deleteSection(faction,section.id)},el('span',{html:ICONS.trash}),'Удалить секцию')
        ));
      }
      card.appendChild(body);
      statsListHolder.appendChild(card);
    });
    if(q&&statsListHolder.children.length===0){
      statsListHolder.appendChild(EmptyState('search','Ничего не найдено','Попробуйте изменить поисковый запрос'));
    }
  }
  renderStatsSections();
  /* === Асинхронная очистка старых recentChanges (>7 дней) === */
  if(Array.isArray(faction.recentChanges)&&faction.recentChanges.length>0){
    const cleaned=pruneRecentChanges(faction.recentChanges);
    if(cleaned.length!==faction.recentChanges.length){
      RTDB.update('factions/'+faction.id,{recentChanges:cleaned}).catch(()=>{});
    }
  }
  return wrap;
}
function pluralFields(n){return n===1?'поле':(n>=2&&n<=4?'поля':'полей')}

/* ====== ВАРИАНТ D: карточки полей вместо stat-field блоков ====== */
function renderFieldCards(section,faction){
  if(!section||!section.fields||section.fields.length===0){
    return el('p',{class:'text-muted italic text-sm'},'Нет данных');
  }
  const isAdmin=App.userProfile&&App.userProfile.role==='ADMIN';
  const wrap=el('div',{class:'cards-grid'});
  let renderedCount=0;
  section.fields.forEach(f=>{
    const recent=faction?findRecentChange(faction,section.id,f.id):null;
    const deltaText=recent&&recent.delta!=null?formatDeltaBadge(recent.delta):'';
    const isUp=recent&&recent.delta!=null&&Number(recent.delta)>0;
    const isDown=recent&&recent.delta!=null&&Number(recent.delta)<0;
    if(f.type==='list'){
      const items=Array.isArray(f.value)?f.value.filter(Boolean):[];
      const cardClasses='field-card list-card'+(recent?' changed':'')+(isDown?' down':'');
      const card=el('div',{class:cardClasses,onclick:isAdmin?()=>openQuickEdit(faction,section,f):null});
      card.appendChild(el('div',{class:'list-card-label'},f.label+(items.length?(' ('+items.length+')'):'')));
      if(items.length===0){
        card.appendChild(el('p',{class:'text-muted text-xs italic'},isAdmin?'Пусто — нажмите, чтобы заполнить':'Нет данных'));
      }else{
        items.forEach(it=>card.appendChild(el('div',{class:'list-card-item'},String(it))));
      }
      if(recent&&recent.delta!=null){
        card.appendChild(el('div',{class:'field-card-delta '+(isUp?'up':'down')},deltaText));
      }
      wrap.appendChild(card);
      renderedCount++;
    }else if(f.type==='number'){
      const num=typeof f.value==='number'?f.value:(Number(f.value)||0);
      const cardClasses='field-card'+(recent?' changed':'')+(isDown?' down':'');
      const card=el('div',{class:cardClasses,onclick:isAdmin?()=>openQuickEdit(faction,section,f):null});
      const iconName=getFieldIcon(f.label);
      card.appendChild(el('div',{class:'field-card-icon',html:ICONS[iconName]||ICONS.file}));
      card.appendChild(el('div',{class:'field-card-label'},f.label));
      /* Извлечь единицу измерения из названия поля (например, «Доход/мес (солей)» → «солей») */
      const unitMatch=/\(([^)]+)\)/.exec(f.label);
      const unit=unitMatch?unitMatch[1]:'';
      const valEl=el('div',{class:'field-card-value'});
      valEl.appendChild(document.createTextNode(formatNumber(num)+' '));
      if(unit)valEl.appendChild(el('span',{class:'field-card-unit'},unit));
      card.appendChild(valEl);
      if(isAdmin){
        card.appendChild(el('div',{class:'field-card-edit',html:ICONS.edit}));
      }
      if(recent&&recent.delta!=null){
        card.appendChild(el('div',{class:'field-card-delta '+(isUp?'up':'down')},deltaText));
      }
      wrap.appendChild(card);
      renderedCount++;
    }else{
      /* text */
      const txt=f.value==null?'':String(f.value);
      const cardClasses='field-card text-card'+(recent?' changed':'')+(isDown?' down':'');
      const card=el('div',{class:cardClasses,onclick:isAdmin?()=>openQuickEdit(faction,section,f):null});
      const iconName=getFieldIcon(f.label);
      card.appendChild(el('div',{class:'field-card-icon',html:ICONS[iconName]||ICONS.file}));
      card.appendChild(el('div',{class:'field-card-label'},f.label));
      if(txt){
        card.appendChild(el('div',{class:'field-card-value-text'},txt));
      }else{
        card.appendChild(el('p',{class:'text-muted text-xs italic'},isAdmin?'Пусто — нажмите, чтобы заполнить':'Нет данных'));
      }
      if(isAdmin){
        card.appendChild(el('div',{class:'field-card-edit',html:ICONS.edit}));
      }
      if(recent&&recent.delta!=null){
        card.appendChild(el('div',{class:'field-card-delta '+(isUp?'up':'down')},deltaText));
      }
      wrap.appendChild(card);
      renderedCount++;
    }
  });
  if(renderedCount===0)return el('p',{class:'text-muted italic text-sm'},'Нет данных');
  return wrap;
}

/* ====== Быстрое редактирование поля (модал) — ВАРИАНТ D ====== */
function openQuickEdit(faction,section,field){
  if(!faction||!section||!field)return;
  /* Закрыть возможный предыдущий */
  const existing=document.querySelector('.quick-edit-modal');
  if(existing)existing.remove();
  const overlay=el('div',{class:'modal-overlay'});
  const modal=el('div',{class:'quick-edit-modal'});
  modal.appendChild(el('h3',{},el('span',{html:ICONS.edit}),'Редактировать поле'));
  const labelInput=el('input',{value:field.label||''});
  modal.appendChild(el('label',{},'Название поля'));
  modal.appendChild(labelInput);
  /* Текущее значение — глубокая копия */
  let currentValue;
  if(field.type==='list'){
    currentValue=Array.isArray(field.value)?field.value.slice():[];
  }else if(field.type==='number'){
    currentValue=typeof field.value==='number'?field.value:(Number(field.value)||0);
  }else{
    currentValue=field.value==null?'':String(field.value);
  }
  modal.appendChild(el('label',{},'Значение'));
  let valueEl;
  if(field.type==='list'){
    valueEl=el('textarea',{});;
    valueEl.value=currentValue.join('\n');
  }else if(field.type==='number'){
    valueEl=el('input',{type:'number',step:'any'});
    valueEl.value=String(currentValue);
  }else{
    valueEl=el('textarea',{});
    valueEl.value=String(currentValue);
  }
  modal.appendChild(valueEl);
  const actions=el('div',{class:'quick-edit-actions'},
    el('button',{class:'btn btn-ghost',onclick:()=>overlay.remove()},'Отмена'),
    el('button',{class:'btn btn-primary'},el('span',{html:ICONS.save}),'Сохранить')
  );
  modal.appendChild(actions);
  overlay.appendChild(modal);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});
  document.addEventListener('keydown',function handler(e){
    if(e.key==='Escape'){overlay.remove();document.removeEventListener('keydown',handler)}
  });
  document.body.appendChild(overlay);
  setTimeout(()=>labelInput.focus(),10);
  /* Save handler */
  actions.querySelector('.btn-primary').addEventListener('click',async ()=>{
    const newLabel=(labelInput.value||'').trim()||field.label;
    let newValue;
    if(field.type==='list'){
      newValue=valueEl.value.split('\n').map(s=>s.trim()).filter(Boolean);
    }else if(field.type==='number'){
      newValue=Number(valueEl.value)||0;
    }else{
      newValue=valueEl.value;
    }
    /* Построить новый stats с обновлённым полем */
    const stats=migrateStats(faction.stats||[]).map(s=>({...s,fields:s.fields.map(fld=>({...fld}))}));
    const sec=stats.find(s=>s.id===section.id);
    if(!sec){toast('Ошибка','Секция не найдена','error');overlay.remove();return}
    const fld=sec.fields.find(ff=>ff.id===field.id);
    if(!fld){toast('Ошибка','Поле не найдено','error');overlay.remove();return}
    const oldValue=fld.value;
    fld.label=newLabel;
    fld.value=newValue;
    try{
      await RTDB.update('factions/'+faction.id,{stats});
      /* === Task 13 / feature #5: Audit log for quick edit === */
      try{
        await recordStatHistory(faction,'manual_edit',[{field:newLabel||field.label,oldValue:oldValue,newValue:newValue}],null,'Быстрое редактирование поля');
      }catch(ae){}
      toast('Поле обновлено','','success');
      overlay.remove();
      App.render();
    }catch(e){toast('Ошибка',e.message,'error')}
  });
}
function formatNumber(n){
  if(typeof n!=='number')n=Number(n)||0;
  return n.toLocaleString('ru-RU');
}

/* ====== Редактор секции (полностью гибкий) ====== */
function openStatEditor(faction,section){
  const modal=el('div',{class:'modal-overlay'});
  const card=el('div',{class:'card card-glow modal-card'});
  /* Глубокая копия для локального редактирования */
  const local=JSON.parse(JSON.stringify(section));
  card.appendChild(el('div',{class:'flex items-center justify-between mb-4'},
    el('h2',{},'Редактирование секции'),
    el('button',{class:'btn btn-ghost btn-icon',onclick:()=>modal.remove()},el('span',{html:ICONS.close}))
  ));
  const form=el('form',{onsubmit:e=>{e.preventDefault();save()}});
  /* Заголовок секции */
  form.appendChild(el('div',{class:'stat-grid-2 mb-4'},
    el('div',{class:'field-group'},el('label',{class:'label'},'Название секции'),
      el('input',{class:'input',value:local.title,oninput:e=>local.title=e.target.value,required:true})),
    el('div',{class:'field-group'},el('label',{class:'label'},'Иконка секции'),
      (()=>{const sel=el('select',{class:'select',onchange:e=>local.icon=e.target.value});
        SECTION_ICON_OPTIONS.forEach(opt=>{const o=el('option',{value:opt.key},opt.label);if(opt.key===local.icon)o.selected=true;sel.appendChild(o)});
        return sel;
      })()
    )
  ));
  /* Список полей */
  const fieldsTitle=el('div',{class:'flex items-center justify-between'},
    el('label',{class:'label'},'Поля секции'),
    el('span',{class:'text-muted text-xs'},local.fields.length+' '+pluralFields(local.fields.length))
  );
  form.appendChild(fieldsTitle);
  const fieldsList=el('div',{class:'flex flex-col gap-2',style:{marginBottom:'12px'}});
  function renderFields(){
    fieldsList.innerHTML='';
    if(local.fields.length===0){
      fieldsList.appendChild(el('p',{class:'text-muted italic text-xs',style:{padding:'12px',textAlign:'center',border:'1px dashed var(--border)',borderRadius:'6px'}},'В секции нет полей. Добавьте новое поле ниже.'));
      return;
    }
    local.fields.forEach((f,idx)=>{
      const item=el('div',{class:'card',style:{background:'rgba(24,33,31,0.4)',padding:'10px'}});
      const top=el('div',{class:'flex items-center gap-2 mb-2'});
      const labelInput=el('input',{class:'input',style:{flex:'1',fontSize:'13px'},value:f.label,oninput:e=>f.label=e.target.value,placeholder:'Название поля'});
      const typeBadge=el('span',{class:'badge'},f.type==='number'?'Число':(f.type==='list'?'Список':'Текст'));
      const delBtn=el('button',{type:'button',class:'btn btn-ghost btn-icon btn-sm text-danger',onclick:()=>{local.fields.splice(idx,1);renderFields()}},el('span',{html:ICONS.trash}));
      top.appendChild(labelInput);top.appendChild(typeBadge);top.appendChild(delBtn);
      item.appendChild(top);
      /* Value editor depending on type */
      if(f.type==='list'){
        const ta=el('textarea',{class:'textarea',style:{minHeight:'60px',fontSize:'12px'},placeholder:'Каждый пункт с новой строки'},Array.isArray(f.value)?f.value.join('\n'):'');
        ta.addEventListener('input',()=>{f.value=ta.value.split('\n').map(s=>s.trim()).filter(Boolean)});
        item.appendChild(ta);
      }else if(f.type==='number'){
        const inp=el('input',{class:'input',type:'number',value:typeof f.value==='number'?f.value:(Number(f.value)||0),style:{fontSize:'13px'}});
        inp.addEventListener('input',()=>{f.value=Number(inp.value)||0});
        item.appendChild(inp);
      }else{
        const inp=el('input',{class:'input',value:f.value||'',style:{fontSize:'13px'}});
        inp.addEventListener('input',()=>{f.value=inp.value});
        item.appendChild(inp);
      }
      fieldsList.appendChild(item);
    });
  }
  renderFields();
  form.appendChild(fieldsList);
  /* Добавление нового поля */

    const cleanedFields=local.fields.map(f=>({
      id:f.id||uid('f'),
      label:(f.label||'Поле').trim(),

      value:f.value!==undefined?f.value:defaultFieldValue(f.type||'text')
    })).filter(f=>f.label);
    const stats=migrateStats(faction.stats||[]);
    const idx=stats.findIndex(s=>s.id===local.id);
    if(idx>=0){
      /* === Task 13 / feature #5: Build change-list for audit log (compare old vs new field values) === */
      const oldFields=Array.isArray(stats[idx].fields)?stats[idx].fields:[];
      const changes=[];
      cleanedFields.forEach(nf=>{
        const of=oldFields.find(x=>x.id===nf.id);
        if(!of){
          changes.push({field:nf.label,oldValue:null,newValue:nf.value});
        }else{
          const oldV=of.value,newV=nf.value;
          if(JSON.stringify(oldV)!==JSON.stringify(newV)){
            changes.push({field:nf.label,oldValue:oldV,newValue:newV});
          }
        }
      });
      /* Detect deleted fields */
      oldFields.forEach(of=>{
        if(!cleanedFields.find(x=>x.id===of.id)){
          changes.push({field:of.label,oldValue:of.value,newValue:null});
        }
      });
      stats[idx]={...stats[idx],title:local.title.trim(),icon:local.icon,fields:cleanedFields};
      try{
        await RTDB.update('factions/'+faction.id,{stats});
        /* Record audit log (best-effort) */
        try{await recordStatHistory(faction,'manual_edit',changes,null,'Редактирование секции: '+local.title)}catch(ae){}
        toast('Секция обновлена','','success');
        modal.remove();App.render();
      }catch(e){toast('Ошибка',e.message,'error')}
    }
  }
}

async function moveSection(faction,sectionId,direction){
  const stats=migrateStats(faction.stats||[]);
  const idx=stats.findIndex(s=>s.id===sectionId);
  if(idx<0)return;
  const newIdx=idx+direction;
  if(newIdx<0||newIdx>=stats.length)return;
  const tmp=stats[idx];stats[idx]=stats[newIdx];stats[newIdx]=tmp;
  /* Переписать order */
  stats.forEach((s,i)=>s.order=i);
  try{
    await RTDB.update('factions/'+faction.id,{stats});
    toast('Секция перемещена','','info');
  }catch(e){toast('Ошибка',e.message,'error')}
}

}

/* ====== Применение pendingEffects (N тиков) ====== */
async function applyPendingEffectsNTurns(faction,turns,onlyIdx){
  try{
    const stats=migrateStats(faction.stats||[]);
    let pending=Array.isArray(faction.pendingEffects)?faction.pendingEffects.map(e=>({...e})):[];
    const updates=[];
    for(let i=0;i<turns;i++){
      let applied=false;
      const toRemove=[];
      pending.forEach((eff,idx)=>{
        if(onlyIdx!==undefined&&idx!==onlyIdx)return;
        /* Применить один тик */
        const section=stats.find(s=>s.id===eff.targetSectionId);
        if(section){
          const field=findField(section,eff.targetFieldId);
          if(field){
            field.value=applyEffectToValue(field.value,{...eff,fieldType:field.type});
            applied=true;
            if(eff.timing==='over_turns'){
              eff.turns=(eff.turns||0)-1;
              if(eff.turns<=0)toRemove.push(idx);
            }
            /* per_turn — остаётся в pending */
          }else{
            toRemove.push(idx);
          }
        }else{
          toRemove.push(idx);
        }
      });
      /* Удалить завершённые (с конца) */
      toRemove.reverse().forEach(idx=>pending.splice(idx,1));
      if(!applied)break;
      if(pending.length===0)break;
      if(onlyIdx!==undefined)break;
    }
    await RTDB.update('factions/'+faction.id,{stats,pendingEffects:pending});
    toast('Эффекты применены','','success');
  }catch(e){toast('Ошибка',e.message,'error')}
}

/* ====== Дельта-журнал: блок «Изменения в статистике» (ВАРИАНТ D) ====== */
/* === Task 12 / Bug #10: Helper to normalize changes (could be array OR object from RTDB) === */
function normalizeChanges(changes){
  if(Array.isArray(changes))return changes.filter(c=>c&&typeof c==='object');
  if(changes&&typeof changes==='object'){
    /* RTDB sometimes stores arrays as objects with numeric keys — convert back */
    return Object.keys(changes).map(k=>changes[k]).filter(c=>c&&typeof c==='object');
  }
  return [];
}
function renderDeltaJournal(changes,verdict){
  const list=normalizeChanges(changes);
  if(list.length===0)return el('div',{class:'delta-banner'},el('div',{class:'delta-banner-title'},el('span',{html:ICONS.stats}),'Изменения в статистике ('+(verdict&&verdict.applied?'применены':'черновик')+')'),el('p',{class:'text-muted text-xs italic'},'Нет зафиксированных изменений.'));
  const wrap=el('div',{class:'delta-banner'});
  wrap.appendChild(el('div',{class:'delta-banner-title'},el('span',{html:ICONS.stats}),'Изменения в статистике ('+(verdict&&verdict.applied?'применены':'черновик')+')'));
  list.forEach(ch=>{
    const isAdd=ch.operation==='add';
    const isSub=ch.operation==='subtract';
    const isSet=ch.operation==='set';
    const iconCls=isAdd?'up':(isSub?'down':'set');
    const iconName=isAdd?'arrowUp':(isSub?'arrowDown':'equals');
    const row=el('div',{class:'delta-row'});
    row.appendChild(el('div',{class:'delta-row-icon '+iconCls,html:ICONS[iconName]||ICONS.equals}));
    const content=el('div',{class:'delta-row-content'});
    content.appendChild(el('div',{class:'delta-row-field'},ch.fieldName||'поле'));
    const changeEl=el('div',{class:'delta-row-change'});
    if(ch.oldValue!==undefined&&ch.newValue!==undefined){
      /* Format old value */
      let oldStr=ch.oldValue, newStr=ch.newValue;
      if(typeof ch.oldValue==='number'||(typeof ch.oldValue==='string'&&/^-?\d+(\.\d+)?$/.test(ch.oldValue))){
        oldStr=formatNumber(Number(ch.oldValue)||0);
        newStr=formatNumber(Number(ch.newValue)||0);
      }
      changeEl.appendChild(el('span',{class:'old'},String(oldStr)));
      changeEl.appendChild(el('span',{class:'arrow'},'→'));
      changeEl.appendChild(el('span',{class:'new'},String(newStr)));
      if(isAdd||isSub){
        const amt=Number(ch.value)||0;
        const sign=isAdd?'+':'−';
        changeEl.appendChild(el('span',{class:'amount '+(isAdd?'up':'down')},sign+formatNumber(Math.abs(amt))));
      }
    }else if(isSet){
      /* old verdicts may not have oldValue/newValue — just show value */
      let valStr=ch.value;
      if(typeof ch.value==='number'||(typeof ch.value==='string'&&/^-?\d+(\.\d+)?$/.test(ch.value))){
        valStr=formatNumber(Number(ch.value)||0);
      }
      changeEl.appendChild(el('span',{class:'amount',style:{color:'var(--accent-light)'}},'= '+String(valStr)));
    }else{
      const amt=Number(ch.value)||0;
      const sign=isAdd?'+':'−';
      changeEl.appendChild(el('span',{class:'amount '+(isAdd?'up':'down')},sign+formatNumber(Math.abs(amt))));
    }
    content.appendChild(changeEl);
    if(ch.note){
      content.appendChild(el('div',{class:'delta-row-note'},ch.note));
    }
    row.appendChild(content);
    wrap.appendChild(row);
  });
  return wrap;
}

      el('input',{class:'input',style:{fontSize:'12px'},placeholder:'Например: Пошлины за покровительство караванов',oninput:e=>local.note=e.target.value})
    ));
    formInner.appendChild(el('div',{class:'flex gap-2 justify-end'},
      el('button',{type:'button',class:'btn btn-ghost btn-sm',onclick:()=>{state.showChangeForm=false;renderChangeForm()}},'Отмена'),
      el('button',{type:'button',class:'btn btn-primary btn-sm',onclick:()=>{
        if(!local.sectionId){toast('Ошибка','Выберите секцию','error');return}
        if(!local.fieldId){toast('Ошибка','Выберите поле','error');return}
        const sec=stats.find(s=>s.id===local.sectionId);
        const f=findField(sec,local.fieldId);
        if(!f){toast('Ошибка','Поле не найдено','error');return}
        /* Валидация значения */
        let val=local.value;
        if(f.type==='number'){
          if(typeof val!=='number'){val=Number(val)||0}
        }else if(f.type==='list'&&local.operation==='set'){
          if(typeof val==='string'){val=val.split('\n').map(s=>s.trim()).filter(Boolean)}
          else if(!Array.isArray(val)){val=[]}
        }else{
          val=String(val==null?'':val);
        }
        const ch={
          id:uid('chg'),
          sectionId:local.sectionId,
          fieldId:local.fieldId,
          fieldName:f.label,
          fieldType:f.type,
          operation:local.operation,
          value:val,
          note:local.note||''
        };
        state.changes.push(ch);
        state.showChangeForm=false;
        renderChangesList();
        renderChangeForm();
      }},el('span',{html:ICONS.plus}),'Добавить')
    ));
    chFormWrap.appendChild(formInner);
  }
  renderChangesList();
  renderChangeForm();
  form.appendChild(chSection);

  form.appendChild(el('div',{class:'flex justify-end gap-2',style:{marginTop:'8px'}},
    el('button',{type:'button',class:'btn btn-ghost',onclick:()=>App.setView('admin-posts')},'Отмена'),
    /* === Task 15: Dice verdict button — opens Бросок судьбы modal === */
    el('button',{type:'button',class:'dice-roll-btn',id:'diceRollBtn',onclick:()=>openDiceRollModal({
      post:post,
      faction:faction,
      existingRoll:state.diceRoll,
      onComplete:(diceRoll)=>{state.diceRoll=diceRoll;updateDiceBtn()}
    })},
      el('span',{html:ICONS.diceD20,style:{width:'14px',height:'14px'}}),
      el('span',{},state.diceRoll?'Бросок сделан':'Бросить кубик')
    ),
    el('button',{type:'submit',class:'btn btn-primary'},el('span',{html:ICONS.save}),existingVerdict?'Обновить вердикт':'Вынести вердикт')
  ));
  editorCard.appendChild(form);
  wrap.appendChild(editorCard);
  /* === Task 15: helper to update dice button label after roll === */
  function updateDiceBtn(){
    const btn=editorCard.querySelector('#diceRollBtn');
    if(!btn)return;
    const labelSpan=btn.querySelector('span:last-child');
    if(labelSpan)labelSpan.textContent=state.diceRoll?'Бросок сделан':'Бросить кубик';
  }
  async function save(){
    if(state.roleplayText.length<5){toast('Ошибка','Ролевая часть обязательна','error');return}
    const verdict={
      roleplayText:state.roleplayText,technicalText:state.technicalText,
      changes:state.changes,applied:true,
      adminId:App.userProfile.id,adminName:App.userProfile.name,
      createdAt:new Date().toISOString(),
      /* === Task 15: diceRoll metadata (if any) === */
      diceRoll:state.diceRoll||null,
    };
    try{
      await RTDB.update('posts/'+post.id,{status:'VERDICTED',verdict});
      if(faction&&state.changes.length){
        /* Применить changes к stats фракции + заполнить recentChanges */
        const {stats,recent}=applyVerdictChanges(faction.stats||[],state.changes);
        const existingRecent=Array.isArray(faction.recentChanges)?faction.recentChanges:[];
        const mergedRecent=pruneRecentChanges([...recent,...existingRecent]).slice(0,200);
        await RTDB.update('factions/'+faction.id,{stats,recentChanges:mergedRecent});
        /* Сохранить в вердикт oldValue/newValue для каждой change (для последующего отображения) */
        verdict.changes=state.changes.map(c=>({...c}));
        /* === Task 13 / feature #5: Record audit log entry === */
        try{
          await recordStatHistory(faction,'verdict',state.changes.map(c=>({
            field:(c.fieldName||(c.sectionId+'/'+c.fieldId)),
            oldValue:c.oldValue,
            newValue:c.newValue!==undefined?c.newValue:c.value
          })),post.id,'Вердикт: '+(post.title||''));
        }catch(auditErr){}
      }
      await RTDB.update('posts/'+post.id,{verdict});
      /* Clear draft on success */
      draftHandle.clearOnSuccess();
      /* Send notification to post author */
      if(post.authorId&&post.authorId!==App.userProfile.id){
        addNotification('verdict','Вынесен вердикт',post.title,{view:'posts',id:post.id});
      }
      toast('Вердикт вынесен',state.changes.length?'Статистика обновлена':'Вердикт сохранён','success');
      /* === Task 14 / feature #8: Check achievements for post author after verdict === */
      try{
        const author=App.cache.users.find(u=>u.id===post.authorId);
        if(author)checkAndAwardAchievements(author);
      }catch(e){}
      App.setView('admin-posts');
    }catch(e){toast('Ошибка',e.message,'error')}
  }
  return wrap;
}

        el('span',{class:'badge'},n.category||'Общие'),
        n.turnNumber?el('span',{class:'badge'},'Ход '+n.turnNumber):null,
        el('span',{class:'text-muted',style:{fontSize:'10px',marginLeft:'auto'}},fmtDate(ts))
      ));
      card.appendChild(el('h1',{class:'text-glow',style:{fontSize:'22px',marginBottom:'8px'}},n.title));
      if(n.excerpt)card.appendChild(el('p',{class:'text-muted italic mb-3'},n.excerpt));
      card.appendChild(el('div',{class:'ornament',style:{opacity:'0.3',marginBottom:'16px'}}));
      card.appendChild(el('div',{class:'markdown',html:mdToHtml(n.content)}));
      card.appendChild(el('div',{class:'mt-4 pt-3',style:{borderTop:'1px solid var(--border)',fontSize:'12px',color:'var(--fg-muted)'}},'Автор: '+(n.authorName||'Хронист')));
      wrap.appendChild(card);
      return wrap;
    }
  }
  wrap.appendChild(PageHeader('Вести мира','Общедоступные новости и события Терского Мира'));
  if(App.cache.news.length===0){
    wrap.appendChild(EmptyState('news','Вестей нет','Новости пока не опубликованы'));
  }else{
    /* Поиск + сортировка */
    const state={q:'',sort:App._newsSort||'new'};
    const controls=el('div',{class:'list-controls'});
    controls.appendChild(SearchInput('Поиск вестей...',state.q,v=>{state.q=v;renderList()}));
    const sortSel=el('select',{class:'select',onchange:e=>{state.sort=e.target.value;App._newsSort=state.sort;renderList()}});
    [['new','Сначала новые'],['old','Сначала старые'],['title','По названию']].forEach(([k,l])=>{const o=el('option',{value:k},l);if(k===state.sort)o.selected=true;sortSel.appendChild(o)});
    controls.appendChild(sortSel);
    wrap.appendChild(controls);
    const listHolder=el('div',{class:'flex flex-col gap-2'});
    wrap.appendChild(listHolder);
    function renderList(){
      listHolder.innerHTML='';
      let list=[...App.cache.news];
      const q=state.q.toLowerCase().trim();
      if(q){
        list=list.filter(n=>((n.title||'')+(n.content||'')+(n.excerpt||'')).toLowerCase().includes(q));
      }
      if(state.sort==='old'){
        list=list.slice().reverse();
      }else if(state.sort==='title'){
        list.sort((a,b)=>(a.title||'').localeCompare(b.title||'','ru'));
      }
      if(list.length===0){
        listHolder.appendChild(EmptyState('search','Ничего не найдено','Попробуйте изменить запрос'));
        return;
      }
      list.forEach(n=>{
        const ts=RTDB.ts(n.createdAt);
        listHolder.appendChild(el('div',{class:'card card-hover news-card-hover',onclick:()=>App.setView('news',n.id)},
          el('div',{class:'flex items-center gap-2 mb-2',style:{flexWrap:'wrap'}},
            n.isPinned?el('span',{html:ICONS.pin,style:{color:'var(--accent)',width:'12px',height:'12px'}}):null,
            el('span',{class:'badge'},n.category||'Общие'),
            n.turnNumber?el('span',{class:'badge'},'Ход '+n.turnNumber):null,
            el('span',{class:'text-muted',style:{fontSize:'10px',marginLeft:'auto'}},fmtDateShort(ts))
          ),
          el('div',{class:'text-sm',style:{fontFamily:'Cinzel,serif',fontWeight:'600'}},n.title),
          n.excerpt?el('p',{class:'text-muted text-xs mt-1',style:{display:'-webkit-box',WebkitLineClamp:'2',WebkitBoxOrient:'vertical',overflow:'hidden'}},n.excerpt):
          el('p',{class:'text-muted text-xs mt-1',style:{display:'-webkit-box',WebkitLineClamp:'2',WebkitBoxOrient:'vertical',overflow:'hidden'}},n.content.replace(/[#*`]/g,'').slice(0,150)+'...')
        ));
      });
    }
    renderList();
  }
  return wrap;
}

function NewsForm(editing){

  const wrap=el('div',{class:'card card-glow'});
  wrap.appendChild(el('div',{class:'flex justify-between items-center mb-4'},el('h2',{style:{fontSize:'18px'}},editing?'Редактировать новость':'Новая весть'),el('button',{class:'btn btn-ghost btn-icon',onclick:()=>App.setView('admin-news')},el('span',{html:ICONS.close}))));
  const form=el('form',{onsubmit:e=>{e.preventDefault();save()}});
  /* Progress bar: 2 обязательных (title, content) */
  const newsProgress=FormProgress(()=>{return (state.title.trim().length>=3?1:0)+(state.content.trim().length>=10?1:0)},()=>2);
  form.appendChild(newsProgress.wrap);
  form.appendChild(el('div',{class:'field-group'},el('label',{class:'label'},'Заголовок *'),el('input',{class:'input',value:state.title,oninput:e=>{state.title=e.target.value;newsProgress.update();draftHandle.schedule()},required:true})));
  form.appendChild(el('div',{class:'stat-grid-2 mb-4'},
    el('div',{class:'field-group'},el('label',{class:'label'},'Категория'),
      (()=>{const sel=el('select',{class:'select',onchange:e=>{state.category=e.target.value;draftHandle.schedule()}});
        [['GENERAL','Общие'],['WAR','Военные'],['DIPLOMACY','Дипломатия'],['ECONOMY','Экономика'],['RELIGION','Религия']].forEach(([k,l])=>{const opt=el('option',{value:k},l);if(k===state.category)opt.selected=true;sel.appendChild(opt)});
        return sel;
      })()
    ),
    el('div',{class:'field-group'},el('label',{class:'label'},'Ход'),el('input',{class:'input',type:'number',value:state.turnNumber,oninput:e=>{state.turnNumber=e.target.value;draftHandle.schedule()}}))
  ));
  form.appendChild(el('div',{class:'field-group'},el('label',{class:'label'},'Краткое описание'),el('input',{class:'input',value:state.excerpt,oninput:e=>{state.excerpt=e.target.value;draftHandle.schedule()},placeholder:'Короткая аннотация...'})));
  const contentField=el('div',{class:'field-group'},el('label',{class:'label'},'Содержание *'),
    WikiEditor(state.content,v=>{state.content=v;newsProgress.update();draftHandle.schedule()},'Вики-разметка поддерживается: # заголовки, **жирный**, :::info блоки, таблицы, спойлеры и др.',200)
  );
  form.appendChild(contentField);
  /* === Char counter + draft autosave === */
  const contentWikiTa=contentField.querySelector('.wiki-editor');
  attachCharCounter(contentWikiTa,20000,contentField);
  const draftId=editing?editing.id:null;
  const draftHandle=setupDraftAutosave('news',draftId,()=>({title:state.title,content:state.content,excerpt:state.excerpt,category:state.category,isPinned:state.isPinned,turnNumber:state.turnNumber}));
  draftHandle.attachIndicator(newsProgress.wrap);
  form.appendChild(el('div',{class:'flex items-center gap-2'},el('input',{type:'checkbox',id:'pinned',checked:state.isPinned,onchange:e=>{state.isPinned=e.target.checked;draftHandle.schedule()}}),el('label',{for:'pinned',class:'text-sm text-muted'},'Закрепить новость')));
  form.appendChild(el('div',{class:'flex justify-end gap-2',style:{marginTop:'8px'}},

    el('button',{type:'submit',class:'btn btn-primary'},el('span',{html:ICONS.save}),editing?'Обновить':'Опубликовать')
  ));
  wrap.appendChild(form);
  /* Offer restore draft (only for new news) */
  if(!editing){
    offerRestoreDraft('news',null,(draft)=>{
      if(draft.title!==undefined){state.title=draft.title}
      if(draft.content!==undefined){state.content=draft.content;contentWikiTa.setValue(draft.content||'')}
      if(draft.excerpt!==undefined){state.excerpt=draft.excerpt}
      if(draft.category!==undefined){state.category=draft.category}
      if(draft.isPinned!==undefined){state.isPinned=draft.isPinned}
      if(draft.turnNumber!==undefined){state.turnNumber=draft.turnNumber}
      newsProgress.update();

      const inputs=form.querySelectorAll('input.input');
      if(inputs[0]&&draft.title!==undefined)inputs[0].value=draft.title||'';
      if(inputs[1]&&draft.turnNumber!==undefined)inputs[1].value=draft.turnNumber||'';

      if(editing){

  }

/* Convert ISO date string to "YYYY-MM-DDTHH:mm" format for datetime-local input */
function toDatetimeLocal(iso){
  try{
    const d=new Date(iso);
    if(isNaN(d.getTime()))return '';
    const pad=n=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  }catch(e){return ''}
}

/* SVG mini bar chart for admin dashboard (7 days activity) */
function renderAdminActivityChart(){
  const card=el('div',{class:'card'});
  card.appendChild(el('div',{class:'flex items-center gap-2 mb-3'},
    el('span',{html:ICONS.stats,style:{color:'var(--accent)',width:'16px',height:'16px'}}),
    el('h2',{style:{fontSize:'14px'}},'Активность за неделю')
  ));
  const now=Date.now();
  const dayMs=24*60*60*1000;
  const days=[];
  for(let i=6;i>=0;i--){
    const date=new Date(now-(i*dayMs));
    date.setHours(0,0,0,0);
    const startTs=date.getTime();
    const endTs=startTs+dayMs;
    let count=0;
    ['posts','news','chronicle','bestiary','battles'].forEach(col=>{
      App.cache[col].forEach(item=>{
        const ts=new Date(RTDB.ts(item.createdAt)).getTime();
        if(ts>=startTs&&ts<endTs)count++;
      });
    });
    App.cache.posts.forEach(p=>{
      if(p.verdict&&p.verdict.createdAt){
        const ts=new Date(RTDB.ts(p.verdict.createdAt)).getTime();
        if(ts>=startTs&&ts<endTs)count++;
      }
    });
    days.push({label:date.toLocaleDateString('ru-RU',{weekday:'short'}),date:startTs,count,isToday:i===0});
  }
  const max=Math.max(...days.map(d=>d.count),1);
  const W=320,H=90,pad=8,barW=Math.floor((W-pad*2-days.length*4)/days.length);
  let bars='';
  days.forEach((d,i)=>{
    const h=Math.max(2,Math.round((d.count/max)*(H-pad*2-12)));
    const x=pad+i*(barW+4);
    const y=H-pad-h;
    const color=d.isToday?'var(--accent)':'rgba(58,125,116,0.6)';
    bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${color}" rx="1"><title>${d.label}: ${d.count}</title></rect>`;
    bars+=`<text x="${x+barW/2}" y="${H-pad+10}" fill="var(--fg-dim)" font-size="9" text-anchor="middle" font-family="Cinzel,serif">${d.label||''}</text>`;
    if(d.count>0)bars+=`<text x="${x+barW/2}" y="${y-3}" fill="var(--fg-muted)" font-size="9" text-anchor="middle" font-family="JetBrains Mono">${d.count}</text>`;
  });
  const total=days.reduce((s,d)=>s+d.count,0);
  const svg=`<svg class="mini-bar-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
  card.appendChild(el('div',{html:svg}));
  card.appendChild(el('p',{class:'text-muted text-xs mt-2',style:{fontFamily:'Cinzel,serif',letterSpacing:'0.06em'}},total+' событий за последние 7 дней'));
  return card;
}

/* ====== AdminRelationsView: NxN relations matrix ====== */
function AdminRelationsView(){
  const wrap=el('div',{class:'flex flex-col gap-4'});
  wrap.appendChild(PageHeader('Матрица отношений','Связи между утверждёнными фракциями. Цвет ячейки = тип связи (из секции «Связи» статистики).'));
  const factions=App.cache.factions.filter(f=>f.isApproved);
  if(factions.length<2){
    wrap.appendChild(EmptyState('grid','Недостаточно фракций','Для матрицы нужно минимум 2 утверждённые фракции'));
    return wrap;
  }
  /* Build matrix: rows[source].targets[targetId] = relation object */
  const matrix={};
  factions.forEach(src=>{
    matrix[src.id]={};
    const rels=getFactionRelations(src);
    rels.forEach(r=>{
      const target=matchRelationTarget(r.target,factions);
      if(target&&target.id!==src.id){
        matrix[src.id][target.id]={type:r.type,value:r.value,note:r.note||'',raw:r.target};
      }
    });
  });
  const card=el('div',{class:'card'});
  card.appendChild(el('div',{class:'flex items-center gap-2 mb-3'},
    el('span',{html:ICONS.grid,style:{color:'var(--accent)',width:'16px',height:'16px'}}),
    el('h2',{style:{fontSize:'16px'}},'Матрица '+factions.length+'×'+factions.length)
  ));
  const matrixWrap=el('div',{class:'relations-matrix-wrap'});
  const table=el('table',{class:'relations-matrix'});
  /* Header */
  const thead=el('thead');
  const headRow=el('tr');
  headRow.appendChild(el('th',{},''));
  factions.forEach(f=>{
    headRow.appendChild(el('th',{},escapeHtml(f.shortName||f.name)));
  });
  thead.appendChild(headRow);
  table.appendChild(thead);
  /* Body */
  const tbody=el('tbody');
  factions.forEach(src=>{
    const tr=el('tr');
    tr.appendChild(el('th',{},escapeHtml(src.shortName||src.name)));
    factions.forEach(tgt=>{
      if(src.id===tgt.id){
        tr.appendChild(el('td',{class:'cell-diag'},'—'));
        return;
      }
      const rel=matrix[src.id]&&matrix[src.id][tgt.id];
      const type=rel?rel.type:'NONE';
      const cell=el('td',{class:'cell-rel-'+type});
      const btn=el('button',{class:'cell-btn','data-tooltip':rel?('Связь: '+(rel.raw||rel.type)+(rel.value?'\n'+rel.value:'')):('Нет связи — клик откроет фракцию'),'onclick':()=>{
        App.setView('my-faction',src.id);
      }});
      btn.appendChild(document.createTextNode(rel?relTypeShort(type):'·'));
      cell.appendChild(btn);
      tr.appendChild(cell);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  matrixWrap.appendChild(table);
  card.appendChild(matrixWrap);
  /* Legend */
  const legend=el('div',{class:'matrix-legend'});
  [['DIPLOMATIC','Дипломатия'],['TRADE','Торговля'],['NEUTRAL','Нейтралитет'],['WAR','Война'],['CONFLICT','Конфликт'],['SECRET','Секретно'],['NONE','Нет связи']].forEach(([k,label])=>{
    legend.appendChild(el('span',{},
      el('span',{class:'legend-swatch',style:{background:relationSwatch(k)}}),
      label
    ));
  });
  card.appendChild(legend);
  wrap.appendChild(card);
  /* Hint */
  wrap.appendChild(el('div',{class:'card'},
    el('p',{class:'text-muted text-xs',style:{lineHeight:'1.6'}},
      'Связи извлекаются из секции статистики фракции, в названии которой есть слово «Связи» (или с иконкой handshake). ',
      'Формат поля: «Дипломатические с Лодерфесом» или «Военные союзники: Грения». ',
      'Клик по ячейке открывает фракцию-источник (для редактирования связи).'
    )
  ));
  return wrap;
}

function relTypeShort(type){
  const map={DIPLOMATIC:'Д',TRADE:'Т',NEUTRAL:'Н',WAR:'В',CONFLICT:'К',SECRET:'С',UNKNOWN:'?',NONE:'·'};
  return map[type]||'?';
}
function relationSwatch(type){
  const map={
    DIPLOMATIC:'rgba(93,186,132,0.22)',
    ECONOMIC:'rgba(93,186,132,0.18)',
    TRADE:'rgba(212,165,67,0.20)',
    NEUTRAL:'rgba(212,165,67,0.20)',
    WAR:'rgba(196,77,77,0.28)',
    CONFLICT:'rgba(196,77,77,0.24)',
    SECRET:'rgba(122,90,180,0.30)',
    NONE:'rgba(15,21,21,0.4)',
    UNKNOWN:'rgba(15,21,21,0.4)'
  };
  return map[type]||'rgba(15,21,21,0.4)';
}

      effList.appendChild(el('p',{class:'text-muted italic text-xs',style:{padding:'8px',textAlign:'center'}},'Нет эффектов. Событие будет создано как информационное.'));
      return;

    state.effects.forEach((eff,idx)=>{
      const row=el('div',{class:'flex items-center gap-2',style:{flexWrap:'wrap'}});
      row.appendChild(el('input',{class:'input',placeholder:'Название поля (например, Доход/мес)',style:{flex:'1',minWidth:'180px'},value:eff.targetFieldName||'',oninput:e=>eff.targetFieldName=e.target.value}));
      const modeSel=el('select',{class:'select',style:{flex:'0 0 100px'}});
      [['add','+'],['subtract','−'],['set','='],['percent_add','+%'],['percent_subtract','−%']].forEach(([k,l])=>{
        const o=el('option',{value:k},l);if(k===eff.mode)o.selected=true;modeSel.appendChild(o);
      });
      modeSel.addEventListener('change',()=>eff.mode=modeSel.value);
      row.appendChild(modeSel);

      row.appendChild(el('button',{type:'button',class:'btn btn-ghost btn-icon btn-sm text-danger',onclick:()=>{state.effects.splice(idx,1);renderEffects()}},el('span',{html:ICONS.trash})));
      effList.appendChild(row);
    });
  }
  renderEffects();
  form.appendChild(el('div',{class:'flex justify-end gap-2 mt-3'},
    el('button',{type:'button',class:'btn btn-ghost',onclick:()=>App.setView('admin-events')},'Отмена'),
    el('button',{type:'submit',class:'btn btn-primary'},el('span',{html:ICONS.bolt}),'Создать и применить')
  ));
  wrap.appendChild(form);
  async function save(){
    if(state.title.trim().length<3){toast('Ошибка','Введите название события','error');return}
    const approved=App.cache.factions.filter(f=>f.isApproved);
    const appliedTo=[];
    /* Apply each effect to each approved faction */
    for(const f of approved){
      try{
        const stats=migrateStats(f.stats||[]).map(s=>({...s,fields:s.fields.map(fld=>({...fld}))}));
        const changes=[];
        state.effects.forEach(eff=>{
          if(!eff.targetFieldName)return;
          /* Find first field matching label across all sections */
          for(const sec of stats){
            const field=sec.fields.find(fld=>String(fld.label||'').toLowerCase().indexOf(eff.targetFieldName.toLowerCase())>=0);
            if(field){
              const oldValue=field.value;
              const newVal=applyEffectToValue(field.value,{mode:eff.mode,amount:Number(eff.amount)||eff.amount,fieldType:field.type});
              field.value=newVal;
              changes.push({
                sectionId:sec.id,fieldId:field.id,fieldName:field.label,
                operation:eff.mode,value:eff.amount,oldValue,newValue:newVal
              });
              break;
            }
          }
        });
        const recent=Array.isArray(f.recentChanges)?f.recentChanges:[];
        const newRecent=changes.map(ch=>({
          sectionId:ch.sectionId,fieldId:ch.fieldId,
          delta:typeof ch.newValue==='number'?(ch.newValue-(Number(ch.oldValue)||0)):null,
          sign:'+',
          timestamp:Date.now(),
          note:'Глобальное событие: '+(state.title||'')
        }));
        const mergedRecent=pruneRecentChanges([...newRecent,...recent]).slice(0,200);
        await RTDB.update('factions/'+f.id,{stats,recentChanges:mergedRecent});
        appliedTo.push(f.id);
        /* Record audit log entry */
        await recordStatHistory(f,'global_event',changes,null,state.title||'');
      }catch(e){console.warn('Failed to apply global event to faction',f.id,e)}
    }
    /* Create the event record */
    const event={
      title:state.title.trim(),
      description:state.description||'',
      type:state.type,
      effects:state.effects,
      appliedTo,
      isCancelled:false,
      authorId:App.userProfile.id,
      authorName:App.userProfile.name
    };
    try{
      await RTDB.push('globalEvents',event);
      /* Notify all users via in-app notifications */
      addNotification('news','Глобальное событие: '+(state.title||''),state.description||('Применено к '+appliedTo.length+' фракциям'),{view:'admin-events'});
      toast('Событие создано','Применено к '+appliedTo.length+' фракциям','success');
      App.setView('admin-events');
    }catch(e){toast('Ошибка',e.message,'error')}
  }
  return wrap;
}

/* Rollback a global event: for each faction in appliedTo, revert each effect */
async function rollbackGlobalEvent(ev){
  if(!ev||!Array.isArray(ev.appliedTo))return;
  const effects=Array.isArray(ev.effects)?ev.effects:[];
  if(effects.length===0){
    /* Just mark cancelled */
    try{await RTDB.update('globalEvents/'+ev.id,{isCancelled:true});toast('Событие отменено')}
    catch(e){toast('Ошибка',e.message,'error')}
    return;
  }
  for(const fid of ev.appliedTo){
    const f=App.cache.factions.find(x=>x.id===fid);
    if(!f)continue;
    try{
      const stats=migrateStats(f.stats||[]).map(s=>({...s,fields:s.fields.map(fld=>({...fld}))}));
      effects.forEach(eff=>{
        if(!eff.targetFieldName)return;
        for(const sec of stats){
          const field=sec.fields.find(fld=>String(fld.label||'').toLowerCase().indexOf(eff.targetFieldName.toLowerCase())>=0);
          if(field){
            /* Reverse: add -> subtract; subtract -> add; set -> restore oldValue; percent -> skip (cannot reliably reverse) */
            const old=typeof eff.oldValue!=='undefined'?eff.oldValue:null;
            if(eff.mode==='add'&&typeof eff.amount==='number'){field.value=(Number(field.value)||0)-(Number(eff.amount)||0)}
            else if(eff.mode==='subtract'&&typeof eff.amount==='number'){field.value=(Number(field.value)||0)+(Number(eff.amount)||0)}
            else if(eff.mode==='set'&&old!==null){field.value=old}
            else if(eff.mode==='percent_add'||eff.mode==='percent_subtract'){
              /* Best-effort: skip (would need exact prior value) */
            }
            break;
          }
        }
      });
      await RTDB.update('factions/'+fid,{stats});
      await recordStatHistory(f,'event_rollback',[],null,'Откат события: '+(ev.title||''));
    }catch(e){console.warn('rollback failed',fid,e)}
  }
  try{await RTDB.update('globalEvents/'+ev.id,{isCancelled:true});toast('Событие отменено и эффекты откатаны','','success')}
  catch(e){toast('Ошибка',e.message,'error')}
}

/* ====== Audit log helpers (Task 13 / feature #5) ====== */
/* Record a statHistory entry. changes = [{field, oldValue, newValue}] OR array of verdict-like changes */
async function recordStatHistory(faction,action,changes,postId,note){
  if(!faction||!faction.id)return;
  try{
    const snap=await fbDb.ref('factions/'+faction.id+'/statHistory').get();
    let arr=[];
    if(snap.exists()&&Array.isArray(snap.val()))arr=snap.val();
    /* Normalize changes to a compact form */
    const normChanges=(Array.isArray(changes)?changes:[]).map(ch=>{
      if(!ch)return null;
      const field=ch.fieldName||(ch.fieldLabel)||(ch.sectionId+'/'+ch.fieldId);
      return {
        field:String(field||''),
        oldValue:ch.oldValue,
        newValue:ch.newValue!==undefined?ch.newValue:(ch.value!==undefined?ch.value:undefined)
      };
    }).filter(Boolean);
    const entry={
      timestamp:new Date().toISOString(),
      userId:App.userProfile?App.userProfile.id:null,
      userName:App.userProfile?App.userProfile.name:'—',
      action:action||'manual_edit',
      postId:postId||null,
      note:note||'',
      changes:normChanges
    };
    arr.unshift(entry);
    /* Cap at 50 */
    arr=arr.slice(0,50);
    await fbDb.ref('factions/'+faction.id+'/statHistory').set(arr);
  }catch(e){/* ignore — audit log is best-effort */}
}

function formatAuditValue(v){
  if(v===null||v===undefined)return '—';
  if(typeof v==='number')return formatNumber(v);
  if(Array.isArray(v))return '['+v.length+']';
  if(typeof v==='string'){
    if(v.length>40)return v.slice(0,40)+'…';
    return v;
  }
  return String(v);
}

function openTurnSimulatorModal(faction){
  const modal=el('div',{class:'modal-overlay'});
  const card=el('div',{class:'card card-glow modal-card',style:{maxWidth:'600px'}});
  card.appendChild(el('div',{class:'flex items-center justify-between mb-4'},
    el('div',{class:'flex items-center gap-2'},
      el('span',{html:ICONS.fastForward,style:{color:'var(--accent)',width:'16px',height:'16px'}}),
      el('h2',{},'Симулятор ходов')
    ),
    el('button',{class:'btn btn-ghost btn-icon',onclick:()=>modal.remove()},el('span',{html:ICONS.close}))
  ));
  card.appendChild(el('p',{class:'text-muted text-xs mb-3'},'Симуляция показывает, как изменится статистика если применить все активные эффекты (pendingEffects) N раз. Ничего не сохраняется до подтверждения.'));
  const pending=Array.isArray(faction.pendingEffects)?faction.pendingEffects:[];
  if(pending.length===0){
    card.appendChild(el('div',{style:{padding:'24px',textAlign:'center',color:'var(--fg-dim)',fontStyle:'italic'}},'Нет активных эффектов для симуляции'));
    card.appendChild(el('div',{class:'flex justify-end mt-3'},el('button',{class:'btn btn-ghost',onclick:()=>modal.remove()},'Закрыть')));
    modal.appendChild(card);
    modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
    document.body.appendChild(modal);
    return;
  }
  const state={turns:1};
  card.appendChild(el('div',{class:'field-group mb-3'},
    el('label',{class:'label'},'Сколько ходов симулировать (1-10)'),
    el('input',{class:'input',type:'number',min:'1',max:'10',value:'1',oninput:e=>{state.turns=Math.max(1,Math.min(10,Number(e.target.value)||1));renderPreview()}})
  ));
  const previewWrap=el('div',{style:{marginTop:'8px'}});
  card.appendChild(previewWrap);
  function simulate(n){
    const stats=migrateStats(faction.stats||[]).map(s=>({...s,fields:s.fields.map(f=>({...f}))}));
    let localPending=pending.map(e=>({...e}));
    const changesByField={};
    for(let i=0;i<n;i++){
      let applied=false;
      const toRemove=[];
      localPending.forEach((eff,idx)=>{
        const sec=stats.find(s=>s.id===eff.targetSectionId);
        if(sec){
          const field=findField(sec,eff.targetFieldId);
          if(field){
            const oldV=field.value;
            field.value=applyEffectToValue(field.value,{...eff,fieldType:field.type});
            applied=true;
            const key=eff.targetSectionId+'/'+eff.targetFieldId;
            if(!changesByField[key])changesByField[key]={sectionId:eff.targetSectionId,fieldId:eff.targetFieldId,fieldName:field.label,startValue:oldV,finalValue:field.value};
            else changesByField[key].finalValue=field.value;
            if(eff.timing==='over_turns'){
              eff.turns=(eff.turns||0)-1;
              if(eff.turns<=0)toRemove.push(idx);
            }
          }else toRemove.push(idx);
        }else toRemove.push(idx);
      });
      toRemove.reverse().forEach(idx=>localPending.splice(idx,1));
      if(!applied||localPending.length===0)break;
    }
    return {stats,changesByField:Object.values(changesByField)};
  }
  function renderPreview(){
    previewWrap.innerHTML='';
    const sim=simulate(state.turns);
    const list=el('div',{class:'sim-preview-list'});
    if(sim.changesByField.length===0){
      list.appendChild(el('div',{class:'text-muted text-xs italic',style:{padding:'12px',textAlign:'center'}},'Нет изменений за указанное число ходов'));
    }else{
      sim.changesByField.forEach(ch=>{
        const delta=(Number(ch.finalValue)||0)-(Number(ch.startValue)||0);
        const deltaCls=delta>0?'delta-up':(delta<0?'delta-down':'');
        list.appendChild(el('div',{class:'sim-preview-row'},
          el('span',{class:'field'},ch.fieldName||'?'),
          el('div',{class:'values'},
            el('span',{class:'old-val'},formatAuditValue(ch.startValue)),
            el('span',{class:'arrow'},'→'),
            el('span',{class:'new-val'},formatAuditValue(ch.finalValue)),
            delta!==0?el('span',{class:deltaCls},(delta>0?'+':'−')+formatNumber(Math.abs(delta))):null
          )
        ));
      });
    }
    previewWrap.appendChild(list);
  }
  renderPreview();
  card.appendChild(el('div',{class:'flex justify-end gap-2 mt-3'},
    el('button',{class:'btn btn-ghost',onclick:()=>modal.remove()},'Отмена'),
    el('button',{class:'btn btn-primary',onclick:async()=>{
      const ok=await ConfirmDialog('Применить '+state.turns+' ход(а)?','Все активные эффекты будут применены указанное число раз. Изменения необратимы (но будут записаны в историю изменений).','Применить','Отмена');
      if(!ok)return;
      try{
        await applyPendingEffectsNTurns(faction,state.turns);
        await recordStatHistory(faction,'simulator',[],null,'Симулятор: применено '+state.turns+' ход(а)');
        modal.remove();
        App.render();
      }catch(e){toast('Ошибка',e.message,'error')}
    }},el('span',{html:ICONS.fastForward}),'Применить '+state.turns+' ход(а)')
  ));
  modal.appendChild(card);
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
  document.body.appendChild(modal);
}

function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)]}
function generateName(type){
  if(type==='state'){
    return pickRandom(NAME_PARTS.prefix)+pickRandom(NAME_PARTS.root)+pickRandom(NAME_PARTS.suffix);
  }
  if(type==='ruler'){
    return pickRandom(NAME_PARTS.rulerPrefix)+' '+pickRandom(NAME_PARTS.rulerRoot)+pickRandom(NAME_PARTS.rulerSuffix);
  }
  if(type==='settlement'){
    return pickRandom(NAME_PARTS.root)+pickRandom(NAME_PARTS.suffix);
  }
  return pickRandom(NAME_PARTS.prefix)+pickRandom(NAME_PARTS.root);
}
function getNameHistory(){
  try{return JSON.parse(localStorage.getItem('tersky-name-history')||'[]')}catch(e){return []}
}
function pushNameToHistory(name){
  if(!name)return;
  try{
    const list=getNameHistory().filter(n=>n!==name);
    list.unshift(name);
    localStorage.setItem('tersky-name-history',JSON.stringify(list.slice(0,10)));
  }catch(e){}
}

function DiaryView(){
  const wrap=el('div',{class:'flex flex-col gap-4'});

  const myPosts=App.cache.posts.filter(p=>p.authorId===u.id);

    entries.push({type:'post',ts,title:p.title,content:p.content,id:p.id,turnNumber:p.turnNumber,post:p});
    if(p.verdict){
      const vts=new Date(RTDB.ts(p.verdict.createdAt)).getTime();
      entries.push({type:'verdict',ts:vts,title:'Вердикт: '+(p.title||''),content:p.verdict.roleplayText,id:p.id,turnNumber:p.turnNumber,post:p});
    }
  });
  entries.sort((a,b)=>a.ts-b.ts);

  const state={filter:'all',q:''};
  wrap.appendChild(PageHeader('Дневник правителя','Летопись ваших постов и полученных вердиктов',
    el('button',{class:'btn btn-ghost btn-sm',onclick:()=>window.print()},el('span',{html:ICONS.printIcon}),'Печать дневника')
  ));

  const filtersRow=el('div',{class:'diary-filters'});
  [['all','Все'],['posts','Только посты'],['verdicts','Только вердикты'],['turn','По ходу']].forEach(([k,l])=>{

    const q=state.q.toLowerCase().trim();
    if(q)filtered=filtered.filter(e=>((e.title||'')+(e.content||'')).toLowerCase().includes(q));

      );

  }
  renderList();
  return wrap;
}

/* ============================================================
   FEATURE #3: СРАВНЕНИЕ "БЫЛО/СТАЛО" (Dashboard)
   ============================================================ */
function renderCompareLastTurn(faction){
  if(!faction)return null;
  const recent=Array.isArray(faction.recentChanges)?faction.recentChanges:[];
  /* Group recentChanges by fieldLabel (section/field) for last turn */
  /* Use only entries from current turn or last 7 days */
  const cutoff=Date.now()-7*24*60*60*1000;
  const recentFiltered=recent.filter(rc=>!rc.timestamp||rc.timestamp>=cutoff);
  if(recentFiltered.length===0){
    return el('div',{class:'card'},
      el('div',{class:'flex items-center gap-2 mb-3'},
        el('span',{html:ICONS.trendingUp,style:{color:'var(--accent)',width:'16px',height:'16px'}}),
        el('h2',{style:{fontSize:'16px'}},'Изменения за последний ход')
      ),
      el('p',{class:'text-muted text-sm italic'},'Нет изменений за последний ход.')
    );
  }
  /* Aggregate deltas by field label */
  const byField={};
  recentFiltered.forEach(rc=>{
    const key=rc.fieldLabel||rc.fieldName||rc.sectionId+'/'+rc.fieldId||'?';
    if(!byField[key])byField[key]={label:key,delta:0,count:0};
    const d=Number(rc.delta);
    if(!isNaN(d))byField[key].delta+=d;
    byField[key].count++;
  });
  const card=el('div',{class:'card'});
  card.appendChild(el('div',{class:'flex items-center gap-2 mb-3'},
    el('span',{html:ICONS.trendingUp,style:{color:'var(--accent)',width:'16px',height:'16px'}}),
    el('h2',{style:{fontSize:'16px'}},'Изменения за последний ход'),
    el('span',{class:'text-muted',style:{marginLeft:'auto',fontSize:'10px'}},'За последние 7 дней')
  ));
  const grid=el('div',{class:'compare-grid'});
  Object.values(byField).forEach(it=>{
    const delta=it.delta;
    const cls=delta>0?'up':(delta<0?'down':'neutral');
    const sign=delta>0?'+':(delta<0?'−':'');
    const arrowHtml=delta>0?ICONS.arrowUp:(delta<0?ICONS.arrowDown:ICONS.equals);
    grid.appendChild(el('div',{class:'compare-card '+cls},
      el('div',{class:'compare-card-label'},it.label),
      el('div',{class:'compare-card-delta '+cls},
        el('span',{html:arrowHtml,style:{width:'14px',height:'14px'}}),
        el('span',{},sign+formatNumber(Math.abs(delta)))
      ),
      el('div',{class:'compare-card-sub'},it.count+' изменени'+(it.count===1?'е':(it.count>=2&&it.count<=4?'я':'й')))
    ));
  });
  card.appendChild(grid);
  return card;
}

/* Compute stats for a user (used for achievement check + leaderboard score) */
function computeUserStats(user){
  if(!user||!user.id)return {posts:0,verdicts:0,chronicles:0,bestiary:0,messages:0,bookmarks:0,battlesParticipated:0,tradePosts:0,diplomaticVerdicts:0};
  const uid=user.id;
  const myPosts=App.cache.posts.filter(p=>p.authorId===uid);
  const myVerdicts=myPosts.filter(p=>p.status==='VERDICTED');
  const myChronicles=App.cache.chronicle.filter(c=>c.authorId===uid);
  const myBestiary=App.cache.bestiary.filter(b=>b.authorId===uid);
  /* Messages sent in chats */
  let messages=0;
  App.cache.chats.forEach(chat=>{
    if(Array.isArray(chat.messages)){
      messages+=chat.messages.filter(m=>m.authorId===uid).length;
    }
  });
  /* Battles participated */
  let battles=0;
  App.cache.battles.forEach(b=>{
    if(Array.isArray(b.forces)){
      b.forces.forEach(f=>{
        if(f.factionId){
          const faction=App.cache.factions.find(fc=>fc.id===f.factionId);
          if(faction&&faction.userId===uid)battles++;
        }
      });
    }
  });
  /* Trade posts (mention торг/trade in title or content) */
  const tradePosts=myPosts.filter(p=>{
    const txt=((p.title||'')+(p.content||'')).toLowerCase();
    return txt.indexOf('торг')>=0||txt.indexOf('trade')>=0||txt.indexOf('купеческ')>=0||txt.indexOf('караван')>=0;
  }).length;
  /* Diplomatic verdicts (changes have section "Связи" or field about diplomacy) */
  const diplomaticVerdicts=myVerdicts.filter(p=>{
    if(!p.verdict||!Array.isArray(p.verdict.changes))return false;
    return p.verdict.changes.some(ch=>{
      const f=((ch.fieldName||'')+' '+(ch.sectionId||'')).toLowerCase();
      return f.indexOf('связ')>=0||f.indexOf('дипломат')>=0||f.indexOf('союз')>=0;
    });
  }).length;
  /* Bookmarks (localStorage) */
  const bookmarks=getBookmarks().length;
  return {
    posts:myPosts.length,
    verdicts:myVerdicts.length,
    chronicles:myChronicles.length,
    bestiary:myBestiary.length,
    messages,
    bookmarks,
    battlesParticipated:battles,
    tradePosts,
    diplomaticVerdicts
  };
}
function computeUserScore(stats){
  if(!stats)return 0;
  return (stats.posts||0)*10+(stats.verdicts||0)*5+(stats.chronicles||0)*3+(stats.bestiary||0)*2+(stats.messages||0)*1+(stats.achievements||0)*25;
}
async function getUserAchievements(uid){
  if(!uid||!fbDb)return [];
  try{
    const snap=await fbDb.ref('users/'+uid+'/achievements').get();
    if(snap.exists()){
      const v=snap.val();
      if(Array.isArray(v))return v;
      if(typeof v==='object')return Object.keys(v);
    }
  }catch(e){}
  return [];
}
async function checkAndAwardAchievements(user){
  if(!user||!user.id)return [];
  try{
    const stats=computeUserStats(user);
    const existing=await getUserAchievements(user.id);
    const newlyAwarded=[];
    for(const ach of ACHIEVEMENTS){
      if(existing.includes(ach.key))continue;
      let ok=false;
      try{ok=!!ach.check(stats)}catch(e){ok=false}
      if(ok){
        newlyAwarded.push(ach.key);
        /* Save to RTDB */
        try{
          /* Read current, push new, save */
          const curSnap=await fbDb.ref('users/'+user.id+'/achievements').get();
          let cur=[];
          if(curSnap.exists()){
            const v=curSnap.val();
            cur=Array.isArray(v)?v:Object.keys(v);
          }
          if(!cur.includes(ach.key)){
            cur.push(ach.key);
            await fbDb.ref('users/'+user.id+'/achievements').set(cur);
          }
          /* Show toast */
          toast('Получено достижение: '+ach.title,ach.desc,'success');
        }catch(e){}
      }
    }
    return newlyAwarded;
  }catch(e){return []}
}
