/* ====== AUTH SCREEN ====== */
function AuthScreen(){
  const state={mode:'login',name:'',email:'',password:''};
  const wrap=el('div',{class:'auth-wrap'});
  wrap.appendChild(el('div',{class:'auth-left'},
    el('div',{html:LOGO_SVG(120),class:'flicker'}),
    el('h1',{class:'auth-title'},'ТЕРСКИЙ МИР'),
    el('p',{class:'auth-subtitle'},'Ролевая · Военно · Политическая · Игра'),
    el('div',{class:'ornament',style:{width:'100%',maxWidth:'400px',margin:'24px 0'}}),
    el('p',{class:'auth-quote'},'«Великие княжества рождаются не мечом единым, но словом, золотом и мудростью правителей своих»'),
    el('div',{class:'auth-features'},
      el('div',{class:'auth-feature'},el('div',{html:ICONS.shield}),el('span',{},'Дипломатия')),
      el('div',{class:'auth-feature'},el('div',{html:ICONS.book}),el('span',{},'Хроника')),
      el('div',{class:'auth-feature'},el('div',{html:ICONS.swords}),el('span',{},'Война')),
    )
  ));
  const right=el('div',{class:'auth-right'});
  const formWrap=el('div',{class:'auth-form-wrap'});
  function renderForm(){
    formWrap.innerHTML='';
    const card=el('div',{class:'auth-form-card'});
    card.appendChild(el('div',{class:'auth-tabs'},
      el('button',{class:'auth-tab'+(state.mode==='login'?' active':''),onclick:()=>{state.mode='login';renderForm()}},'Вход'),
      el('button',{class:'auth-tab'+(state.mode==='register'?' active':''),onclick:()=>{state.mode='register';renderForm()}},'Регистрация'),
    ));
    const form=el('form',{onsubmit:e=>{e.preventDefault();submit()}});
    if(state.mode==='register'){
      form.appendChild(el('div',{class:'field-group'},
        el('label',{class:'label'},'Имя правителя'),
        el('input',{class:'input',placeholder:'Имя правителя...',value:state.name,oninput:e=>state.name=e.target.value,required:true})
      ));
    }
    form.appendChild(el('div',{class:'field-group'},
      el('label',{class:'label'},'Электронная почта'),
      el('div',{class:'input-with-icon'},
        el('span',{class:'icon',html:ICONS.mail}),
        el('input',{class:'input',type:'email',placeholder:'правитель@государство.рф',value:state.email,oninput:e=>state.email=e.target.value,required:true})
      )
    ));
    form.appendChild(el('div',{class:'field-group'},
      el('label',{class:'label'},'Пароль'),
      el('div',{class:'input-with-icon'},
        el('span',{class:'icon',html:ICONS.shield}),
        el('input',{class:'input',type:'password',placeholder:'••••••••',value:state.password,oninput:e=>state.password=e.target.value,required:true})
      )
    ));
    form.appendChild(el('button',{type:'submit',class:'btn btn-primary w-full',style:{height:'44px',marginTop:'8px'}},state.mode==='login'?'Войти в мир':'Создать правителя'));
    card.appendChild(form);
    card.appendChild(el('p',{class:'text-center text-muted text-xs italic',style:{marginTop:'20px'}},'Первый зарегистрированный становится Администратором игры'));
    formWrap.appendChild(card);
  }
  async function submit(){
    const{name,email,password}=state;
    if(!email||!password||(state.mode==='register'&&!name)){toast('Ошибка','Заполните все поля','error');return}
    if(state.mode==='register'&&password.length<6){toast('Ошибка','Пароль минимум 6 символов','error');return}
    try{
      if(state.mode==='register'){
        const cred=await fbAuth.createUserWithEmailAndPassword(email.toLowerCase(),password);
        const usersSnap=await fbDb.ref('users').get();
        const isFirst=!usersSnap.exists();
        await fbDb.ref('users/'+cred.user.uid).set({
          email:email.toLowerCase(),name,role:isFirst?'ADMIN':'PLAYER',
          createdAt:new Date().toISOString(),lastLoginAt:new Date().toISOString(),
          bio:'',avatarUrl:''
        });
        toast('Добро пожаловать',isFirst?'Аккаунт администратора создан':'Аккаунт создан','success');
      }else{
        await fbAuth.signInWithEmailAndPassword(email.toLowerCase(),password);
        toast('Вход выполнен','Да пребудет с вами мудрость предков','success');
      }
    }catch(e){
      let msg=e.message||'Ошибка';
      if(e.code==='auth/email-already-in-use')msg='Email уже используется';
      else if(e.code==='auth/wrong-password')msg='Неверный пароль';
      else if(e.code==='auth/user-not-found')msg='Пользователь не найден';
      else if(e.code==='auth/invalid-email')msg='Некорректный email';
      else if(e.code==='auth/weak-password')msg='Слабый пароль';
      toast('Ошибка',msg,'error');
    }
  }
  renderForm();right.appendChild(formWrap);wrap.appendChild(right);
  return wrap;
}

/* ====== APP SHELL ====== */
function AppShell(){
  const u=App.userProfile;
  const isAdmin=u.role==='ADMIN';
  const faction=App.cache.factions.find(f=>f.userId===u.id);
  const playerNav=[
    {key:'dashboard',label:'Сводка',icon:'dashboard'},
    {key:'activity',label:'Лента',icon:'activity'},
    {key:'profile',label:'Профиль',icon:'user'},
    {key:'my-faction',label:'Моё княжество',icon:'shield'},
    {key:'posts',label:'Мои посты',icon:'scroll'},
    {key:'chats',label:'Переговоры',icon:'chat'},
    {key:'battles',label:'Военные дела',icon:'swords'},
    {key:'news',label:'Вести мира',icon:'news'},
    {key:'chronicle',label:'Хроника',icon:'book'},
    {key:'bestiary',label:'Бестиарий',icon:'paw'},
  ];
  const adminNav=[
    {key:'admin-users',label:'Игроки',icon:'users'},
    {key:'admin-profile-requests',label:'Запросы профилей',icon:'mail'},
    {key:'admin-factions',label:'Фракции',icon:'flag'},
    {key:'admin-posts',label:'Все посты',icon:'file'},
    {key:'admin-news',label:'Новости',icon:'news'},
    {key:'admin-chats',label:'Чаты',icon:'chat'},
    {key:'admin-battles',label:'Баталии',icon:'swords'},
    {key:'admin-chronicle',label:'Хроника',icon:'book'},
    {key:'admin-bestiary',label:'Бестиарий',icon:'paw'},
  ];
  const allNav=[...playerNav,...(isAdmin?adminNav:[])];
  const currentTitle=allNav.find(n=>n.key===App.view)?.label||'Сводка';
  const shell=el('div',{class:'app'});
  shell.appendChild(el('header',{class:'header'},
    el('button',{class:'btn btn-ghost btn-icon menu-toggle','data-tooltip':'Открыть/закрыть меню',onclick:()=>{App.sidebarOpen=!App.sidebarOpen;App.render()}},el('span',{html:ICONS.menu})),
    el('div',{html:LOGO_SVG(32)}),
    el('div',{},el('div',{class:'header-title'},'ТЕРСКИЙ МИР'),el('div',{class:'header-subtitle'},currentTitle)),
    el('div',{class:'header-spacer'}),
    faction?el('div',{class:'hidden',style:{display:'flex',alignItems:'center',gap:'8px',padding:'6px 12px',borderRadius:'6px',background:'rgba(26,58,53,0.4)',border:'1px solid var(--border)'}},
      el('span',{html:ICONS.shield,style:{color:'var(--accent)'}}),
      el('span',{class:'header-title',style:{fontSize:'13px'}},faction.name),
      faction.isApproved?null:el('span',{class:'text-warning',style:{fontSize:'10px'}},'(на утверждении)')
    ):null,
    el('div',{class:'header-user','data-tooltip':'Открыть профиль',onclick:()=>App.setView('profile')},
      el('div',{class:'header-avatar'},u.avatarUrl?el('img',{src:u.avatarUrl,alt:u.name}):document.createTextNode(u.name[0]?.toUpperCase()||'?')),
      el('div',{},el('div',{style:{fontSize:'13px',fontWeight:'500'}},u.name),el('div',{style:{fontSize:'10px',color:'var(--fg-muted)'}},isAdmin?'Администратор':'Игрок'))
    ),
    el('button',{class:'btn btn-ghost btn-icon','data-tooltip':'Выйти из системы',onclick:()=>App.logout()},el('span',{html:ICONS.logout}))
  ));
  const layout=el('div',{class:'layout'});
  if(App.sidebarOpen){
    layout.appendChild(el('div',{class:'sidebar-overlay open',onclick:()=>{App.sidebarOpen=false;App.render()}}));
  }
  const sidebar=el('aside',{class:'sidebar'+(App.sidebarOpen?' open':'')});
  /* === Sidebar search === */
  const searchWrap=el('div',{class:'sidebar-search'});
  searchWrap.appendChild(el('span',{class:'icon',html:ICONS.search}));
  const searchInput=el('input',{type:'text',placeholder:'Поиск разделов...',value:App._sidebarQuery||''});
  searchInput.addEventListener('input',e=>{
    App._sidebarQuery=e.target.value;
    renderNav();
  });
  searchWrap.appendChild(searchInput);
  sidebar.appendChild(searchWrap);

  const navHolder=el('div');
  sidebar.appendChild(navHolder);

  function renderNav(){
    navHolder.innerHTML='';
    const q=(App._sidebarQuery||'').toLowerCase().trim();
    const matchFilter=item=>{
      if(!q)return true;
      return item.label.toLowerCase().includes(q);
    };
    if(q){
      /* Search across both nav lists */
      const matches=[...playerNav,...(isAdmin?adminNav:[])].filter(matchFilter);
      if(matches.length===0){
        navHolder.appendChild(el('div',{class:'sidebar-search-empty'},'Не найдено'));
        return;
      }
      matches.forEach(item=>navHolder.appendChild(navItem(item)));
    }else{
      const nav=el('nav',{},el('div',{class:'sidebar-section-title'},'Держава'));
      playerNav.forEach(item=>nav.appendChild(navItem(item)));
      if(isAdmin){
        nav.appendChild(el('div',{class:'ornament',style:{margin:'12px 0',opacity:'0.4'}}));
        nav.appendChild(el('div',{class:'sidebar-section-title'},'Управление'));
        adminNav.forEach(item=>nav.appendChild(navItem(item)));
      }
      navHolder.appendChild(nav);
    }
  }
  function navItem(item){
    const active=App.view===item.key;
    const btn=el('button',{class:'nav-item'+(active?' active':''),onclick:()=>{App._sidebarQuery='';App.setView(item.key)}});
    btn.innerHTML=ICONS[item.icon]||ICONS.file;
    btn.appendChild(el('span',{},item.label));
    return btn;
  }
  renderNav();
  layout.appendChild(sidebar);
  const main=el('main',{class:'main'});
  const inner=el('div',{class:'main-inner fade-in'});
  inner.appendChild(renderView());
  main.appendChild(inner);
  layout.appendChild(main);
  shell.appendChild(layout);
  shell.appendChild(el('footer',{class:'footer'},
    el('div',{class:'ornament',style:{maxWidth:'300px',margin:'0 auto 8px',opacity:'0.3'}}),
    el('p',{class:'footer-text'},`Терский Мир · РВПИ · ${new Date().getFullYear()}`),
    el('p',{class:'footer-text',style:{marginTop:'4px',fontSize:'10px',opacity:'0.7'}},'1–8 — разделы  ·  Esc — закрыть модал')
  ));
  /* === Scroll-top floating button === */
  const scrollTopBtn=el('button',{class:'scroll-top','aria-label':'Наверх','data-tooltip':'Наверх',onclick:()=>window.scrollTo({top:0,behavior:'smooth'})},
    el('span',{html:ICONS.chevronUp})
  );
  if(window.scrollY>400)scrollTopBtn.classList.add('visible');
  shell.appendChild(scrollTopBtn);
  return shell;
}

function renderView(){
  switch(App.view){
    case'dashboard':return DashboardView();
    case'activity':return ActivityView();
    case'profile':return ProfileView();
    case'my-faction':return FactionView();
    case'posts':return PostsView();
    case'chats':return ChatsView();
    case'battles':return BattlesView();
    case'news':return NewsView();
    case'chronicle':return ChronicleView();
    case'bestiary':return BestiaryView();
    case'admin-users':return AdminUsersView();
    case'admin-profile-requests':return AdminProfileRequestsView();
    case'admin-factions':return AdminFactionsView();
    case'admin-posts':return AdminPostsView();
    case'admin-news':return AdminNewsView();
    case'admin-chats':return AdminChatsView();
    case'admin-battles':return AdminBattlesView();
    case'admin-chronicle':return ChronicleView(true);
    case'admin-bestiary':return BestiaryView(true);
    default:return DashboardView();
  }
}

/* ====== ACTIVITY FEED ====== */
function ActivityView(){
  const wrap=el('div',{class:'flex flex-col gap-4'});
  wrap.appendChild(PageHeader('Лента активности','Последние события Терского Мира'));
  /* Собираем события из всех коллекций */
  const events=[];
  App.cache.posts.forEach(p=>{
    const faction=App.cache.factions.find(f=>f.id===p.factionId);
    events.push({
      type:'post',id:p.id,ts:RTDB.ts(p.createdAt),
      icon:'scroll',
      badge:p.status==='VERDICTED'?'Вердикт':'Пост',
      title:p.title,
      meta:(p.authorName||'')+(faction?' · '+faction.name:''),
      view:'admin-posts',
      detailId:p.id,
      isPublicView:false
    });
  });
  App.cache.news.forEach(n=>{
    events.push({
      type:'news',id:n.id,ts:RTDB.ts(n.createdAt),
      icon:'news',badge:'Весть',
      title:n.title,
      meta:(n.authorName||'Хронист')+(n.category?' · '+(n.category||''):''),
      view:'news',detailId:n.id,isPublicView:true
    });
  });
  App.cache.chats.filter(c=>c.status==='SUMMARIZED').forEach(c=>{
    events.push({
      type:'chat',id:c.id,ts:RTDB.ts(c.createdAt),
      icon:'chat',badge:'Итог переговоров',
      title:c.name,

      icon:'book',badge:'Хроника',
      title:a.title,
      meta:a.authorName||'',

  App.cache.bestiary.forEach(e=>{

      type:'bestiary',id:e.id,ts:RTDB.ts(e.createdAt),

      title:b.name,
      meta:b.location||'',
      view:'battles',detailId:b.id,isPublicView:true
    });
  });
  events.sort((a,b)=>{const ta=new Date(a.ts).getTime(),tb=new Date(b.ts).getTime();return tb-ta});
  const top=events.slice(0,30);
  if(top.length===0){
    wrap.appendChild(EmptyState('activity','Событий пока нет','Как только игроки начнут активность — здесь появится лента'));
  }else{
    const list=el('div',{class:'flex flex-col gap-2'});
    top.forEach(ev=>{
      list.appendChild(el('div',{class:'activity-card',onclick:()=>{
        const isAdmin=App.userProfile.role==='ADMIN';

        App.setView(targetView,ev.detailId);
      }},
        el('div',{class:'activity-icon',html:ICONS[ev.icon]||ICONS.file}),
        el('div',{class:'flex-1 min-w-0'},
          el('div',{},
            el('span',{class:'activity-badge'},ev.badge),
            el('span',{class:'activity-title'},ev.title)
          ),
          el('div',{class:'activity-meta'},ev.meta?ev.meta+' · ':'',fmtDate(ev.ts))
        ),
        el('span',{html:ICONS.chevron,style:{color:'var(--fg-dim)',flexShrink:'0',marginTop:'4px'}})
      ));
    });
    wrap.appendChild(list);
    if(events.length>30){
      wrap.appendChild(el('p',{class:'text-muted text-xs text-center mt-2'},'Показаны последние 30 из '+events.length+' событий'));
    }
  }
  return wrap;
}

/* === Здоровье государства (блок метрик) === */
function renderStateHealth(){
  const card=el('div',{class:'card'});
  card.appendChild(el('div',{class:'flex items-center gap-2 mb-4'},
    el('span',{html:ICONS.heart,style:{color:'var(--accent)',width:'16px',height:'16px'}}),
    el('h2',{style:{fontSize:'16px'}},'Здоровье государства')
  ));
  const isAdmin=App.userProfile.role==='ADMIN';
  /* Метрики: посты без вердикта, активные эффекты, чаты за 24ч, последняя новость */
  const postsNoVerdict=isAdmin?App.cache.posts.filter(p=>p.status==='PENDING').length:App.cache.posts.filter(p=>p.authorId===App.userProfile.id&&p.status==='PENDING').length;
  let activeEffects=0;
  App.cache.factions.forEach(f=>{activeEffects+=Array.isArray(f.pendingEffects)?f.pendingEffects.length:0});
  const now=Date.now();
  let unreadChats=0;
  App.cache.chats.forEach(c=>{
    const ts=RTDB.ts(c.createdAt);
    /* Здесь createdAt чата — proxy для последней активности; используем summary или createdAt если не SUMMARIZED */
    if(new Date(ts).getTime()>now-24*60*60*1000)unreadChats++;
  });
  const lastNews=App.cache.news[0];
  const lastNewsTs=lastNews?new Date(RTDB.ts(lastNews.createdAt)).getTime():0;
  const lastNewsDaysAgo=lastNewsTs?Math.floor((now-lastNewsTs)/(24*60*60*1000)):0;
  const grid=el('div',{class:'health-grid'});
  /* Посты без вердикта: >0 красный */
  grid.appendChild(healthCard('clock','Постов без вердикта',postsNoVerdict,postsNoVerdict>0?'danger':'ok',()=>App.setView(isAdmin?'admin-posts':'posts')));
  /* Активные эффекты: >0 зелёный */
  grid.appendChild(healthCard('bolt','Активные эффекты',activeEffects,activeEffects>0?'ok':'',()=>App.setView('my-faction')));
  /* Чаты за 24ч: >0 жёлтый */
  grid.appendChild(healthCard('chat','Чаты за 24ч',unreadChats,unreadChats>0?'warn':'',()=>App.setView('chats')));
  /* Последняя новость: >7 дней жёлтый */
  grid.appendChild(healthCard('news','Последняя весть',lastNews?lastNewsDaysAgo+' дн. назад':'—',lastNews&&lastNewsDaysAgo>7?'warn':(lastNews?'ok':''),()=>App.setView('news')));
  card.appendChild(grid);
  return card;
}
function healthCard(icon,label,value,cls,onClick){
  const btn=el('button',{class:'health-card'+(cls?' '+cls:''),onclick:onClick,style:{cursor:'pointer',textAlign:'center'}});
  btn.appendChild(el('div',{class:'health-card-icon',html:ICONS[icon]||ICONS.file}));
  btn.appendChild(el('div',{class:'health-card-value'},String(value)));
  btn.appendChild(el('div',{class:'health-card-label'},label));
  return btn;
}

function openProfileEditor(user){
  const modal=el('div',{class:'modal-overlay'});
  const card=el('div',{class:'card card-glow modal-card'});
  const isAdmin=user.role==='ADMIN';
  card.appendChild(el('h2',{class:'mb-4'},'Редактирование профиля'));
  const state={name:user.name||'',avatarUrl:user.avatarUrl||'',bio:user.bio||''};
  const form=el('form',{onsubmit:e=>{e.preventDefault();save()}});
  form.appendChild(el('div',{class:'field-group'},
    el('label',{class:'label'},'Имя *'),
    el('input',{class:'input',value:state.name,oninput:e=>state.name=e.target.value,required:true})
  ));
  form.appendChild(el('div',{class:'field-group'},
    el('label',{class:'label'},'URL аватара (опц.)'),
    el('input',{class:'input',type:'url',placeholder:'https://...',value:state.avatarUrl,oninput:e=>state.avatarUrl=e.target.value})
  ));
  form.appendChild(el('div',{class:'field-group'},
    el('label',{class:'label'},'Описание / Bio'),
    el('textarea',{class:'textarea',style:{minHeight:'100px'},placeholder:'Расскажите о себе, своём стиле игры и правителе княжества...',oninput:e=>state.bio=e.target.value},state.bio)
  ));
  form.appendChild(el('p',{class:'text-muted text-xs italic'},isAdmin?
    'Изменения будут применены сразу, так как вы администратор.':
    'Запрос будет отправлен администратору на одобрение.'));
  form.appendChild(el('div',{class:'flex gap-2 justify-end mt-4'},
    el('button',{type:'button',class:'btn btn-ghost',onclick:()=>modal.remove()},'Отмена'),
    el('button',{type:'submit',class:'btn btn-primary'},el('span',{html:ICONS.save}),'Сохранить')
  ));
  card.appendChild(form);
  modal.appendChild(card);
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
  document.body.appendChild(modal);
  async function save(){
    const newData={
      name:state.name.trim(),
      avatarUrl:state.avatarUrl.trim(),
      bio:state.bio
    };
    if(!newData.name){toast('Ошибка','Имя обязательно','error');return}
    try{
      if(isAdmin){
        await RTDB.update('users/'+user.id,newData);
        toast('Профиль обновлён','','success');
        modal.remove();App.render();
      }else{
        const oldData={name:user.name||'',avatarUrl:user.avatarUrl||'',bio:user.bio||''};
        await RTDB.push('profileRequests',{
          userId:user.id,
          userName:user.name||'',
          userEmail:user.email||'',
          oldData,
          newData,
          status:'PENDING',
        });
        toast('Запрос отправлен','Запрос на изменение профиля отправлен администратору на одобрение','success');
        modal.remove();App.render();
      }
    }catch(e){toast('Ошибка',e.message,'error')}
  }
}

        )
      ));

        if(oldVal===newVal)return;
        diff.appendChild(el('div',{class:'card',style:{background:'rgba(24,33,31,0.4)',padding:'10px'}},
          el('div',{class:'label'},label),

            el('span',{class:'text-sm',style:{color:'var(--accent-light)'}},newVal||'(пусто)')
          )
        ));

      diffRow('Аватар URL',r.oldData&&r.oldData.avatarUrl,r.newData&&r.newData.avatarUrl);
      diffRow('Описание / Bio',r.oldData&&r.oldData.bio,r.newData&&r.newData.bio);
      card.appendChild(diff);
      card.appendChild(el('div',{class:'flex gap-2 mt-3'},
        el('button',{class:'btn btn-primary btn-sm',onclick:async()=>{
          try{
            await RTDB.update('users/'+r.userId,r.newData);
            await RTDB.update('profileRequests/'+r.id,{status:'APPROVED',reviewedAt:new Date().toISOString(),reviewedBy:App.userProfile.id});
            toast('Запрос одобрен','Профиль игрока обновлён','success');
          }catch(e){toast('Ошибка',e.message,'error')}
        }},el('span',{html:ICONS.check}),'Одобрить'),
        el('button',{class:'btn btn-ghost btn-sm text-danger',onclick:async()=>{
          const ok=await ConfirmDialog('Отклонить запрос?','Запрос на изменение профиля будет удалён без возможности восстановления.','Отклонить','Отмена',{danger:true});
          if(!ok)return;
          try{
            await RTDB.remove('profileRequests/'+r.id);
            toast('Запрос отклонён','','info');
          }catch(e){toast('Ошибка',e.message,'error')}
        }},el('span',{html:ICONS.close}),'Отклонить')
      ));
      wrap.appendChild(card);
    });
  }
  return wrap;
}

      isAdmin?el('div',{class:'flex items-center gap-2'},
        (()=>{const inp=el('input',{type:'number',min:'1',value:'1',style:{width:'60px',padding:'4px 8px',background:'rgba(10,15,15,0.6)',border:'1px solid var(--border)',borderRadius:'4px',color:'var(--fg)',fontFamily:'Cormorant Garamond,serif'}});return inp})(),

          const inputEl=e.target.previousElementSibling;

      }},'Очистить все эффекты')));
    }

    canEdit?el('div',{class:'flex gap-2'},

      ));

  });
  /* === Асинхронная очистка старых recentChanges (>7 дней) === */
  if(Array.isArray(faction.recentChanges)&&faction.recentChanges.length>0){
    const cleaned=pruneRecentChanges(faction.recentChanges);
    if(cleaned.length!==faction.recentChanges.length){
      RTDB.update('factions/'+faction.id,{recentChanges:cleaned}).catch(()=>{});
    }
  }
  return wrap;
}
function pluralFields(n){return n===1?'поле':(n>=2&&n<=4?'поля':'полей')}

/* ====== ВАРИАНТ D: карточки полей вместо stat-field блоков ====== */
function renderFieldCards(section,faction){
  if(!section||!section.fields||section.fields.length===0){
    return el('p',{class:'text-muted italic text-sm'},'Нет данных');
  }
  const isAdmin=App.userProfile&&App.userProfile.role==='ADMIN';
  const wrap=el('div',{class:'cards-grid'});
  let renderedCount=0;
  section.fields.forEach(f=>{
    const recent=faction?findRecentChange(faction,section.id,f.id):null;
    const deltaText=recent&&recent.delta!=null?formatDeltaBadge(recent.delta):'';
    const isUp=recent&&recent.delta!=null&&Number(recent.delta)>0;
    const isDown=recent&&recent.delta!=null&&Number(recent.delta)<0;
    if(f.type==='list'){
      const items=Array.isArray(f.value)?f.value.filter(Boolean):[];
      const cardClasses='field-card list-card'+(recent?' changed':'')+(isDown?' down':'');
      const card=el('div',{class:cardClasses,onclick:isAdmin?()=>openQuickEdit(faction,section,f):null});
      card.appendChild(el('div',{class:'list-card-label'},f.label+(items.length?(' ('+items.length+')'):'')));
      if(items.length===0){
        card.appendChild(el('p',{class:'text-muted text-xs italic'},isAdmin?'Пусто — нажмите, чтобы заполнить':'Нет данных'));
      }else{
        items.forEach(it=>card.appendChild(el('div',{class:'list-card-item'},String(it))));
      }
      if(recent&&recent.delta!=null){
        card.appendChild(el('div',{class:'field-card-delta '+(isUp?'up':'down')},deltaText));
      }
      wrap.appendChild(card);
      renderedCount++;
    }else if(f.type==='number'){
      const num=typeof f.value==='number'?f.value:(Number(f.value)||0);
      const cardClasses='field-card'+(recent?' changed':'')+(isDown?' down':'');
      const card=el('div',{class:cardClasses,onclick:isAdmin?()=>openQuickEdit(faction,section,f):null});
      const iconName=getFieldIcon(f.label);
      card.appendChild(el('div',{class:'field-card-icon',html:ICONS[iconName]||ICONS.file}));
      card.appendChild(el('div',{class:'field-card-label'},f.label));
      /* Извлечь единицу измерения из названия поля (например, «Доход/мес (солей)» → «солей») */
      const unitMatch=/\(([^)]+)\)/.exec(f.label);
      const unit=unitMatch?unitMatch[1]:'';
      const valEl=el('div',{class:'field-card-value'});
      valEl.appendChild(document.createTextNode(formatNumber(num)+' '));
      if(unit)valEl.appendChild(el('span',{class:'field-card-unit'},unit));
      card.appendChild(valEl);
      if(isAdmin){
        card.appendChild(el('div',{class:'field-card-edit',html:ICONS.edit}));
      }
      if(recent&&recent.delta!=null){
        card.appendChild(el('div',{class:'field-card-delta '+(isUp?'up':'down')},deltaText));
      }
      wrap.appendChild(card);
      renderedCount++;
    }else{
      /* text */
      const txt=f.value==null?'':String(f.value);
      const cardClasses='field-card text-card'+(recent?' changed':'')+(isDown?' down':'');
      const card=el('div',{class:cardClasses,onclick:isAdmin?()=>openQuickEdit(faction,section,f):null});
      const iconName=getFieldIcon(f.label);
      card.appendChild(el('div',{class:'field-card-icon',html:ICONS[iconName]||ICONS.file}));
      card.appendChild(el('div',{class:'field-card-label'},f.label));
      if(txt){
        card.appendChild(el('div',{class:'field-card-value-text'},txt));
      }else{
        card.appendChild(el('p',{class:'text-muted text-xs italic'},isAdmin?'Пусто — нажмите, чтобы заполнить':'Нет данных'));
      }
      if(isAdmin){
        card.appendChild(el('div',{class:'field-card-edit',html:ICONS.edit}));
      }
      if(recent&&recent.delta!=null){
        card.appendChild(el('div',{class:'field-card-delta '+(isUp?'up':'down')},deltaText));
      }
      wrap.appendChild(card);
      renderedCount++;
    }
  });
  if(renderedCount===0)return el('p',{class:'text-muted italic text-sm'},'Нет данных');
  return wrap;
}

/* ====== Быстрое редактирование поля (модал) — ВАРИАНТ D ====== */
function openQuickEdit(faction,section,field){
  if(!faction||!section||!field)return;
  /* Закрыть возможный предыдущий */
  const existing=document.querySelector('.quick-edit-modal');
  if(existing)existing.remove();
  const overlay=el('div',{class:'modal-overlay'});
  const modal=el('div',{class:'quick-edit-modal'});
  modal.appendChild(el('h3',{},el('span',{html:ICONS.edit}),'Редактировать поле'));
  const labelInput=el('input',{value:field.label||''});
  modal.appendChild(el('label',{},'Название поля'));
  modal.appendChild(labelInput);
  /* Текущее значение — глубокая копия */
  let currentValue;
  if(field.type==='list'){
    currentValue=Array.isArray(field.value)?field.value.slice():[];
  }else if(field.type==='number'){
    currentValue=typeof field.value==='number'?field.value:(Number(field.value)||0);
  }else{
    currentValue=field.value==null?'':String(field.value);
  }
  modal.appendChild(el('label',{},'Значение'));
  let valueEl;
  if(field.type==='list'){
    valueEl=el('textarea',{});;
    valueEl.value=currentValue.join('\n');
  }else if(field.type==='number'){
    valueEl=el('input',{type:'number',step:'any'});
    valueEl.value=String(currentValue);
  }else{
    valueEl=el('textarea',{});
    valueEl.value=String(currentValue);
  }
  modal.appendChild(valueEl);
  const actions=el('div',{class:'quick-edit-actions'},
    el('button',{class:'btn btn-ghost',onclick:()=>overlay.remove()},'Отмена'),
    el('button',{class:'btn btn-primary'},el('span',{html:ICONS.save}),'Сохранить')
  );
  modal.appendChild(actions);
  overlay.appendChild(modal);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});
  document.addEventListener('keydown',function handler(e){
    if(e.key==='Escape'){overlay.remove();document.removeEventListener('keydown',handler)}
  });
  document.body.appendChild(overlay);
  setTimeout(()=>labelInput.focus(),10);
  /* Save handler */
  actions.querySelector('.btn-primary').addEventListener('click',async ()=>{
    const newLabel=(labelInput.value||'').trim()||field.label;
    let newValue;
    if(field.type==='list'){
      newValue=valueEl.value.split('\n').map(s=>s.trim()).filter(Boolean);
    }else if(field.type==='number'){
      newValue=Number(valueEl.value)||0;
    }else{
      newValue=valueEl.value;
    }
    /* Построить новый stats с обновлённым полем */
    const stats=migrateStats(faction.stats||[]).map(s=>({...s,fields:s.fields.map(fld=>({...fld}))}));
    const sec=stats.find(s=>s.id===section.id);
    if(!sec){toast('Ошибка','Секция не найдена','error');overlay.remove();return}
    const fld=sec.fields.find(ff=>ff.id===field.id);
    if(!fld){toast('Ошибка','Поле не найдено','error');overlay.remove();return}
    fld.label=newLabel;
    fld.value=newValue;
    try{
      await RTDB.update('factions/'+faction.id,{stats});
      toast('Поле обновлено','','success');
      overlay.remove();
      App.render();
    }catch(e){toast('Ошибка',e.message,'error')}
  });
}
function formatNumber(n){
  if(typeof n!=='number')n=Number(n)||0;
  return n.toLocaleString('ru-RU');
}

/* ====== Редактор секции (полностью гибкий) ====== */
function openStatEditor(faction,section){

  function renderFields(){
    fieldsList.innerHTML='';
    if(local.fields.length===0){
      fieldsList.appendChild(el('p',{class:'text-muted italic text-xs',style:{padding:'12px',textAlign:'center',border:'1px dashed var(--border)',borderRadius:'6px'}},'В секции нет полей. Добавьте новое поле ниже.'));

    local.fields.forEach((f,idx)=>{

      const typeBadge=el('span',{class:'badge'},f.type==='number'?'Число':(f.type==='list'?'Список':'Текст'));
      const delBtn=el('button',{type:'button',class:'btn btn-ghost btn-icon btn-sm text-danger',onclick:()=>{local.fields.splice(idx,1);renderFields()}},el('span',{html:ICONS.trash}));
      top.appendChild(labelInput);top.appendChild(typeBadge);top.appendChild(delBtn);
      item.appendChild(top);

async function moveSection(faction,sectionId,direction){
  const stats=migrateStats(faction.stats||[]);
  const idx=stats.findIndex(s=>s.id===sectionId);
  if(idx<0)return;
  const newIdx=idx+direction;
  if(newIdx<0||newIdx>=stats.length)return;
  const tmp=stats[idx];stats[idx]=stats[newIdx];stats[newIdx]=tmp;
  /* Переписать order */
  stats.forEach((s,i)=>s.order=i);
  try{
    await RTDB.update('factions/'+faction.id,{stats});
    toast('Секция перемещена','','info');
  }catch(e){toast('Ошибка',e.message,'error')}
}

async function deleteSection(faction,sectionId){

  if(!ok)return;
  const stats=migrateStats(faction.stats||[]).filter(s=>s.id!==sectionId);

    await RTDB.update('factions/'+faction.id,{stats});
    toast('Секция удалена','','info');
  }catch(e){toast('Ошибка',e.message,'error')}
}

/* ====== Применение pendingEffects (N тиков) ====== */
async function applyPendingEffectsNTurns(faction,turns,onlyIdx){
  try{
    const stats=migrateStats(faction.stats||[]);
    let pending=Array.isArray(faction.pendingEffects)?faction.pendingEffects.map(e=>({...e})):[];
    const updates=[];
    for(let i=0;i<turns;i++){
      let applied=false;
      const toRemove=[];
      pending.forEach((eff,idx)=>{
        if(onlyIdx!==undefined&&idx!==onlyIdx)return;
        /* Применить один тик */
        const section=stats.find(s=>s.id===eff.targetSectionId);
        if(section){
          const field=findField(section,eff.targetFieldId);
          if(field){
            field.value=applyEffectToValue(field.value,{...eff,fieldType:field.type});
            applied=true;
            if(eff.timing==='over_turns'){
              eff.turns=(eff.turns||0)-1;
              if(eff.turns<=0)toRemove.push(idx);
            }
            /* per_turn — остаётся в pending */
          }else{
            toRemove.push(idx);
          }
        }else{
          toRemove.push(idx);
        }
      });
      /* Удалить завершённые (с конца) */
      toRemove.reverse().forEach(idx=>pending.splice(idx,1));
      if(!applied)break;
      if(pending.length===0)break;
      if(onlyIdx!==undefined)break;
    }
    await RTDB.update('factions/'+faction.id,{stats,pendingEffects:pending});
    toast('Эффекты применены','','success');
  }catch(e){toast('Ошибка',e.message,'error')}
}

/* ====== Дельта-журнал: блок «Изменения в статистике» (ВАРИАНТ D) ====== */
function renderDeltaJournal(changes,verdict){
  const wrap=el('div',{class:'delta-banner'});
  wrap.appendChild(el('div',{class:'delta-banner-title'},el('span',{html:ICONS.stats}),'Изменения в статистике ('+(verdict&&verdict.applied?'применены':'черновик')+')'));
  changes.forEach(ch=>{
    const isAdd=ch.operation==='add';
    const isSub=ch.operation==='subtract';
    const isSet=ch.operation==='set';
    const iconCls=isAdd?'up':(isSub?'down':'set');
    const iconName=isAdd?'arrowUp':(isSub?'arrowDown':'equals');
    const row=el('div',{class:'delta-row'});
    row.appendChild(el('div',{class:'delta-row-icon '+iconCls,html:ICONS[iconName]||ICONS.equals}));
    const content=el('div',{class:'delta-row-content'});
    content.appendChild(el('div',{class:'delta-row-field'},ch.fieldName||'поле'));
    const changeEl=el('div',{class:'delta-row-change'});
    if(ch.oldValue!==undefined&&ch.newValue!==undefined){
      /* Format old value */
      let oldStr=ch.oldValue, newStr=ch.newValue;
      if(typeof ch.oldValue==='number'||(typeof ch.oldValue==='string'&&/^-?\d+(\.\d+)?$/.test(ch.oldValue))){
        oldStr=formatNumber(Number(ch.oldValue)||0);
        newStr=formatNumber(Number(ch.newValue)||0);
      }
      changeEl.appendChild(el('span',{class:'old'},String(oldStr)));
      changeEl.appendChild(el('span',{class:'arrow'},'→'));
      changeEl.appendChild(el('span',{class:'new'},String(newStr)));
      if(isAdd||isSub){
        const amt=Number(ch.value)||0;
        const sign=isAdd?'+':'−';
        changeEl.appendChild(el('span',{class:'amount '+(isAdd?'up':'down')},sign+formatNumber(Math.abs(amt))));
      }
    }else if(isSet){
      /* old verdicts may not have oldValue/newValue — just show value */
      let valStr=ch.value;
      if(typeof ch.value==='number'||(typeof ch.value==='string'&&/^-?\d+(\.\d+)?$/.test(ch.value))){
        valStr=formatNumber(Number(ch.value)||0);
      }
      changeEl.appendChild(el('span',{class:'amount',style:{color:'var(--accent-light)'}},'= '+String(valStr)));
    }else{
      const amt=Number(ch.value)||0;
      const sign=isAdd?'+':'−';
      changeEl.appendChild(el('span',{class:'amount '+(isAdd?'up':'down')},sign+formatNumber(Math.abs(amt))));
    }
    content.appendChild(changeEl);
    if(ch.note){
      content.appendChild(el('div',{class:'delta-row-note'},ch.note));
    }
    row.appendChild(content);
    wrap.appendChild(row);
  });
  return wrap;
}

  card.appendChild(el('div',{class:'markdown',html:mdToHtml(post.content)}));
  if(post.context){
    card.appendChild(el('div',{class:'card mt-4',style:{background:'rgba(24,33,31,0.4)'}},el('p',{class:'label'},'Контекст'),el('p',{class:'text-sm italic'},post.context)));
  }
  if(post.attachments&&post.attachments.length){
    card.appendChild(el('div',{class:'mt-4'},
      el('p',{class:'label'},'Вложения'),
      el('div',{class:'stat-grid-2'},
        ...post.attachments.map(a=>
          el('a',{href:a.filePath,target:'_blank',class:'flex items-center gap-2',style:{padding:'8px',borderRadius:'6px',background:'rgba(24,33,31,0.4)',border:'1px solid var(--border)',textDecoration:'none'}},
            a.fileType==='IMAGE'?el('img',{src:a.filePath,alt:a.fileName,style:{width:'40px',height:'40px',borderRadius:'4px',objectFit:'cover'}}):
            el('div',{style:{width:'40px',height:'40px',borderRadius:'4px',background:'rgba(24,33,31,0.6)',display:'flex',alignItems:'center',justifyContent:'center'},html:ICONS.file}),
            el('div',{},el('div',{class:'text-xs'},a.fileName),el('div',{class:'text-muted',style:{fontSize:'10px'}},(a.fileSize/1024).toFixed(1)+' КБ'))
          )
        )
      )
    ));
  }
  wrap.appendChild(card);
  const verdict=post.verdict;
  if(verdict){
    const vts=RTDB.ts(verdict.createdAt);
    const vCard=el('div',{class:'card',style:{background:'linear-gradient(135deg,rgba(58,125,116,0.1),rgba(17,24,26,0.4))',borderColor:'rgba(58,125,116,0.3)'}});
    vCard.appendChild(el('div',{class:'flex items-center gap-2 mb-3'},
      el('div',{class:'stat-section-icon',html:ICONS.shield}),
      el('div',{},el('h2',{class:'text-accent',style:{fontSize:'16px'}},'Вердикт администратора'),el('p',{class:'text-muted',style:{fontSize:'10px'}},(verdict.adminName||'')+' · '+fmtDate(vts)))
    ));
    vCard.appendChild(el('div',{class:'ornament',style:{opacity:'0.3',marginBottom:'16px'}}));
    vCard.appendChild(el('div',{class:'markdown',html:mdToHtml(verdict.roleplayText)}));
    if(verdict.technicalText){
      vCard.appendChild(el('div',{class:'card mt-4',style:{background:'rgba(24,33,31,0.4)'}},el('p',{class:'label'},'Техническая часть'),el('p',{class:'text-sm',style:{whiteSpace:'pre-wrap'}},verdict.technicalText)));
    }
    if(verdict.effects&&verdict.effects.length){
      vCard.appendChild(el('div',{class:'card mt-4',style:{background:'rgba(24,33,31,0.4)'}},
        el('p',{class:'label'},'Применённые эффекты на статистику'),
        el('div',{class:'flex flex-col gap-1 mt-2'},
          ...verdict.effects.map(eff=>el('div',{class:'effect-row'},
            el('div',{class:'effect-info'},
              el('div',{class:'effect-target'},eff.fieldName||'поле'),
              el('div',{class:'effect-detail'},modeLabel(eff.mode)+' '+eff.amount+' · '+(eff.timing==='instant'?'мгновенно':eff.timing==='per_turn'?'каждый ход':'ходов: '+eff.turns)),
              eff.note?el('div',{class:'effect-note'},eff.note):null
            )
          ))
        )
      ));
    }
    /* === Дельта-журнал изменений статистики (ВАРИАНТ D) === */
    if(Array.isArray(verdict.changes)&&verdict.changes.length>0){
      vCard.appendChild(renderDeltaJournal(verdict.changes,verdict));
    }
    wrap.appendChild(vCard);
  }else{
    wrap.appendChild(el('div',{class:'card text-center',style:{background:'rgba(212,165,67,0.05)',borderColor:'rgba(212,165,67,0.2)'}},
      el('div',{html:ICONS.clock,style:{color:'rgba(212,165,67,0.6)',margin:'0 auto 8px',width:'32px',height:'32px'}}),
      el('p',{class:'text-warning'},'Пост ожидает вердикта администратора')
    ));
  }
  return wrap;
}

/* ====== ADMIN POSTS VIEW ====== */
function AdminPostsView(){
  const wrap=el('div',{class:'flex flex-col gap-4'});
  if(App.selectedId&&App.selectedId!=='__new__'){
    const post=App.cache.posts.find(p=>p.id===App.selectedId);
    if(post){wrap.appendChild(VerdictEditor(post));return wrap}
  }
  const filter=App._postFilter||'PENDING';
  wrap.appendChild(PageHeader('Все посты','Вынесение вердиктов по постам игроков'));
  const tabs=el('div',{class:'flex gap-2 mb-4'});
  [['PENDING','Ожидают'],['VERDICTED','С вердиктом'],['ALL','Все']].forEach(([k,label])=>{
    const count=k==='ALL'?App.cache.posts.length:App.cache.posts.filter(p=>p.status===k).length;
    tabs.appendChild(el('button',{class:'btn '+(filter===k?'btn-primary':'btn-ghost'),onclick:()=>{App._postFilter=k;App.render()}},label+' ('+count+')'));
  });
  wrap.appendChild(tabs);
  const filtered=filter==='ALL'?App.cache.posts:App.cache.posts.filter(p=>p.status===filter);
  if(filtered.length===0){
    wrap.appendChild(EmptyState('file','Постов нет','В выбранной категории постов не найдено'));
  }else{
    /* Поиск */
    const state={q:''};
    wrap.appendChild(SearchInput('Поиск по постам игроков...',state.q,v=>{state.q=v;renderList()}));
    const listHolder=el('div',{class:'flex flex-col gap-2'});
    wrap.appendChild(listHolder);
    function renderList(){
      listHolder.innerHTML='';
      const q=state.q.toLowerCase().trim();
      let list=filtered;
      if(q)list=list.filter(p=>((p.title||'')+(p.content||'')+(p.authorName||'')).toLowerCase().includes(q));
      if(list.length===0){
        listHolder.appendChild(EmptyState('search','Ничего не найдено','Попробуйте изменить запрос'));
        return;
      }
      list.forEach(post=>{
        const faction=App.cache.factions.find(f=>f.id===post.factionId);
        const ts=RTDB.ts(post.createdAt);
        const card=el('div',{class:'card card-hover',style:{position:'relative'},onclick:()=>App.setView('admin-posts',post.id)});
        /* === Кнопка удаления (админ может удалять любые посты) === */
        const delBtn=el('button',{class:'post-card-delete','data-tooltip':'Удалить пост','aria-label':'Удалить пост',onclick:async (e)=>{
          e.stopPropagation();
          e.preventDefault();
          const hasVerdict=post.status==='VERDICTED';
          const msg=hasVerdict?'Пост и его вердикт будут удалены без возможности восстановления. Вердикт будет утерян, изменения статистики не отменяются.':'Пост будет удалён без возможности восстановления.';
          const ok=await ConfirmDialog('Удалить пост?',msg,'Удалить','Отмена',{danger:true});
          if(!ok)return;
          try{
            await RTDB.remove('posts/'+post.id);
            toast('Пост удалён','','info');
          }catch(err){toast('Ошибка',err.message,'error')}
        }},el('span',{html:ICONS.trash}));
        card.appendChild(delBtn);
        card.appendChild(el('div',{class:'flex items-start justify-between gap-3'},
          el('div',{class:'flex-1 min-w-0'},
            el('div',{class:'flex items-center gap-2 mb-2',style:{flexWrap:'wrap'}},
              post.status==='PENDING'?el('span',{class:'badge badge-warning',html:ICONS.clock+' Ожидает'}):el('span',{class:'badge badge-success',html:ICONS.check+' Вердикт'}),
              faction?el('span',{class:'badge badge-accent',html:ICONS.shield+' '+faction.name}):null,
              post.turnNumber?el('span',{class:'badge'},'Ход '+post.turnNumber):null
            ),
            el('div',{class:'text-sm',style:{fontFamily:'Cinzel,serif',fontWeight:'600'}},post.title),
            el('p',{class:'text-muted text-xs mt-1',style:{display:'-webkit-box',WebkitLineClamp:'2',WebkitBoxOrient:'vertical',overflow:'hidden'}},post.content),
            el('p',{class:'text-muted',style:{fontSize:'10px',marginTop:'6px',opacity:'0.6'}},(post.authorName||'')+' · '+fmtDate(ts))
          ),
          el('span',{html:ICONS.chevron,style:{color:'var(--fg-dim)',flexShrink:'0',marginTop:'4px'}})
        ));
        listHolder.appendChild(card);
      });
    }
    renderList();
  }
  return wrap;
}
function VerdictEditor(post){
  const wrap=el('div',{class:'flex flex-col gap-4'});
  wrap.appendChild(el('button',{class:'btn btn-ghost btn-sm',style:{alignSelf:'flex-start'},onclick:()=>App.setView('admin-posts')},el('span',{html:ICONS.back}),'Назад к постам'));
  const faction=App.cache.factions.find(f=>f.id===post.factionId);
  const existingVerdict=post.verdict;
  const state={
    roleplayText:existingVerdict?existingVerdict.roleplayText:'',
    technicalText:existingVerdict?existingVerdict.technicalText:'',
    changes:existingVerdict&&Array.isArray(existingVerdict.changes)?JSON.parse(JSON.stringify(existingVerdict.changes)):[],
    showChangeForm:false
  };
  const postCard=el('div',{class:'card'});
  const ts=RTDB.ts(post.createdAt);
  postCard.appendChild(el('div',{class:'flex items-center gap-2 mb-3',style:{flexWrap:'wrap'}},
    faction?el('span',{class:'badge badge-accent',html:ICONS.shield+' '+faction.name}):null,
    post.turnNumber?el('span',{class:'badge'},'Ход '+post.turnNumber):null,
    el('span',{class:'text-muted',style:{fontSize:'10px',marginLeft:'auto'}},(post.authorName||'')+' · '+fmtDate(ts))
  ));
  postCard.appendChild(el('h2',{style:{fontSize:'18px',marginBottom:'8px'}},post.title));
  postCard.appendChild(el('div',{class:'ornament',style:{opacity:'0.3',marginBottom:'12px'}}));
  postCard.appendChild(el('div',{class:'markdown text-sm',html:mdToHtml(post.content)}));
  if(post.context){
    postCard.appendChild(el('div',{class:'card mt-3',style:{background:'rgba(24,33,31,0.4)'}},el('p',{class:'label'},'Контекст от автора'),el('p',{class:'text-sm italic'},post.context)));
  }
  wrap.appendChild(postCard);
  const editorCard=el('div',{class:'card card-glow',style:{background:'linear-gradient(135deg,rgba(58,125,116,0.05),rgba(17,24,26,0.4))',borderColor:'rgba(58,125,116,0.3)'}});
  editorCard.appendChild(el('div',{class:'flex items-center justify-between mb-4'},
    el('div',{class:'flex items-center gap-2'},
      el('div',{class:'stat-section-icon',html:ICONS.shield}),
      el('h2',{class:'text-accent',style:{fontSize:'16px'}},'Вердикт администратора'),
      existingVerdict?el('span',{class:'badge badge-success'},'Редактирование'):null
    ),
    existingVerdict?el('button',{class:'btn btn-ghost btn-sm text-danger',onclick:async()=>{
      const ok=await ConfirmDialog('Отозвать вердикт?','Статус поста вернётся к «Ожидает». Уже применённые изменения статистики фракции сохраняются.','Отозвать','Отмена',{danger:true});
      if(!ok)return;
      try{
        await RTDB.update('posts/'+post.id,{status:'PENDING',verdict:null});
        toast('Вердикт отозван','','info');
        App.setView('admin-posts');
      }catch(e){toast('Ошибка',e.message,'error')}
    }},el('span',{html:ICONS.trash}),'Отозвать'):null
  ));
  const form=el('form',{onsubmit:e=>{e.preventDefault();save()}});
  /* Progress bar: 1 обязательное поле (roleplayText) */
  const verdictProgress=FormProgress(()=>state.roleplayText.trim().length>=5?1:0,()=>1);
  form.appendChild(verdictProgress.wrap);
  const roleplayTa=WikiEditor(state.roleplayText,v=>{state.roleplayText=v;verdictProgress.update()},'Опишите, что произошло по итогам поста игрока... Поддерживается вики-разметка.',150);
  form.appendChild(el('div',{class:'field-group'},el('label',{class:'label'},'Ролевая часть (нарратив) *'),roleplayTa));
  form.appendChild(el('div',{class:'field-group'},el('label',{class:'label'},'Техническая часть (опц.)'),el('textarea',{class:'textarea',placeholder:'Технические пояснения...',style:{minHeight:'80px'},oninput:e=>state.technicalText=e.target.value},state.technicalText)));

  /* === Секция «Изменения в статистике» (ВАРИАНТ D — delta journal) === */
  const chSection=el('div',{class:'field-group'});
  chSection.appendChild(el('div',{class:'flex items-center justify-between'},
    el('label',{class:'label'},'Изменения в статистике'),
    el('button',{type:'button',class:'btn btn-ghost btn-sm',onclick:()=>{state.showChangeForm=!state.showChangeForm;renderChangeForm()}},el('span',{html:ICONS.plus}),'Добавить изменение')
  ));
  const chList=el('div',{class:'flex flex-col gap-2',style:{marginTop:'8px'}});
  chSection.appendChild(chList);
  const chFormWrap=el('div');
  chSection.appendChild(chFormWrap);

  function getFactionStats(){
    if(!faction)return [];
    return migrateStats(faction.stats||[]);
  }
  function renderChangesList(){
    chList.innerHTML='';
    if(state.changes.length===0){
      chList.appendChild(el('p',{class:'text-muted italic text-xs',style:{padding:'12px',textAlign:'center',border:'1px dashed var(--border)',borderRadius:'6px'}},'Нет изменений. Добавьте, чтобы обновить статистику фракции.'));
      return;
    }
    state.changes.forEach((ch,idx)=>{
      const isAdd=ch.operation==='add';
      const isSub=ch.operation==='subtract';
      const isSet=ch.operation==='set';
      const iconCls=isAdd?'up':(isSub?'down':'set');
      const iconName=isAdd?'arrowUp':(isSub?'arrowDown':'equals');
      const row=el('div',{class:'delta-row',style:{background:'rgba(24,33,31,0.4)',border:'1px solid var(--border)',borderRadius:'6px',padding:'8px 10px'}});
      row.appendChild(el('div',{class:'delta-row-icon '+iconCls,html:ICONS[iconName]||ICONS.equals}));
      const content=el('div',{class:'delta-row-content'});
      content.appendChild(el('div',{class:'delta-row-field'},ch.fieldName||'поле'));
      const changeLine=el('div',{class:'delta-row-change'});
      const opLabel=isAdd?'+':(isSub?'−':'=');
      const amountCls=isAdd?'up':(isSub?'down':'');
      let amountStr='';
      if(ch.value!==undefined&&ch.value!==null){
        if(typeof ch.value==='number'||(typeof ch.value==='string'&&/^-?\d+(\.\d+)?$/.test(ch.value))){
          amountStr=formatNumber(Number(ch.value)||0);
        }else if(Array.isArray(ch.value)){
          amountStr=ch.value.length+' пункт(ов)';
        }else{
          amountStr=String(ch.value).slice(0,40)+(String(ch.value).length>40?'…':'');
        }
      }
      changeLine.appendChild(el('span',{class:'amount '+amountCls,style:!amountCls?{color:'var(--accent-light)'}:{}},opLabel+' '+amountStr));
      content.appendChild(changeLine);
      if(ch.note){
        content.appendChild(el('div',{class:'delta-row-note'},ch.note));
      }
      row.appendChild(content);
      row.appendChild(el('button',{type:'button',class:'btn btn-ghost btn-icon btn-sm text-danger',style:{alignSelf:'center'},onclick:()=>{state.changes.splice(idx,1);renderChangesList()}},el('span',{html:ICONS.close})));
      chList.appendChild(row);
    });
  }
  function renderChangeForm(){
    chFormWrap.innerHTML='';
    if(!state.showChangeForm)return;
    if(!faction){
      chFormWrap.appendChild(el('div',{class:'card',style:{background:'rgba(212,165,67,0.05)',borderColor:'rgba(212,165,67,0.25)',padding:'10px'}},
        el('p',{class:'text-xs text-warning'},'У автора поста нет фракции. Невозможно создать изменение статистики.')
      ));
      return;
    }
    const stats=getFactionStats();
    const local={sectionId:'',fieldId:'',operation:'add',value:0,note:''};
    const formInner=el('div',{class:'card',style:{background:'rgba(58,125,116,0.05)',borderColor:'rgba(58,125,116,0.25)',padding:'12px'}});
    formInner.appendChild(el('div',{class:'label'},'Новое изменение'));
    /* Row 1: section + field */
    const row1=el('div',{class:'stat-grid-2 mb-2'});
    const sectionSel=el('select',{class:'select',onchange:()=>{
      local.sectionId=sectionSel.value;
      local.fieldId='';
      rebuildFieldSelect();
      updateValueInput();
    }});
    sectionSel.appendChild(el('option',{value:''},'— Выберите секцию —'));
    stats.forEach(s=>sectionSel.appendChild(el('option',{value:s.id},s.title)));
    row1.appendChild(el('div',{},el('label',{class:'label',style:{fontSize:'10px'}},'Секция'),sectionSel));
    const fieldSelWrap=el('div',{},el('label',{class:'label',style:{fontSize:'10px'}},'Поле'));
    row1.appendChild(fieldSelWrap);
    formInner.appendChild(row1);
    function rebuildFieldSelect(){
      const oldFieldSel=fieldSelWrap.querySelector('select');
      if(oldFieldSel)oldFieldSel.remove();
      const fieldSel=el('select',{class:'select',onchange:()=>{
        local.fieldId=fieldSel.value;
        const sec=stats.find(s=>s.id===local.sectionId);
        const f=findField(sec,local.fieldId);
        /* Для list/text полей — только set */
        if(f&&(f.type==='list'||f.type==='text')){
          local.operation='set';
          rebuildOperationSelect();
        }
        updateValueInput();
      }});
      fieldSel.appendChild(el('option',{value:''},'— Выберите поле —'));
      const sec=stats.find(s=>s.id===local.sectionId);
      if(sec){
        sec.fields.forEach(f=>fieldSel.appendChild(el('option',{value:f.id},f.label+' ('+f.type+')')));
      }
      fieldSelWrap.appendChild(fieldSel);
    }
    /* Row 2: operation + value */
    const row2=el('div',{class:'stat-grid-2 mb-2'});
    const operationSelWrap=el('div',{},el('label',{class:'label',style:{fontSize:'10px'}},'Операция'));
    row2.appendChild(operationSelWrap);
    const valueWrap=el('div',{},el('label',{class:'label',style:{fontSize:'10px'}},'Значение'));
    row2.appendChild(valueWrap);
    formInner.appendChild(row2);
    function rebuildOperationSelect(){
      const oldOpSel=operationSelWrap.querySelector('select');
      if(oldOpSel)oldOpSel.remove();
      const opSel=el('select',{class:'select',onchange:()=>{local.operation=opSel.value;updateValueInput()}});
      const sec=stats.find(s=>s.id===local.sectionId);
      const f=findField(sec,local.fieldId);
      /* Для number — все 3 операции; для list/text — только set */
      if(f&&f.type==='number'){
        [['add','Добавить (+)'],['subtract','Вычесть (−)'],['set','Установить (=)']].forEach(([k,l])=>{
          const o=el('option',{value:k},l);if(k===local.operation)o.selected=true;opSel.appendChild(o);
        });
      }else{
        const o=el('option',{value:'set'},'Установить (=)');opSel.appendChild(o);
        local.operation='set';
      }
      operationSelWrap.appendChild(opSel);
    }
    function updateValueInput(){
      const old=valueWrap.querySelector('input,textarea');
      if(old)old.remove();
      const sec=stats.find(s=>s.id===local.sectionId);
      const f=findField(sec,local.fieldId);
      if(!f)return;
      /* Для list + set — textarea; для text + set — input; иначе — number input */
      if(f.type==='list'&&local.operation==='set'){
        const ta=el('textarea',{class:'textarea',style:{minHeight:'50px',fontSize:'12px'},placeholder:'Каждый пункт с новой строки',oninput:e=>local.value=e.target.value});
        valueWrap.appendChild(ta);
      }else if(f.type==='text'&&local.operation==='set'){
        const inp=el('input',{class:'input',style:{fontSize:'12px'},oninput:e=>local.value=e.target.value});
        valueWrap.appendChild(inp);
      }else{
        const inp=el('input',{class:'input',type:'number',step:'any',value:'0',style:{fontSize:'12px'},oninput:e=>local.value=Number(inp.value)||0});
        valueWrap.appendChild(inp);
      }
    }
    /* Row 3: note */
    formInner.appendChild(el('div',{class:'field-group'},
      el('label',{class:'label',style:{fontSize:'10px'}},'Комментарий (необязательно)'),
      el('input',{class:'input',style:{fontSize:'12px'},placeholder:'Например: Пошлины за покровительство караванов',oninput:e=>local.note=e.target.value})
    ));
    formInner.appendChild(el('div',{class:'flex gap-2 justify-end'},
      el('button',{type:'button',class:'btn btn-ghost btn-sm',onclick:()=>{state.showChangeForm=false;renderChangeForm()}},'Отмена'),
      el('button',{type:'button',class:'btn btn-primary btn-sm',onclick:()=>{
        if(!local.sectionId){toast('Ошибка','Выберите секцию','error');return}
        if(!local.fieldId){toast('Ошибка','Выберите поле','error');return}
        const sec=stats.find(s=>s.id===local.sectionId);
        const f=findField(sec,local.fieldId);
        if(!f){toast('Ошибка','Поле не найдено','error');return}
        /* Валидация значения */
        let val=local.value;
        if(f.type==='number'){
          if(typeof val!=='number'){val=Number(val)||0}
        }else if(f.type==='list'&&local.operation==='set'){
          if(typeof val==='string'){val=val.split('\n').map(s=>s.trim()).filter(Boolean)}
          else if(!Array.isArray(val)){val=[]}
        }else{
          val=String(val==null?'':val);
        }
        const ch={
          id:uid('chg'),
          sectionId:local.sectionId,
          fieldId:local.fieldId,
          fieldName:f.label,
          fieldType:f.type,
          operation:local.operation,
          value:val,
          note:local.note||''
        };
        state.changes.push(ch);
        state.showChangeForm=false;
        renderChangesList();
        renderChangeForm();
      }},el('span',{html:ICONS.plus}),'Добавить')
    ));
    chFormWrap.appendChild(formInner);
  }
  renderChangesList();
  renderChangeForm();
  form.appendChild(chSection);

  form.appendChild(el('div',{class:'flex justify-end gap-2',style:{marginTop:'8px'}},
    el('button',{type:'button',class:'btn btn-ghost',onclick:()=>App.setView('admin-posts')},'Отмена'),
    el('button',{type:'submit',class:'btn btn-primary'},el('span',{html:ICONS.save}),existingVerdict?'Обновить вердикт':'Вынести вердикт')
  ));
  editorCard.appendChild(form);
  wrap.appendChild(editorCard);
  async function save(){
    if(state.roleplayText.length<5){toast('Ошибка','Ролевая часть обязательна','error');return}
    const verdict={
      roleplayText:state.roleplayText,technicalText:state.technicalText,
      changes:state.changes,applied:true,
      adminId:App.userProfile.id,adminName:App.userProfile.name,
      createdAt:new Date().toISOString(),
    };
    try{
      await RTDB.update('posts/'+post.id,{status:'VERDICTED',verdict});
      if(faction&&state.changes.length){
        /* Применить changes к stats фракции + заполнить recentChanges */
        const {stats,recent}=applyVerdictChanges(faction.stats||[],state.changes);
        const existingRecent=Array.isArray(faction.recentChanges)?faction.recentChanges:[];
        const mergedRecent=pruneRecentChanges([...recent,...existingRecent]).slice(0,200);
        await RTDB.update('factions/'+faction.id,{stats,recentChanges:mergedRecent});
        /* Сохранить в вердикт oldValue/newValue для каждой change (для последующего отображения) */
        verdict.changes=state.changes.map(c=>({...c}));
      }
      await RTDB.update('posts/'+post.id,{verdict});
      toast('Вердикт вынесен',state.changes.length?'Статистика обновлена':'Вердикт сохранён','success');
      App.setView('admin-posts');
    }catch(e){toast('Ошибка',e.message,'error')}
  }
  return wrap;
}

      }

        list.sort((a,b)=>(a.title||'').localeCompare(b.title||'','ru'));

    renderList();
  }
  return wrap;
}

  if(_chatMsgUnsubs[chat.id]){_chatMsgUnsubs[chat.id]()}
  _chatMsgUnsubs[chat.id]=fbDb.ref('chats/'+chat.id+'/messages').on('value',snap=>{
    msgWrap.innerHTML='';
    const val=snap.val()||{};
    const messages=Object.entries(val).map(([id,m])=>({id,...(m||{})})).sort((a,b)=>{
      const da=a.createdAt,db=b.createdAt;
      if(typeof da==='number'&&typeof db==='number')return da-db;
      const ta=da?new Date(da).getTime():0,tb=db?new Date(db).getTime():0;
      return ta-tb;
    });
    if(messages.length===0){
      msgWrap.appendChild(el('p',{class:'text-center text-muted text-sm',style:{padding:'32px 0'}},'Сообщений пока нет'));
    }else{
      messages.forEach(m=>{
        const ts=RTDB.ts(m.createdAt);
        const user=App.cache.users.find(u=>u.id===m.userId)||{name:m.userId};
        const faction=App.cache.factions.find(f=>f.userId===m.userId);
        if(m.isSystem){
          msgWrap.appendChild(el('div',{class:'chat-msg-system'},m.content));
        }else{
          msgWrap.appendChild(el('div',{class:'chat-msg'},
            el('div',{class:'chat-msg-meta'},
              el('span',{class:'chat-msg-author'},user.name||'?'),
              faction?el('span',{class:'text-muted',style:{fontSize:'10px'}},'· '+faction.name):null,
              el('span',{class:'chat-msg-time'},new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}))
            ),
            el('div',{class:'chat-msg-bubble'},m.content)
          ));
        }
      });
    }
    msgWrap.scrollTop=msgWrap.scrollHeight;
  });
  if(chat.status!=='CLOSED'&&chat.status!=='SUMMARIZED'){
    const inputWrap=el('div',{class:'p-4',style:{borderTop:'1px solid var(--border)'}});

    card.appendChild(inputWrap);
    async function send(){
      const text=ta.value.trim();
      if(!text)return;
      try{
        await fbDb.ref('chats/'+chat.id+'/messages').push({
          content:text,userId:App.userProfile.id,userName:App.userProfile.name,isSystem:false,
          createdAt:new Date().toISOString(),
        });
        ta.value='';
      }catch(e){toast('Ошибка',e.message,'error')}
    }
  }
  wrap.appendChild(card);
  return wrap;

      forcesList.appendChild(item);
    });
    const approvedFactions=App.cache.factions.filter(f=>f.isApproved&&!(battle.forces||[]).some(fo=>fo.factionId===f.id));
    if(approvedFactions.length>0){
      const sel=el('select',{class:'select',style:{marginTop:'8px',borderStyle:'dashed'}},el('option',{value:''},'+ Добавить фракцию'));
      approvedFactions.forEach(f=>sel.appendChild(el('option',{value:f.id},f.name)));
      sel.onchange=async e=>{
        if(e.target.value){
          battle.forces=battle.forces||[];
          battle.forces.push({factionId:e.target.value,commander:'',infantry:0,archers:0,cavalry:0,fleet:0});
          battle.participants=battle.participants||[];
          if(!battle.participants.some(p=>p.factionId===e.target.value)){battle.participants.push({factionId:e.target.value,hasPosted:false})}
          try{await RTDB.update('battles/'+battle.id,{forces:battle.forces,participants:battle.participants})}catch(err){toast('Ошибка',err.message,'error')}
        }
      };
      forcesList.appendChild(sel);
    }
  }
  renderForces();
  card.appendChild(el('div',{class:'field-group'},el('label',{class:'label'},'Силы сторон'),forcesList));
  wrap.appendChild(card);
  return wrap;
}
